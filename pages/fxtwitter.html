<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fxtwitter</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    :root {
      --x-bg: var(--bg-main, #141311);
      --x-border: var(--border, #2b2822);
      --x-text-main: var(--fg-main, #d6d1c4);
      --x-text-sub: var(--fg-muted, #8c877d);
      --x-accent: var(--accent, #e6b450);
      --x-hover: var(--bg-hover, #26241f);
      --x-card-bg: var(--bg-hover, #26241f);
    }

    body {
      padding: 40px;
      overflow-y: auto;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 14px 80px 14px !important;
      }
    }

    .x-app-container {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .x-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 8px;
    }

    .x-header-title {
      font-size: 24px;
      font-weight: 400;
      color: var(--fg-main);
    }

    .search-panel {
      display: flex;
      gap: 10px;
      align-items: stretch;
      position: relative;
    }

    @media (max-width: 600px) {
      .search-panel {
        flex-direction: column;
      }
    }

    .search-panel .ui-input {
      margin-bottom: 0;
      flex: 1;
      height: 42px;
    }

    .view-actions {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .btn-view {
      width: auto;
      margin-bottom: 0;
      height: 42px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-dropdown-cue {
      display: none;
      width: 12px;
      height: 12px;
      fill: currentColor;
      transition: transform 0.2s;
    }

    .has-post .btn-dropdown-cue {
      display: block;
    }

    .view-actions.has-post:hover .btn-dropdown-cue {
      transform: rotate(180deg);
    }

    .links-popup {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      padding: 12px 14px;
      font-size: 12px;
      font-family: var(--font-ui);
      width: max-content;
      min-width: 360px;
      max-width: 90vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      flex-direction: column;
      gap: 10px;
      z-index: 250;
    }

    .view-actions.has-post:hover .links-popup,
    .links-popup:hover {
      display: flex;
    }

    .view-actions.has-post::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      height: 10px;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .link-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-info strong {
      color: var(--accent);
      margin-right: 6px;
    }

    .link-info a {
      color: var(--fg-main);
      font-size: 11px;
    }

    .btn-mini-action {
      width: auto;
      margin: 0;
      padding: 3px 8px;
      font-size: 10px;
      font-family: var(--font-ui);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .status-alert {
      padding: 12px 16px;
      font-size: 12px;
      font-family: var(--font-ui);
      display: none;
      border: 1px solid var(--border);
      background: var(--bg-hover);
    }

    .status-alert.error {
      display: block;
      color: var(--destructive);
      border-color: var(--destructive);
      background: rgba(204, 85, 85, 0.1);
    }

    .status-alert.loading {
      display: block;
      color: var(--accent);
      border-color: var(--accent);
    }

    .tweet-card {
      display: none;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      padding: 24px;
      flex-direction: column;
      gap: 16px;
    }

    .author-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      object-fit: cover;
      display: block;
      background: var(--bg-main);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .author-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .author-name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .display-name {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      line-height: 1.2;
    }

    .handle-name {
      font-size: 12px;
      color: var(--fg-muted);
      font-family: var(--font-ui);
      line-height: 1.2;
    }

    .time-stamp {
      font-size: 11px;
      color: var(--fg-muted);
      font-family: var(--font-ui);
    }

    .tweet-body {
      font-size: 15px;
      color: var(--fg-main);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.8;
      font-family: var(--font-text);
    }

    .media-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-mosaic-toggle {
      width: auto;
      margin: 0;
      padding: 4px 10px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-mosaic-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-mosaic-toggle svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .media-stream {
      margin-top: 4px;
    }

    .media-stream.mode-stacked {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .media-stream.mode-stacked img,
    .media-stream.mode-stacked video {
      width: 100%;
      height: auto;
      max-height: 700px;
      object-fit: contain;
      background: var(--bg-main);
      border: 1px solid var(--border);
      display: block;
      cursor: pointer;
    }

    .media-stream.mode-mosaic {
      display: grid;
      gap: 4px;
      max-height: 520px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-main);
    }

    .media-stream.mode-mosaic.mosaic-count-1 {
      grid-template-columns: 1fr;
    }

    .media-stream.mode-mosaic.mosaic-count-2 {
      grid-template-columns: 1fr 1fr;
      height: 360px;
    }

    .media-stream.mode-mosaic.mosaic-count-3 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 360px;
    }

    .media-stream.mode-mosaic.mosaic-count-3 > :first-child {
      grid-row: span 2;
    }

    .media-stream.mode-mosaic.mosaic-count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 400px;
    }

    .media-stream.mode-mosaic img,
    .media-stream.mode-mosaic video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      display: block;
      cursor: pointer;
    }

    .quote-block {
      border-left: 3px solid var(--accent);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--bg-main);
      padding: 14px 16px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quote-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quote-author {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .quote-label {
      font-size: 11px;
      font-family: var(--font-ui);
      color: var(--fg-muted);
    }

    .quote-author-link {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      text-decoration: none;
      cursor: pointer;
    }

    .quote-author-link:hover .quote-name {
      text-decoration: underline;
    }

    .quote-name {
      font-weight: bold;
      color: var(--accent);
      font-size: 13px;
      line-height: 1.2;
    }

    .quote-handle {
      color: var(--fg-muted);
      font-size: 11px;
      font-family: var(--font-ui);
      line-height: 1.2;
    }

    .quote-view-link {
      font-size: 11px;
      font-family: var(--font-ui);
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      margin-left: auto;
      white-space: nowrap;
    }

    .quote-view-link:hover {
      text-decoration: underline;
    }

    .actions-row {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      color: var(--fg-muted);
      font-size: 12px;
      font-family: var(--font-ui);
      flex-wrap: wrap;
    }

    .action-unit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      font-family: inherit;
      padding: 0;
      transition: color 0.15s;
    }

    .action-unit:hover {
      color: var(--accent);
    }

    .action-unit svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      color: var(--fg-main);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 14px;
      transition: color 0.15s, border-color 0.15s;
    }

    .lightbox-close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lightbox-img-wrapper {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img-wrapper img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: 1px solid var(--border);
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="x-app-container">
    <div class="x-header-bar">
      <div class="x-header-title">
        <span>fxtwitter</span>
      </div>
    </div>

    <div class="search-panel">
      <input 
        type="text" 
        id="urlInput" 
        class="ui-input"
        placeholder="paste post link (x.com or twitter.com)..." 
        autocomplete="off" 
        spellcheck="false"
      />
      <div class="view-actions" id="viewContainer">
        <button class="ui-btn btn-view" onclick="renderPost()">
          <span>view</span>
          <svg class="btn-dropdown-cue" viewBox="0 0 24 24">
            <path d="M3.543 8.96l1.414-1.42L12 14.59l7.043-7.05 1.414 1.42L12 17.41 3.543 8.96z"/>
          </svg>
        </button>
        <div class="links-popup" id="linksPopup">
          <div class="link-row">
            <div class="link-info">
              <strong>twitter (x):</strong><a id="twitterLink" href="#" target="_blank"></a>
            </div>
            <div style="display:flex; gap:6px;">
              <a id="twitterOpenBtn" href="#" target="_blank" class="ui-btn btn-mini-action" style="text-decoration:none;">open</a>
              <button class="ui-btn btn-mini-action" onclick="copyLink('twitterLink')">copy</button>
            </div>
          </div>
          <div class="link-row">
            <div class="link-info">
              <strong>fixupx:</strong><a id="fixupxLink" href="#" target="_blank"></a>
            </div>
            <div style="display:flex; gap:6px;">
              <a id="fixupxOpenBtn" href="#" target="_blank" class="ui-btn btn-mini-action" style="text-decoration:none;">open</a>
              <button class="ui-btn btn-mini-action" onclick="copyLink('fixupxLink')">copy</button>
            </div>
          </div>
          <div class="link-row">
            <div class="link-info">
              <strong>fxtwitter:</strong><a id="fxtwitterLink" href="#" target="_blank"></a>
            </div>
            <div style="display:flex; gap:6px;">
              <a id="fxtwitterOpenBtn" href="#" target="_blank" class="ui-btn btn-mini-action" style="text-decoration:none;">open</a>
              <button class="ui-btn btn-mini-action" onclick="copyLink('fxtwitterLink')">copy</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="status-alert" id="statusMessage"></div>

    <article class="tweet-card" id="tweetCard">
      <div class="author-section">
        <img id="userAvatar" class="user-avatar" src="" alt="" />
        <div class="author-info">
          <div class="author-name-row">
            <span class="display-name" id="userName"></span>
            <span class="handle-name" id="userHandle"></span>
          </div>
          <span class="time-stamp" id="postTime"></span>
        </div>
      </div>

      <div class="tweet-body" id="postText"></div>

      <div class="media-toolbar" id="mediaToolbar" style="display: none;">
        <button class="ui-btn btn-mosaic-toggle" id="mosaicToggleBtn" onclick="toggleMosaicMode()">
          <svg viewBox="0 0 24 24">
            <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
          </svg>
          <span id="mosaicLabel">mosaic: off</span>
        </button>
      </div>

      <div class="media-stream mode-stacked" id="mediaContainer"></div>

      <div class="quote-block" id="quoteContainer" style="display: none;"></div>

      <div class="actions-row">
        <span class="action-unit">
          <svg viewBox="0 0 24 24">
            <path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/>
          </svg>
          <span id="statReplies">0</span>
        </span>

        <span class="action-unit">
          <svg viewBox="0 0 24 24">
            <path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/>
          </svg>
          <span id="statRetweets">0</span>
        </span>

        <span class="action-unit">
          <svg viewBox="0 0 24 24">
            <path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/>
          </svg>
          <span id="statLikes">0</span>
        </span>

        <span class="action-unit">
          <svg viewBox="0 0 24 24">
            <path d="M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z"/>
          </svg>
          <span id="statViews">0</span>
        </span>

        <button class="action-unit" onclick="copyTweetText()">
          <span>copy text</span>
        </button>
      </div>
    </article>
  </div>

  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close-btn" id="lightboxCloseBtn">✕</button>
    <div class="lightbox-img-wrapper" id="lightboxImgWrapper">
      <img id="lightboxImg" src="" alt="" />
    </div>
  </div>

  <div class="copy-toast" id="copy-toast">copied to clipboard</div>

  <script src="../../js/bg-canvas.js"></script>
  <script>
    let isMosaicMode = false;
    let currentMediaCount = 0;
    let rawTweetText = "";

    function syncTheme() {
      try {
        const parentTheme = window.parent && window.parent.document.documentElement.getAttribute('data-theme');
        if (parentTheme) {
          document.documentElement.setAttribute('data-theme', parentTheme);
          return;
        }
      } catch (e) {}

      const isDark = localStorage.getItem('dark-mode') !== 'false';
      const theme = localStorage.getItem('theme') || 'primary';
      document.documentElement.setAttribute('data-theme', !isDark ? 'light' : theme);
    }

    syncTheme();
    window.addEventListener('storage', (e) => {
      if (e.key === 'theme' || e.key === 'dark-mode') syncTheme();
    });
    window.onParentAuthChanged = syncTheme;

    function formatCount(num) {
      if (num == null) return "0";
      if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, "") + "m";
      if (num >= 10000) return Math.floor(num / 1000) + "k";
      if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, "") + "k";
      return num.toLocaleString();
    }

    function formatText(text) {
      if (!text) return "";
      let s = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      s = s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/#(\w+)/g, '<a href="https://x.com/hashtag/$1" target="_blank" rel="noopener">#$1</a>');
      s = s.replace(/@(\w+)/g, '<a href="https://x.com/$1" target="_blank" rel="noopener">@$1</a>');
      return s;
    }

    function notify(msg, type) {
      const el = document.getElementById("statusMessage");
      el.className = "status-alert " + type;
      el.textContent = msg;
    }

    function clearNotify() {
      const el = document.getElementById("statusMessage");
      el.className = "status-alert";
      el.textContent = "";
    }

    function showToast(text) {
      const toast = document.getElementById("copy-toast");
      if (!toast) return;
      toast.textContent = text || "copied to clipboard";
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function copyLink(id) {
      const href = document.getElementById(id).href;
      navigator.clipboard.writeText(href).then(() => {
        showToast("link copied");
      });
    }

    function copyTweetText() {
      if (!rawTweetText) return;
      navigator.clipboard.writeText(rawTweetText).then(() => {
        showToast("post text copied");
      });
    }

    function parseUrl(str) {
      try {
        const u = new URL(str.trim());
        const match = u.pathname.match(/(?:^|\/)([a-zA-Z0-9_]+)\/status(?:es)?\/(\d+)/i);
        if (match) return { user: match[1], id: match[2] };
        const idOnly = u.pathname.match(/\/(\d{5,})/);
        if (idOnly) return { user: "i", id: idOnly[1] };
      } catch (e) {
        const match = str.match(/([a-zA-Z0-9_]+)\/status(?:es)?\/(\d+)/i);
        if (match) return { user: match[1], id: match[2] };
      }
      return null;
    }

    function toggleMosaicMode() {
      isMosaicMode = !isMosaicMode;
      const mediaBox = document.getElementById("mediaContainer");
      const toggleBtn = document.getElementById("mosaicToggleBtn");
      const label = document.getElementById("mosaicLabel");

      if (isMosaicMode) {
        mediaBox.className = "media-stream mode-mosaic mosaic-count-" + Math.min(currentMediaCount, 4);
        toggleBtn.classList.add("active");
        label.textContent = "mosaic: on";
      } else {
        mediaBox.className = "media-stream mode-stacked";
        toggleBtn.classList.remove("active");
        label.textContent = "mosaic: off";
      }
    }

    function openLightbox(src) {
      const modal = document.getElementById("lightboxModal");
      const img = document.getElementById("lightboxImg");
      img.src = src;
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      const modal = document.getElementById("lightboxModal");
      modal.style.display = "none";
      document.getElementById("lightboxImg").src = "";
      document.body.style.overflow = "";
    }

    document.getElementById("lightboxCloseBtn").addEventListener("click", closeLightbox);

    document.getElementById("lightboxModal").addEventListener("click", (e) => {
      if (e.target.id === "lightboxModal" || e.target.id === "lightboxImgWrapper") {
        closeLightbox();
      }
    });

    window.addEventListener("keydown", (e) => {
      const modal = document.getElementById("lightboxModal");
      if (modal.style.display === "flex") {
        if (e.key === "Escape" || e.key === "Backspace") {
          e.preventDefault();
          closeLightbox();
        }
      }
    });

    window.loadPostByUrl = function(url) {
      document.getElementById("urlInput").value = url;
      renderPost();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    async function renderPost() {
      const input = document.getElementById("urlInput").value.trim();
      const card = document.getElementById("tweetCard");
      const viewContainer = document.getElementById("viewContainer");

      if (!input) {
        notify("please enter a post url", "error");
        return;
      }

      const parsed = parseUrl(input);
      if (!parsed) {
        notify("invalid post link format", "error");
        return;
      }

      const { user, id } = parsed;

      const twitterUrl = "https://x.com/" + user + "/status/" + id;
      const fixupUrl = "https://fixupx.com/" + user + "/status/" + id;
      const fxtwitUrl = "https://fxtwitter.com/" + user + "/status/" + id;

      document.getElementById("twitterLink").textContent = twitterUrl;
      document.getElementById("twitterLink").href = twitterUrl;
      document.getElementById("twitterOpenBtn").href = twitterUrl;

      document.getElementById("fixupxLink").textContent = fixupUrl;
      document.getElementById("fixupxLink").href = fixupUrl;
      document.getElementById("fixupxOpenBtn").href = fixupUrl;

      document.getElementById("fxtwitterLink").textContent = fxtwitUrl;
      document.getElementById("fxtwitterLink").href = fxtwitUrl;
      document.getElementById("fxtwitterOpenBtn").href = fxtwitUrl;

      notify("loading...", "loading");
      card.style.display = "none";

      try {
        const res = await fetch("https://api.fxtwitter.com/" + user + "/status/" + id);
        if (!res.ok) throw new Error(res.status);

        const data = await res.json();
        const tweet = data.tweet || data.status;
        if (!tweet) throw new Error("Not found");

        viewContainer.classList.add("has-post");

        const avatar = document.getElementById("userAvatar");
        avatar.src = tweet.author?.avatar_url || "";
        avatar.style.display = tweet.author?.avatar_url ? "block" : "none";

        document.getElementById("userName").textContent = tweet.author?.name || "";
        document.getElementById("userHandle").textContent = tweet.author?.screen_name ? "@" + tweet.author.screen_name : "";

        if (tweet.created_at) {
          const d = new Date(tweet.created_at);
          document.getElementById("postTime").textContent = d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        } else {
          document.getElementById("postTime").textContent = "";
        }

        rawTweetText = tweet.text || "";
        document.getElementById("postText").innerHTML = formatText(rawTweetText);

        document.getElementById("statReplies").textContent = formatCount(tweet.replies);
        document.getElementById("statRetweets").textContent = formatCount(tweet.retweets);
        document.getElementById("statLikes").textContent = formatCount(tweet.likes);
        document.getElementById("statViews").textContent = formatCount(tweet.views);

        const mediaBox = document.getElementById("mediaContainer");
        mediaBox.innerHTML = "";

        const photos = tweet.media?.photos || [];
        const videos = tweet.media?.videos || [];
        currentMediaCount = photos.length + videos.length;

        const mediaToolbar = document.getElementById("mediaToolbar");
        if (currentMediaCount > 1) {
          mediaToolbar.style.display = "flex";
        } else {
          mediaToolbar.style.display = "none";
        }

        isMosaicMode = false;
        mediaBox.className = "media-stream mode-stacked";
        const toggleBtn = document.getElementById("mosaicToggleBtn");
        toggleBtn.classList.remove("active");
        document.getElementById("mosaicLabel").textContent = "mosaic: off";

        photos.forEach(photo => {
          const img = document.createElement("img");
          img.src = photo.url;
          img.loading = "lazy";
          img.addEventListener("click", () => openLightbox(photo.url));
          mediaBox.appendChild(img);
        });

        videos.forEach(video => {
          const vid = document.createElement("video");
          vid.src = video.url;
          vid.controls = true;
          if (video.thumbnail_url) vid.poster = video.thumbnail_url;
          mediaBox.appendChild(vid);
        });

        const quote = document.getElementById("quoteContainer");
        if (tweet.quote) {
          const quoteUrl = tweet.quote.url || (tweet.quote.id && tweet.quote.author?.screen_name ? "https://x.com/" + tweet.quote.author.screen_name + "/status/" + tweet.quote.id : "");
          quote.style.display = "flex";
          quote.innerHTML = `
            <div class="quote-header">
              <div class="quote-author">
                <span class="quote-label">quoting</span>
                <a href="${quoteUrl || '#'}" class="quote-author-link" onclick="if('${quoteUrl}'){ event.preventDefault(); loadPostByUrl('${quoteUrl}'); }">
                  <span class="quote-name">${tweet.quote.author?.name || ""}</span>
                  <span class="quote-handle">@${tweet.quote.author?.screen_name || ""}</span>
                </a>
              </div>
              ${quoteUrl ? `<a href="${quoteUrl}" class="quote-view-link" onclick="event.preventDefault(); loadPostByUrl('${quoteUrl}');">view post ↗</a>` : ""}
            </div>
            <div class="tweet-body">${formatText(tweet.quote.text || "")}</div>
          `;
        } else {
          quote.style.display = "none";
        }

        clearNotify();
        card.style.display = "flex";
      } catch (err) {
        notify("failed to load post data", "error");
      }
    }

    document.getElementById("urlInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") renderPost();
    });
  </script>
</body>
</html>
