<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blogs</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid var(--border); padding-bottom:15px;">
            <h1 style="margin:0; font-size:32px;">blogs</h1>
            <div id="admin-add-blog-btn" style="display:none;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="addBlogInline()">+ add blog</button>
            </div>
        </div>
        <div id="blogs-container" class="flat-list-container" style="gap:24px;">
            <span style="color:var(--fg-muted);">loading blogs...</span>
        </div>
    </div>

    <div class="copy-toast" id="copy-toast" style="position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--bg-main); padding:10px 20px; font-family:var(--font-ui); font-size:12px; font-weight:bold; z-index:999; opacity:0; transition:opacity 0.2s;">link copied</div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let blogsList = [];
        let authorMap = {};
        let isAdminLocal = false;
        let isOwnerLocal = false;
        let currentUserId = null;
        marked.use({ breaks: true, gfm: true });

        function escapeAttr(str) { return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        async function formPrompt(fields, title) {
            if (window.parent && window.parent.guiForm) return window.parent.guiForm(fields, title);
            const result = {};
            for (const f of fields) {
                const val = prompt(f.label, f.value || '');
                if (val === null) return null;
                result[f.key] = val;
            }
            return result;
        }
        async function confirmAction(msg) {
            if (window.parent && window.parent.guiConfirm) return window.parent.guiConfirm(msg);
            return confirm(msg);
        }

        function authorTag(profile) {
            if (window.parent && window.parent.authorTagHTML) return window.parent.authorTagHTML(profile);
            if (!profile) return '';
            const label = profile.is_owner ? 'error dev' : (profile.username || 'unnamed');
            return `<span style="font-size:10px; color:var(--fg-muted); border:1px solid var(--border); padding:2px 6px; margin-left:6px;">${label}</span>`;
        }

        async function resolveAuthors(ids) {
            if (window.parent && window.parent.resolveAuthorsMap) return window.parent.resolveAuthorsMap(ids);
            const uniqueIds = [...new Set((ids || []).filter(Boolean))];
            if (!uniqueIds.length) return {};
            const { data } = await supabaseClient.from('profiles').select('id, username, is_owner, is_admin').in('id', uniqueIds);
            const map = {};
            (data || []).forEach(p => { map[p.id] = p; });
            return map;
        }

        async function initBlogsPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                currentUserId = session.user.id;
                const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
                if (prof?.is_admin || prof?.is_owner || session.user.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
                    isAdminLocal = true;
                }
                if (prof?.is_owner || session.user.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
                    isOwnerLocal = true;
                }
            }
            document.getElementById('admin-add-blog-btn').style.display = isAdminLocal ? 'block' : 'none';

            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'blogs').single();
            if (data && data.data) {
                blogsList = data.data;
            }
            authorMap = await resolveAuthors(blogsList.map(b => b.author_id));
            renderBlogs();
        }

        function renderBlogs() {
            const container = document.getElementById('blogs-container');
            if (!blogsList.length) {
                container.innerHTML = '<p style="color:var(--fg-muted)">No blog posts available.</p>';
                return;
            }
            container.innerHTML = blogsList.map((b) => `
                <div class="flat-list-item" id="blog-${b.id}" data-id="${b.id}" style="padding-bottom:24px; margin-bottom:0;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div class="flat-meta" style="font-size:12px; margin-bottom:6px; color:var(--fg-muted); display:flex; align-items:center; flex-wrap:wrap;">
                            <button class="post-id-btn" style="cursor:pointer; background:none; border:none; padding:0; width:auto; margin:0; color:var(--fg-muted); font-size:12px; font-family:var(--font-ui);" onclick="copyBlogLink(${b.id})">ID: #${b.id}</button>
                            &nbsp;&middot; Date: ${b.date} ${authorTag(authorMap[b.author_id])}
                        </div>
                        ${isAdminLocal ? `<div style="display:flex; gap:8px;">
                            <button class="ui-btn" style="width:auto; margin:0; padding:4px 10px; font-size:11px;" onclick="editBlogInline(${b.id})">edit</button>
                            <button class="ui-btn" style="width:auto; margin:0; padding:4px 10px; font-size:11px; color:var(--destructive);" onclick="deleteBlogInline(${b.id})">delete</button>
                        </div>` : ''}
                    </div>
                    <div class="flat-title" style="font-size:22px; margin-bottom:14px;">${b.title}</div>
                    <div class="flat-desc markdown-body" style="font-size:14px; line-height:1.7;">${marked.parse(b.content)}</div>
                </div>
            `).join('');

            setupScrollObserver();

            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id');
            if (targetId) {
                setTimeout(() => {
                    const el = document.getElementById(`blog-${targetId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }
        }

        window.copyBlogLink = function (id) {
            const url = `${window.parent.location.origin}${window.parent.location.pathname}#Index/Blogs?id=${id}`;
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1600);
            });
        };

        window.addBlogInline = async function () {
            if (!isAdminLocal) return;
            const result = await formPrompt([
                { key: 'title', label: 'blog title' },
                { key: 'content', label: 'content (markdown, multi-line supported)', type: 'textarea', rows: 10 }
            ], 'new blog post');
            if (!result || !result.title) return;

            const nextId = blogsList.length > 0 ? Math.max(...blogsList.map(x => x.id || 0)) + 1 : 1;
            const today = new Date();
            const dateStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
            blogsList.unshift({ id: nextId, date: dateStr, title: result.title, content: result.content, author_id: currentUserId });
            await supabaseClient.from('site_content').upsert({ key: 'blogs', data: blogsList });
            authorMap = await resolveAuthors(blogsList.map(b => b.author_id));
            renderBlogs();
        };

        window.editBlogInline = async function (id) {
            if (!isAdminLocal) return;
            const idx = blogsList.findIndex(b => b.id === id);
            if (idx < 0) return;
            const b = blogsList[idx];
            const result = await formPrompt([
                { key: 'title', label: 'blog title', value: b.title },
                { key: 'content', label: 'content (markdown, multi-line supported)', type: 'textarea', rows: 10, value: b.content }
            ], 'edit blog post');
            if (!result) return;
            blogsList[idx].title = result.title;
            blogsList[idx].content = result.content;
            await supabaseClient.from('site_content').update({ data: blogsList }).eq('key', 'blogs');
            renderBlogs();
        };

        window.deleteBlogInline = async function (id) {
            if (!isAdminLocal) return;
            const ok = await confirmAction('delete this blog post?');
            if (!ok) return;
            blogsList = blogsList.filter(b => b.id !== id);
            await supabaseClient.from('site_content').update({ data: blogsList }).eq('key', 'blogs');
            renderBlogs();
        };

        function setupScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.dataset.id;
                        if (id) {
                            window.parent.history.replaceState(null, null, `#Index/Blogs?id=${id}`);
                        }
                    }
                });
            }, { threshold: 0.5 });

            document.querySelectorAll('.flat-list-item').forEach(el => observer.observe(el));
        }

        document.addEventListener('DOMContentLoaded', initBlogsPage);
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
