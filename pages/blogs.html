<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 800px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <h1 style="margin:0; font-size:32px;">Blogs</h1>
        </div>
        <div id="blogs-container" class="flat-list-container">
            <span style="color:var(--fg-muted);">Loading blogs...</span>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let blogsList = [];
        marked.use({ breaks: true, gfm: true });

        async function initBlogsPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'blogs').single();
            if (data && data.data) {
                blogsList = data.data;
                renderBlogs();
                setupScrollObserver();
            }
        }

        function renderBlogs() {
            const container = document.getElementById('blogs-container');
            if(!blogsList.length) {
                container.innerHTML = '<p style="color:var(--fg-muted)">No blog posts available.</p>';
                return;
            }
            container.innerHTML = blogsList.map(b => `
                <div class="flat-list-item" id="blog-${b.id}" data-id="${b.id}" style="padding-bottom:30px; margin-bottom:20px;">
                    <div class="flat-meta" style="font-size:13px; margin-bottom:6px;">${b.date}</div>
                    <div class="flat-title" style="font-size:24px; margin-bottom:16px;">${b.title}</div>
                    <div class="flat-desc markdown-body" style="font-size:15px; white-space: pre-wrap;">${marked.parse(b.content)}</div>
                </div>
            `).join('');

            const hash = window.parent.location.hash;
            if (hash.includes('&id=')) {
                const id = hash.split('&id=')[1];
                const el = document.getElementById(`blog-${id}`);
                if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
            }
        }

        function setupScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('data-id');
                        if (id) {
                            window.parent.history.replaceState(null, '', `#Index/Blogs&id=${id}`);
                        }
                    }
                });
            }, { threshold: 0.5 });

            document.querySelectorAll('.flat-list-item').forEach(el => observer.observe(el));
        }

        document.addEventListener('DOMContentLoaded', initBlogsPage);
    </script>
</body>
</html>
