<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 800px; margin: 0 auto; padding-bottom: 60px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Blogs</h1>
            <div id="admin-add-blog-btn" style="display:none;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="openNewBlogModal()">+ Create Blog</button>
            </div>
        </div>
        <div id="blogs-container" style="display:flex; flex-direction:column; gap:20px;">
            Loading blogs...
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let blogsList = [];

        async function initBlogsPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user?.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
                document.getElementById('admin-add-blog-btn').style.display = 'block';
            }

            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'blogs').single();
            if (data && data.data) {
                blogsList = data.data;
                renderBlogs();
            }
        }

        function renderBlogs() {
            const container = document.getElementById('blogs-container');
            if(!blogsList.length) {
                container.innerHTML = '<p style="color:var(--fg-muted)">No blog posts available.</p>';
                return;
            }
            container.innerHTML = blogsList.map((b, i) => `
                <div style="background:var(--bg-hover); border:1px solid var(--border); padding:20px;">
                    <div style="font-size:11px; color:var(--fg-muted);">${b.date}</div>
                    <h2 style="color:var(--accent); font-size:18px; margin-top:4px; margin-bottom:10px;">${b.title}</h2>
                    <div style="font-size:13px; line-height:1.6;" class="markdown-body">${marked.parse(b.content)}</div>
                </div>
            `).join('');
        }

        window.openNewBlogModal = async () => {
            const title = await window.parent.guiPrompt("Blog Title:", "", "New Blog Post");
            if (!title) return;
            const content = await window.parent.guiPrompt("Blog Content (Markdown supported):", "", "New Blog Content");
            if (!content) return;
            
            const nextId = blogsList.length > 0 ? Math.max(...blogsList.map(b => b.id || 0)) + 1 : 1;
            const today = new Date();
            const dateStr = `${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${today.getFullYear()}`;
            blogsList.unshift({ id: nextId, date: dateStr, title, content });
            await supabaseClient.from('site_content').update({ data: blogsList }).eq('key', 'blogs');
            renderBlogs();
        };

        document.addEventListener('DOMContentLoaded', initBlogsPage);
    </script>
</body>
</html>
