<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Function Generator - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 800px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">Minecraft Function Generator</h1>
        
        <div class="settings-group">
            <label>Command / Function Identifier</label>
            <input type="text" id="fn-name" class="ui-input" placeholder="e.g. custom:my_function">
        </div>

        <div class="settings-group">
            <label>Commands (One per line)</label>
            <textarea id="fn-commands" class="ui-input" rows="6" placeholder="give @p diamond&#10;say Done!"></textarea>
        </div>

        <button class="ui-btn" onclick="generateMcFunction()">Generate MCFunction</button>

        <div class="settings-group" style="margin-top:20px;">
            <label>Output</label>
            <textarea id="fn-output" class="ui-input" rows="6" readonly></textarea>
        </div>
    </div>

    <script>
        function generateMcFunction() {
            const name = document.getElementById('fn-name').value.trim() || 'custom:func';
            const commands = document.getElementById('fn-commands').value.trim();
            const output = `# Function: ${name}\n` + commands.split('\n').filter(c => c.trim()).join('\n');
            document.getElementById('fn-output').value = output;
        }
    </script>
</body>
</html>
