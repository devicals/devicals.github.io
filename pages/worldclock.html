<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>world clock viewer</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <style>
        .clock-item {
            padding: 24px 0;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clock-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <h1 style="margin-bottom:40px; font-size: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">world clocks</h1>

        <div style="display:flex; gap:16px; margin-bottom:40px;">
            <input type="text" id="new-clock-input" class="ui-input" style="margin:0; flex:1;" placeholder="enter timezone (e.g. AEST, UTC, China/Shenzhen, ET, PT, CT, California)">
            <button class="ui-btn" style="width:auto; margin:0;" onclick="addClock()">+ add clock</button>
        </div>

        <div id="clocks-grid" style="display:flex; flex-direction:column; gap:0;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const DateTime = luxon.DateTime;
        let zones = ['system', 'UTC', 'AEST', 'ET', 'CT', 'PT'];

        const resolvedCache = JSON.parse(localStorage.getItem('tz_resolved_cache') || '{}');
        const pendingFetches = new Set();
        const failedResolutions = new Set();

        const KNOWN_MAP = {
            'et': 'America/New_York',
            'est': 'America/New_York',
            'edt': 'America/New_York',
            'pt': 'America/Los_Angeles',
            'pst': 'America/Los_Angeles',
            'pdt': 'America/Los_Angeles',
            'ct': 'America/Chicago',
            'cst': 'America/Chicago',
            'cdt': 'America/Chicago',
            'mt': 'America/Denver',
            'mst': 'America/Denver',
            'mdt': 'America/Denver',
            'aest': 'Australia/Sydney',
            'aedt': 'Australia/Sydney',
            'acst': 'Australia/Adelaide',
            'acdt': 'Australia/Adelaide',
            'awst': 'Australia/Perth',
            'jst': 'Asia/Tokyo',
            'kst': 'Asia/Seoul',
            'sgt': 'Asia/Singapore',
            'ist': 'Asia/Kolkata',
            'hkt': 'Asia/Hong_Kong',
            'hkst': 'Asia/Hong_Kong',
            'cet': 'Europe/Paris',
            'cest': 'Europe/Paris',
            'eet': 'Europe/Athens',
            'eest': 'Europe/Athens',
            'wet': 'Europe/Lisbon',
            'west': 'Europe/Lisbon',
            'bst': 'Europe/London',
            'gmt': 'UTC',
            'utc': 'UTC',
            'hst': 'Pacific/Honolulu',
            'akst': 'America/Anchorage',
            'akdt': 'America/Anchorage',
            'nzst': 'Pacific/Auckland',
            'nzdt': 'Pacific/Auckland',
            'california': 'America/Los_Angeles',
            'washington': 'America/Los_Angeles',
            'oregon': 'America/Los_Angeles',
            'new york': 'America/New_York',
            'florida': 'America/New_York',
            'texas': 'America/Chicago',
            'illinois': 'America/Chicago',
            'colorado': 'America/Denver',
            'china': 'Asia/Shanghai',
            'shenzhen': 'Asia/Shanghai',
            'beijing': 'Asia/Shanghai',
            'shanghai': 'Asia/Shanghai',
            'japan': 'Asia/Tokyo',
            'tokyo': 'Asia/Tokyo',
            'korea': 'Asia/Seoul',
            'seoul': 'Asia/Seoul',
            'uk': 'Europe/London',
            'london': 'Europe/London',
            'france': 'Europe/Paris',
            'paris': 'Europe/Paris',
            'germany': 'Europe/Berlin',
            'berlin': 'Europe/Berlin',
            'australia': 'Australia/Sydney',
            'sydney': 'Australia/Sydney',
            'melbourne': 'Australia/Sydney',
            'india': 'Asia/Kolkata',
            'singapore': 'Asia/Singapore'
        };

        function purgeStaleCache() {
            Object.keys(resolvedCache).forEach(k => {
                if (KNOWN_MAP[k]) {
                    delete resolvedCache[k];
                }
            });
            saveCache();
        }
        purgeStaleCache();

        function saveCache() {
            localStorage.setItem('tz_resolved_cache', JSON.stringify(resolvedCache));
        }

        function getIanaTimezones() {
            try {
                return Intl.supportedValuesOf('timeZone');
            } catch(e) {
                return [];
            }
        }

        function tryLocalResolution(z) {
            if (!z) return null;
            const clean = z.trim();
            if (clean.toLowerCase() === 'system') return 'system';

            const lower = clean.toLowerCase();

            if (KNOWN_MAP[lower]) {
                return KNOWN_MAP[lower];
            }

            let dt = DateTime.now().setZone(clean);
            if (dt.isValid) return clean;

            if (resolvedCache[lower]) {
                dt = DateTime.now().setZone(resolvedCache[lower]);
                if (dt.isValid) return resolvedCache[lower];
            }

            const allZones = getIanaTimezones();
            const exactIana = allZones.find(iana => iana.toLowerCase() === lower);
            if (exactIana) return exactIana;

            const formattedName = lower.replace(/\s+/g, '_');
            const endMatch = allZones.find(iana => iana.toLowerCase().endsWith('/' + formattedName));
            if (endMatch) return endMatch;

            let match = lower.match(/^(utc|gmt)?([+-]\d{1,2})(?::?(\d{2}))?$/);
            if (match) {
                let offsetHours = parseInt(match[2]);
                let offsetZone = `UTC${offsetHours >= 0 ? '+' : ''}${offsetHours}`;
                dt = DateTime.now().setZone(offsetZone);
                if (dt.isValid) return offsetZone;
            }

            return null;
        }

        async function fetchTimezoneFromApi(z) {
            const lower = z.trim().toLowerCase();
            if (resolvedCache[lower] || pendingFetches.has(lower) || failedResolutions.has(lower)) return;
            pendingFetches.add(lower);

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(z)}&count=1`);
                if (geoRes.ok) {
                    const geoData = await geoRes.json();
                    if (geoData.results && geoData.results[0] && geoData.results[0].timezone) {
                        const foundZone = geoData.results[0].timezone;
                        if (DateTime.now().setZone(foundZone).isValid) {
                            resolvedCache[lower] = foundZone;
                            saveCache();
                            pendingFetches.delete(lower);
                            renderClocks();
                            return;
                        }
                    }
                }
            } catch(e) {}

            pendingFetches.delete(lower);
            failedResolutions.add(lower);
            renderClocks();
        }

        async function initClocks() {
            if (window.parent && window.parent.currentUser) {
                const settings = window.parent.currentUser.settings || {};
                if (settings.worldclocks) zones = settings.worldclocks;
            } else {
                const local = localStorage.getItem('user_world_clocks');
                if (local) zones = JSON.parse(local);
            }
            renderClocks();
            setInterval(renderClocks, 1000);
        }

        window.addClock = async function () {
            const input = document.getElementById('new-clock-input').value.trim();
            if (!input) return;
            zones.push(input);
            await saveClocks();
            document.getElementById('new-clock-input').value = '';
            renderClocks();
        };

        window.removeClock = async function (idx) {
            zones.splice(idx, 1);
            await saveClocks();
            renderClocks();
        };

        async function saveClocks() {
            localStorage.setItem('user_world_clocks', JSON.stringify(zones));
            if (window.parent && window.parent.syncSettingsToServer) {
                await window.parent.syncSettingsToServer();
            }
        }

        function renderClocks() {
            const grid = document.getElementById('clocks-grid');
            grid.innerHTML = zones.map((z, idx) => {
                const resolvedZoneName = tryLocalResolution(z);
                const lower = z.trim().toLowerCase();

                if (!resolvedZoneName) {
                    if (failedResolutions.has(lower)) {
                        return `
                            <div class="clock-item">
                                <div>
                                    <div style="font-size:13px; color:var(--destructive); font-weight:bold; letter-spacing:1px; text-transform:lowercase;">${z}</div>
                                    <div style="font-size:20px; font-weight:bold; margin-top:8px; color:var(--fg-muted);">invalid timezone</div>
                                </div>
                                <button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent; border:none; font-size:16px;" onclick="removeClock(${idx})">✕</button>
                            </div>
                        `;
                    }

                    fetchTimezoneFromApi(z);

                    return `
                        <div class="clock-item">
                            <div>
                                <div style="font-size:13px; color:var(--accent); font-weight:bold; letter-spacing:1px; text-transform:lowercase;">${z}</div>
                                <div style="font-size:20px; font-weight:bold; margin-top:8px; color:var(--fg-muted);">resolving timezone...</div>
                            </div>
                            <button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent; border:none; font-size:16px;" onclick="removeClock(${idx})">✕</button>
                        </div>
                    `;
                }

                const now = DateTime.now().setZone(resolvedZoneName);

                return `
                    <div class="clock-item">
                        <div>
                            <div style="font-size:13px; color:var(--accent); font-weight:bold; letter-spacing:1px; text-transform:lowercase;">${z} ${resolvedCache[lower] ? `<span style="font-size:10px; color:var(--fg-muted); font-weight:normal;">(${resolvedCache[lower]})</span>` : ''}</div>
                            <div style="font-size:32px; font-weight:bold; margin-top:8px; line-height:1;">${now.toFormat('HH:mm:ss')}</div>
                            <div style="font-size:14px; color:var(--fg-muted); margin-top:8px;">${now.toFormat('yyyy-MM-dd')}</div>
                        </div>
                        <button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent; border:none; font-size:16px;" onclick="removeClock(${idx})">✕</button>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', initClocks);
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
