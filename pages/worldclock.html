<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>World Clock Viewer - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 850px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">World Clock Viewer</h1>
        <div id="clocks-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:16px;"></div>
    </div>

    <script>
        const DateTime = luxon.DateTime;
        const zones = ['system', 'UTC', 'America/New_York', 'Europe/London', 'Asia/Tokyo', 'Australia/Sydney'];

        function renderClocks() {
            const grid = document.getElementById('clocks-grid');
            grid.innerHTML = zones.map(z => {
                const now = z === 'system' ? DateTime.now() : DateTime.now().setZone(z);
                return `
                    <div style="background:var(--bg-hover); border:1px solid var(--border); padding:16px;">
                        <div style="font-size:11px; color:var(--accent); font-weight:bold;">${z.toUpperCase()}</div>
                        <div style="font-size:24px; font-weight:bold; margin-top:8px;">${now.toFormat('HH:mm:ss')}</div>
                        <div style="font-size:11px; color:var(--fg-muted); margin-top:4px;">${now.toFormat('yyyy-MM-dd')}</div>
                    </div>
                `;
            }).join('');
        }

        setInterval(renderClocks, 1000);
        document.addEventListener('DOMContentLoaded', renderClocks);
    </script>
</body>
</html>
