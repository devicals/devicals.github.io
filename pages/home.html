<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <style>
        .about-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-bright);
            padding-bottom: 14px;
        }
        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .about-columns {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .about-column {
            flex: 1;
            min-width: 260px;
            background: var(--bg-panel);
            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);
            padding: 0 20px 18px 20px;
            transition: border-color 0.14s ease;
        }
        .about-column:hover {
            border-color: var(--accent);
        }
        .about-column ul {
            margin-bottom: 0 !important;
        }
        .win-titlebar {
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.8px;
            color: var(--accent);
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border-bright);
            margin: 0 -20px 16px -20px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 34px;
        }
        .pronouns-container {
            margin-bottom: 35px;
        }
        .pronouns-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .pronoun-badge {
            font-family: var(--font-ui);
            font-size: 12px;
            color: var(--accent);
            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);
            background: var(--bg-elevated);
            padding: 4px 10px;
            transition: border-color 0.14s ease, background 0.14s ease;
        }
        .pronoun-badge:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        .pronouns-note {
            font-size: 13px;
            color: var(--fg-muted);
            line-height: 1.6;
        }
        .latest-blog-window {
            background: var(--bg-panel);
            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);
            padding: 0 22px 22px 22px;
            margin-top: 14px;
            margin-bottom: 60px;
            cursor: pointer;
            transition: border-color 0.14s ease, background 0.14s ease;
        }
        .latest-blog-window .win-titlebar {
            margin: 0 -22px 18px -22px;
        }
        .latest-blog-window:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }
        .owner-edit-btn {
            display: none;
            margin: 0 !important;
        }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div class="markdown-body" style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div class="about-header">
            <h1 style="margin:0; border-bottom:none; padding-bottom:0;">about me</h1>
            <button id="edit-bio-btn" class="ui-btn ui-btn-sm ui-icon-btn owner-edit-btn" title="edit bio" aria-label="edit bio" onclick="openEditSection('bio')"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2l8.5-8.5z"/></svg></button>
        </div>

        <div id="about-bio-container" style="margin-bottom: 30px;">
            <span style="color:var(--fg-muted);">loading bio...</span>
        </div>

        <div id="about-pronouns-section" class="pronouns-container">
            <div class="section-title-row">
                <h2 style="margin:0;">pronouns</h2>
                <button id="edit-pronouns-btn" class="ui-btn ui-btn-sm ui-icon-btn owner-edit-btn" title="edit pronouns" aria-label="edit pronouns" onclick="openEditSection('pronouns')"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2l8.5-8.5z"/></svg></button>
            </div>
            <div id="about-pronouns-list" class="pronouns-list"></div>
            <div id="about-pronouns-note" class="pronouns-note"></div>
        </div>

        <div class="about-columns">
            <div class="about-column">
                <div class="win-titlebar">
                    <span>skills</span>
                    <button id="edit-skills-btn" class="ui-btn ui-btn-xs ui-icon-btn owner-edit-btn" title="edit skills" aria-label="edit skills" onclick="openEditSection('skills')"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2l8.5-8.5z"/></svg></button>
                </div>
                <div id="about-skills-container"></div>
            </div>
            <div class="about-column">
                <div class="win-titlebar">
                    <span>socials</span>
                    <button id="edit-socials-btn" class="ui-btn ui-btn-xs ui-icon-btn owner-edit-btn" title="edit socials" aria-label="edit socials" onclick="openEditSection('socials')"><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.5l2 2L5 13H3v-2l8.5-8.5z"/></svg></button>
                </div>
                <div id="about-socials-container"></div>
            </div>
        </div>

        <div class="latest-blog-window" id="latest-blog-card">
            <div class="win-titlebar"><span>latest blog</span></div>
            <div id="latest-blog-container">
                <span style="color:var(--fg-muted);">loading latest blog post...</span>
            </div>
        </div>
    </div>

    <div id="edit-section-modal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:2000; align-items:center; justify-content:center;">
        <div class="modal-box" style="width:620px; max-width:92vw; max-height:88vh;">
            <div class="modal-title" id="edit-section-title">edit section</div>
            <div id="edit-section-fields"></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="ui-btn" style="flex:1; margin:0; border-color:var(--accent); color:var(--accent);" onclick="saveAboutSection()">save changes</button>
                <button class="ui-btn" style="width:auto; margin:0;" onclick="closeEditSection()">cancel</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        marked.use({ breaks: true, gfm: true });

        const DEFAULT_ABOUT = {
            bio: "hallo there! I'm **Error Dev**, an *Aussie*! I enjoy playing [games](#About%20Me/Games%20I%20%3C3) such as *Minecraft* and *Persona 5 Royal*, experimenting in [Powerpoint](https://powerpoint.office.com), and also watching **movies and TV series**! Not to mention, I also **draw**, **write**, and **code**! Hosted on [Github](https://github.com/devicals)! Also check out my Minecraft projects at [https://modrinth.com/organization/infiniverse](https://modrinth.com/organization/infiniverse)!\n\nContact me at [3rr0r.d3v@gmail.com](mailto:3rr0r.d3v@gmail.com)!",
            pronouns: ["he/him"],
            pronouns_note: "any pronouns are fine, but mostly go by he/him",
            skills: "- [Hypertext Markup Language (HTML)](https://html.com/)\n- [JavaScript (JS)](https://www.javascript.com/)\n- [YAML Ain't Markup Language (YAML)](https://yaml.org/)\n- [JS Object Notation (JSON)](https://www.json.org/)\n- [Flexion (Flexible Object Notation) (FLON)](https://marketplace.visualstudio.com/items?itemName=error-dev.flexion-language)\n- [Cascading Style Sheets (CSS)](https://www.w3.org/Style/CSS/)\n- [Python (PY)](https://www.python.org/)\n- [Beet & Bolt (Minecraft Datapacks)](https://mcbeet.dev/)",
            socials: "- [Discord](https://discord.com/users/989414384679927838)\n- [Steam](https://steamcommunity.com/id/error_dev/)\n- [Reddit](https://www.reddit.com/user/3RR0R_0FF1C1AL/)\n- [YouTube](https://www.youtube.com/@3rror_dev/)\n- [DeviantART](https://www.deviantart.com/3rrordev)\n- [X / Twitter](https://x.com/error_dev_xt/)\n- [itch.io](https://error-offixial.itch.io/)"
        };

        let aboutData = { ...DEFAULT_ABOUT };
        let activeEditSection = null;

        function escapeAttr(str) {
            return (str || '').toString()
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function checkIsOwner() {
            if (window.parent) {
                if (window.parent.isOwner) return true;
                if (window.parent.getUserIdentity) {
                    const ident = window.parent.getUserIdentity();
                    if (ident && ident.isOwner) return true;
                }
                const user = window.parent.currentUser;
                if (user && (user.is_owner === true || user.username?.toLowerCase() === 'error dev' || user.email?.toLowerCase() === '3rr0r.d3v@gmail.com')) {
                    return true;
                }
            }
            try {
                const sessionStr = localStorage.getItem('custom_auth_session');
                if (sessionStr) {
                    const user = JSON.parse(sessionStr);
                    const name = (user?.username || '').trim().toLowerCase();
                    const email = (user?.email || '').trim().toLowerCase();
                    if (user?.is_owner === true || name === 'error dev' || email === '3rr0r.d3v@gmail.com') return true;
                }
            } catch(e) {}
            return false;
        }

        function updateOwnerUI() {
            const isOwner = checkIsOwner();
            document.querySelectorAll('.owner-edit-btn').forEach(btn => {
                btn.style.display = isOwner ? 'inline-flex' : 'none';
            });
        }

        window.onParentAuthChanged = updateOwnerUI;

        async function loadAboutData() {
            try {
                const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'about').single();
                if (data && data.data) {
                    aboutData = { ...DEFAULT_ABOUT, ...data.data };
                } else {
                    const cached = localStorage.getItem('site_about_data');
                    if (cached) aboutData = { ...DEFAULT_ABOUT, ...JSON.parse(cached) };
                }
            } catch (e) {
                const cached = localStorage.getItem('site_about_data');
                if (cached) aboutData = { ...DEFAULT_ABOUT, ...JSON.parse(cached) };
            }
            renderAbout();
        }

        function renderAbout() {
            document.getElementById('about-bio-container').innerHTML = marked.parse(aboutData.bio || '');

            const pListEl = document.getElementById('about-pronouns-list');
            let list = Array.isArray(aboutData.pronouns) ? aboutData.pronouns : (aboutData.pronouns || '').split(',').map(s => s.trim()).filter(Boolean);
            if (!list.length) list = ['he/him'];

            pListEl.innerHTML = list.map(p => `<span class="pronoun-badge">${p}</span>`).join('');

            const noteEl = document.getElementById('about-pronouns-note');
            if (aboutData.pronouns_note && aboutData.pronouns_note.trim()) {
                noteEl.innerHTML = marked.parse(aboutData.pronouns_note.trim());
                noteEl.style.display = 'block';
            } else {
                noteEl.innerHTML = '';
                noteEl.style.display = 'none';
            }

            document.getElementById('about-skills-container').innerHTML = marked.parse(aboutData.skills || '');
            document.getElementById('about-socials-container').innerHTML = marked.parse(aboutData.socials || '');

            document.querySelectorAll('#about-bio-container a, #about-pronouns-note a, #about-skills-container a, #about-socials-container a').forEach(a => {
                const href = a.getAttribute('href') || '';
                if (href.startsWith('http') || href.startsWith('mailto:')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                } else if (href.startsWith('#')) {
                    a.onclick = (e) => {
                        e.preventDefault();
                        window.parent.location.hash = href.substring(1);
                    };
                }
            });
        }

        window.openEditSection = function (section) {
            if (!checkIsOwner()) return;
            activeEditSection = section;
            const titleEl = document.getElementById('edit-section-title');
            const fieldsEl = document.getElementById('edit-section-fields');

            if (section === 'bio') {
                titleEl.textContent = 'edit bio';
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>bio (markdown supported)</label>
                        <textarea id="edit-sec-bio" class="ui-input" rows="8" placeholder="write your bio here...">${escapeAttr(aboutData.bio || '')}</textarea>
                    </div>
                `;
            } else if (section === 'pronouns') {
                titleEl.textContent = 'edit pronouns';
                const list = Array.isArray(aboutData.pronouns) ? aboutData.pronouns.join(', ') : (aboutData.pronouns || '');
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>pronouns list (comma-separated)</label>
                        <input type="text" id="edit-sec-pronouns" class="ui-input" placeholder="e.g. he/him, they/them" value="${escapeAttr(list)}">
                    </div>
                    <div class="settings-group">
                        <label>pronouns note / details</label>
                        <textarea id="edit-sec-pronouns-note" class="ui-input" rows="3" placeholder="optional small note or extra details...">${escapeAttr(aboutData.pronouns_note || '')}</textarea>
                    </div>
                `;
            } else if (section === 'skills') {
                titleEl.textContent = 'edit skills';
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>skills (markdown list)</label>
                        <textarea id="edit-sec-skills" class="ui-input" rows="10" placeholder="- [Skill Name](URL)">${escapeAttr(aboutData.skills || '')}</textarea>
                    </div>
                `;
            } else if (section === 'socials') {
                titleEl.textContent = 'edit socials';
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>socials (markdown list)</label>
                        <textarea id="edit-sec-socials" class="ui-input" rows="10" placeholder="- [Social Platform](URL)">${escapeAttr(aboutData.socials || '')}</textarea>
                    </div>
                `;
            }

            document.getElementById('edit-section-modal').style.display = 'flex';
        };

        window.closeEditSection = function () {
            document.getElementById('edit-section-modal').style.display = 'none';
            activeEditSection = null;
        };

        window.saveAboutSection = async function () {
            if (!checkIsOwner() || !activeEditSection) {
                alert("Permission denied. Only Error Dev can edit the about me page.");
                return;
            }

            if (activeEditSection === 'bio') {
                aboutData.bio = document.getElementById('edit-sec-bio').value.trim();
            } else if (activeEditSection === 'pronouns') {
                const pronounsRaw = document.getElementById('edit-sec-pronouns').value.trim();
                aboutData.pronouns = pronounsRaw.split(',').map(s => s.trim()).filter(Boolean);
                aboutData.pronouns_note = document.getElementById('edit-sec-pronouns-note').value.trim();
            } else if (activeEditSection === 'skills') {
                aboutData.skills = document.getElementById('edit-sec-skills').value.trim();
            } else if (activeEditSection === 'socials') {
                aboutData.socials = document.getElementById('edit-sec-socials').value.trim();
            }

            localStorage.setItem('site_about_data', JSON.stringify(aboutData));

            try {
                const { data: existing } = await supabaseClient.from('site_content').select('key').eq('key', 'about').maybeSingle();
                let error = null;
                if (existing) {
                    const res = await supabaseClient.from('site_content').update({ data: aboutData }).eq('key', 'about');
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('site_content').insert({ key: 'about', data: aboutData });
                    error = res.error;
                }
                if (error) throw error;
            } catch (err) {
                if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert("Saved locally, but Supabase table update encountered an error: " + err.message, "Sync Notice");
                }
            }

            renderAbout();
            closeEditSection();
        };

        async function loadHomeBlog() {
            try {
                const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'blogs').single();
                if (data && data.data && data.data.length > 0) {
                    const sorted = data.data.sort((a, b) => {
                        const pa = a.date.split('/'); const pb = b.date.split('/');
                        return new Date(pb[2], pb[1] - 1, pb[0]) - new Date(pa[2], pa[1] - 1, pa[0]);
                    });
                    const latest = sorted[0];
                    const container = document.getElementById('latest-blog-container');
                    container.innerHTML = `
                        <div style="font-family:var(--font-ui); font-size:11px; color:var(--fg-muted); margin-bottom:10px; border-bottom:1px dashed var(--border); padding-bottom:6px;">${latest.date}</div>
                        <div style="font-family:var(--font-ui); font-size:20px; font-weight:bold; color:var(--accent); margin-bottom:16px;">${latest.title}</div>
                        <div class="markdown-body" style="font-size:15px; line-height:1.8;">${marked.parse(latest.content)}</div>
                    `;
                    document.getElementById('latest-blog-card').onclick = () => {
                        window.parent.location.hash = `#Index/Blogs?id=${latest.id}`;
                    };
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateOwnerUI();
            loadAboutData();
            loadHomeBlog();
            setInterval(updateOwnerUI, 1000);
        });
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
