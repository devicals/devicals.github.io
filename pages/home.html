<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .about-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-bright);
            padding-bottom: 14px;
        }
        .about-top-row {
            display: flex;
            gap: 28px;
            align-items: flex-start;
            margin-bottom: 34px;
        }
        .about-bio-col {
            flex: 1;
            min-width: 0;
        }
        .about-side-col {
            width: 350px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .about-columns {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .about-column {
            width: 100%;
            min-width: 0;
            background: var(--bg-panel);
            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);
            padding: 0 12px 10px 12px;
            transition: border-color 0.14s ease;
        }
        .about-column:hover {
            border-color: var(--accent);
        }
        .about-column ul {
            margin-bottom: 0 !important;
            margin-left: 16px !important;
            line-height: 1.48 !important;
        }
        .about-column li {
            font-size: 12.5px;
            margin-bottom: 0.25rem !important;
        }
        .about-column p {
            font-size: 12.5px;
            line-height: 1.48;
        }
        .win-titlebar {
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.8px;
            color: var(--accent);
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border-bright);
            margin: 0 -20px 16px -20px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 34px;
        }
        .about-column .win-titlebar {
            margin: 0 -12px 8px -12px;
            padding: 4px 10px;
            min-height: 28px;
            font-size: 11px;
        }
        .pronouns-container {
            margin-bottom: 35px;
        }
        .pronouns-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }
        .pronoun-badge {
            font-family: var(--font-ui);
            font-size: 12px;
            color: var(--accent);
            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);

        .pronoun-badge:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        .pronouns-note {
            font-size: 13px;
            color: var(--fg-muted);
            line-height: 1.6;
        }
        .anon-msg-window {

            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);
            padding: 0 20px 18px 20px;

        }
        .anon-msg-window .win-titlebar {
            margin: 0 -20px 16px -20px;

        .anon-canvas-wrap {
            display: none;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            padding: 12px;
            background: var(--bg-main);
        }
        .anon-canvas-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .anon-canvas {
            background: #1c1b18;
            border: 1px solid var(--border);
            width: 100%;
            height: 220px;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        .anon-name-row {

            font-family: var(--font-ui);

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        marked.use({ breaks: true, gfm: true });

        const DEFAULT_ABOUT = {
            bio: "hallo there! I'm **Error Dev**, an *Aussie*! I enjoy playing [games](#About%20Me/Games%20I%20%3C3) such as *Minecraft* and *Persona 5 Royal*, experimenting in [Powerpoint](https://powerpoint.office.com), and also watching **movies and TV series**! Not to mention, I also **draw**, **write**, and **code**! Hosted on [Github](https://github.com/devicals)! Also check out my Minecraft projects at [https://modrinth.com/organization/infiniverse](https://modrinth.com/organization/infiniverse)!\n\nContact me at [3rr0r.d3v@gmail.com](mailto:3rr0r.d3v@gmail.com)!",
            pronouns: ["he/him"],
            pronouns_note: "any pronouns are fine, but mostly go by he/him",
            skills: "- [Hypertext Markup Language (HTML)](https://html.com/)\n- [JavaScript (JS)](https://www.javascript.com/)\n- [YAML Ain't Markup Language (YAML)](https://yaml.org/)\n- [JS Object Notation (JSON)](https://www.json.org/)\n- [Flexion (Flexible Object Notation) (FLON)](https://marketplace.visualstudio.com/items?itemName=error-dev.flexion-language)\n- [Cascading Style Sheets (CSS)](https://www.w3.org/Style/CSS/)\n- [Python (PY)](https://www.python.org/)\n- [Beet & Bolt (Minecraft Datapacks)](https://mcbeet.dev/)",
            socials: "- [Discord](https://discord.com/users/989414384679927838)\n- [Steam](https://steamcommunity.com/id/error_dev/)\n- [Reddit](https://www.reddit.com/user/3RR0R_0FF1C1AL/)\n- [YouTube](https://www.youtube.com/@3rror_dev/)\n- [DeviantART](https://www.deviantart.com/3rrordev)\n- [X / Twitter](https://x.com/error_dev_xt/)\n- [itch.io](https://error-offixial.itch.io/)"
        };

        let aboutData = { ...DEFAULT_ABOUT };
        let activeEditSection = null;
        let lastAutofilledUsername = '';

        function escapeAttr(str) {
            return (str || '').toString()
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function getLoggedInIdentity() {
            if (window.parent && window.parent.getUserIdentity) {
                return window.parent.getUserIdentity();
            }
            try {
                const sessionStr = localStorage.getItem('custom_auth_session');
                if (sessionStr) {
                    const user = JSON.parse(sessionStr);
                    if (user && !user.is_banned) {
                        const name = (user.username || '').trim().toLowerCase();
                        const email = (user.email || '').trim().toLowerCase();
                        const isOwner = user.is_owner === true || name === 'error dev' || email === '3rr0r.d3v@gmail.com';
                        return { user, isOwner, username: user.username || null };
                    }
                }
            } catch (e) {}
            return { user: null, isOwner: false, username: null };
        }

        function checkIsOwner() {
            return !!getLoggedInIdentity().isOwner;
        }

        function updateOwnerUI() {
            const isOwner = checkIsOwner();
            document.querySelectorAll('.owner-edit-btn').forEach(btn => {
                btn.style.display = isOwner ? 'inline-flex' : 'none';
            });
        }

        function syncAnonNameField() {
            const nameInput = document.getElementById('anon-name-input');
            if (!nameInput) return;
            const ident = getLoggedInIdentity();
            const username = ident.user && ident.username ? ident.username : '';

            if (username) {
                if (!nameInput.value.trim() || nameInput.value === lastAutofilledUsername) {
                    nameInput.value = username;
                }
                lastAutofilledUsername = username;
            } else {
                if (nameInput.value === lastAutofilledUsername) {
                    nameInput.value = '';
                }
                lastAutofilledUsername = '';
            }
        }

        window.toggleAnonNameInput = function () {
            const checkbox = document.getElementById('anon-include-name');
            const nameInput = document.getElementById('anon-name-input');
            if (!checkbox || !nameInput) return;
            nameInput.disabled = !checkbox.checked;
            if (checkbox.checked && !nameInput.value.trim()) {
                syncAnonNameField();
            }
        };

        window.onParentAuthChanged = function () {
            updateOwnerUI();
            syncAnonNameField();
        };

        const anonCanvas = document.getElementById('anon-canvas');
        const anonCtx = anonCanvas.getContext('2d');
        let anonDrawingActive = false;
        let isAnonPointerDown = false;
        let anonCanvasInitialized = false;

        function clearAnonCanvas() {
            anonCtx.fillStyle = '#1c1b18';
            anonCtx.fillRect(0, 0, anonCanvas.width, anonCanvas.height);
        }

        function resizeAnonCanvas(preserve) {
            const rect = anonCanvas.getBoundingClientRect();
            const targetW = Math.max(200, Math.round(rect.width));
            const targetH = 220;
            if (anonCanvas.width === targetW && anonCanvas.height === targetH && anonCanvasInitialized) return;

            let snapshot = null;
            if (preserve && anonCanvasInitialized && anonCanvas.width > 0 && anonCanvas.height > 0) {
                snapshot = document.createElement('canvas');
                snapshot.width = anonCanvas.width;
                snapshot.height = anonCanvas.height;
                snapshot.getContext('2d').drawImage(anonCanvas, 0, 0);
            }

            anonCanvas.width = targetW;
            anonCanvas.height = targetH;
            anonCtx.lineCap = 'round';
            anonCtx.lineJoin = 'round';
            clearAnonCanvas();
            if (snapshot) {
                anonCtx.drawImage(snapshot, 0, 0);
            }
            anonCanvasInitialized = true;
        }

        function getCanvasPoint(clientX, clientY) {
            const rect = anonCanvas.getBoundingClientRect();
            const scaleX = anonCanvas.width / (rect.width || 1);
            const scaleY = anonCanvas.height / (rect.height || 1);
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startAnonStroke(clientX, clientY) {
            isAnonPointerDown = true;
            const pt = getCanvasPoint(clientX, clientY);
            anonCtx.beginPath();
            anonCtx.moveTo(pt.x, pt.y);
            anonCtx.lineTo(pt.x + 0.01, pt.y + 0.01);
            anonCtx.strokeStyle = document.getElementById('anon-brush-color').value;
            anonCtx.lineWidth = document.getElementById('anon-brush-size').value;
            anonCtx.stroke();
        }

        function moveAnonStroke(clientX, clientY) {
            if (!isAnonPointerDown) return;
            const pt = getCanvasPoint(clientX, clientY);
            anonCtx.lineTo(pt.x, pt.y);
            anonCtx.strokeStyle = document.getElementById('anon-brush-color').value;
            anonCtx.lineWidth = document.getElementById('anon-brush-size').value;
            anonCtx.stroke();
        }

        function endAnonStroke() {
            isAnonPointerDown = false;
        }

        anonCanvas.addEventListener('mousedown', e => startAnonStroke(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => moveAnonStroke(e.clientX, e.clientY));
        window.addEventListener('mouseup', endAnonStroke);

        anonCanvas.addEventListener('touchstart', e => {
            if (e.touches.length !== 1) return;
            e.preventDefault();
            startAnonStroke(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        anonCanvas.addEventListener('touchmove', e => {
            if (e.touches.length !== 1) return;
            e.preventDefault();
            moveAnonStroke(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchend', endAnonStroke);
        window.addEventListener('touchcancel', endAnonStroke);
        window.addEventListener('resize', () => {
            if (anonDrawingActive) resizeAnonCanvas(true);
        });

        window.toggleAnonCanvas = function () {
            const container = document.getElementById('anon-canvas-container');
            const btn = document.getElementById('anon-toggle-canvas-btn');
            if (container.style.display === 'none' || !container.style.display) {
                container.style.display = 'block';
                anonDrawingActive = true;
                btn.textContent = 'hide drawing';
                requestAnimationFrame(() => resizeAnonCanvas(anonCanvasInitialized));
            } else {
                container.style.display = 'none';
                anonDrawingActive = false;
                btn.textContent = 'add drawing';
            }
        };

        function cropAnonCanvas(sourceCanvas, padding = 15) {
            if (!anonCanvasInitialized || sourceCanvas.width === 0 || sourceCanvas.height === 0) return null;
            const ctx = sourceCanvas.getContext('2d');
            const w = sourceCanvas.width;
            const h = sourceCanvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            let minX = w, minY = h, maxX = 0, maxY = 0;
            let hasDrawing = false;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];

                    if (Math.abs(r - 28) > 10 || Math.abs(g - 27) > 10 || Math.abs(b - 24) > 10) {
                        hasDrawing = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!hasDrawing) return null;

            minX = Math.max(0, minX - padding);
            minY = Math.max(0, minY - padding);
            maxX = Math.min(w, maxX + padding);
            maxY = Math.min(h, maxY + padding);

            const cropW = maxX - minX;
            const cropH = maxY - minY;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropW;
            tempCanvas.height = cropH;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.fillStyle = '#1c1b18';
            tempCtx.fillRect(0, 0, cropW, cropH);
            tempCtx.drawImage(sourceCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

            return tempCanvas.toDataURL('image/png');
        }

        function setAnonStatus(msg, isError) {
            const el = document.getElementById('anon-msg-status');
            if (!el) return;
            el.style.color = isError ? 'var(--destructive)' : 'var(--accent)';
            el.textContent = msg || '';
        }

        window.submitAnonMessage = async function () {
            const textEl = document.getElementById('anon-msg-text');
            const includeCheck = document.getElementById('anon-include-name');
            const nameInput = document.getElementById('anon-name-input');
            const submitBtn = document.getElementById('anon-submit-btn');

            const messageText = textEl.value.trim();
            const drawingData = anonDrawingActive ? cropAnonCanvas(anonCanvas) : null;

            if (!messageText && !drawingData) {
                setAnonStatus('please write a message or draw something first.', true);
                return;
            }

            const includeName = !!(includeCheck && includeCheck.checked);
            const chosenName = includeName ? nameInput.value.trim() : '';
            const ident = getLoggedInIdentity();

            const payload = {
                message: messageText,
                drawing: drawingData || null,
                author_name: chosenName || null,
                is_logged_in: !!(includeName && chosenName && ident.user),
                created_at: new Date().toISOString()
            };

            const key = 'anon_msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);

            submitBtn.disabled = true;
            setAnonStatus('sending...', false);

            try {
                const { error } = await supabaseClient.from('site_content').insert({ key, data: payload });
                if (error) throw error;

                textEl.value = '';
                clearAnonCanvas();
                if (anonDrawingActive) toggleAnonCanvas();
                includeCheck.checked = false;
                nameInput.disabled = true;
                nameInput.value = '';
                lastAutofilledUsername = '';
                syncAnonNameField();

                setAnonStatus('message sent!', false);
                setTimeout(() => setAnonStatus('', false), 4000);
            } catch (e) {
                setAnonStatus('failed to send: ' + (e.message || 'unknown error'), true);
            } finally {
                submitBtn.disabled = false;
            }
        };

        async function loadAboutData() {
            try {
                const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'about').single();
                if (data && data.data) {
                    aboutData = { ...DEFAULT_ABOUT, ...data.data };
                } else {
                    const cached = localStorage.getItem('site_about_data');
                    if (cached) aboutData = { ...DEFAULT_ABOUT, ...JSON.parse(cached) };
                }
            } catch (e) {
                const cached = localStorage.getItem('site_about_data');
                if (cached) aboutData = { ...DEFAULT_ABOUT, ...JSON.parse(cached) };
            }
            renderAbout();
        }

        function renderAbout() {
            document.getElementById('about-bio-container').innerHTML = marked.parse(aboutData.bio || '');

            const pListEl = document.getElementById('about-pronouns-list');
            let list = Array.isArray(aboutData.pronouns) ? aboutData.pronouns : (aboutData.pronouns || '').split(',').map(s => s.trim()).filter(Boolean);
            if (!list.length) list = ['he/him'];

            pListEl.innerHTML = list.map(p => `<span class="pronoun-badge">${escapeAttr(p)}</span>`).join('');

            const noteEl = document.getElementById('about-pronouns-note');
            if (aboutData.pronouns_note && aboutData.pronouns_note.trim()) {
                noteEl.innerHTML = marked.parse(aboutData.pronouns_note.trim());
                noteEl.style.display = 'block';
            } else {
                noteEl.innerHTML = '';
                noteEl.style.display = 'none';
            }

            document.getElementById('about-skills-container').innerHTML = marked.parse(aboutData.skills || '');
            document.getElementById('about-socials-container').innerHTML = marked.parse(aboutData.socials || '');

            document.querySelectorAll('#about-bio-container a, #about-pronouns-note a, #about-skills-container a, #about-socials-container a').forEach(a => {
                const href = a.getAttribute('href') || '';
                if (href.startsWith('http') || href.startsWith('mailto:')) {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                } else if (href.startsWith('#')) {
                    a.onclick = (e) => {
                        e.preventDefault();
                        window.parent.location.hash = href.substring(1);
                    };
                }
            });
        }

        window.openEditSection = function (section) {
            if (!checkIsOwner()) return;
            activeEditSection = section;
            const titleEl = document.getElementById('edit-section-title');
            const fieldsEl = document.getElementById('edit-section-fields');

            if (section === 'bio') {
                titleEl.textContent = 'edit bio';
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>bio (markdown supported)</label>
                        <textarea id="edit-sec-bio" class="ui-input" rows="8" placeholder="write your bio here...">${escapeAttr(aboutData.bio || '')}</textarea>
                    </div>
                `;
            } else if (section === 'pronouns') {
                titleEl.textContent = 'edit pronouns';
                const list = Array.isArray(aboutData.pronouns) ? aboutData.pronouns.join(', ') : (aboutData.pronouns || '');
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>pronouns list (comma-separated)</label>
                        <input type="text" id="edit-sec-pronouns" class="ui-input" placeholder="e.g. he/him, they/them" value="${escapeAttr(list)}">
                    </div>
                    <div class="settings-group">
                        <label>pronouns note / details</label>
                        <textarea id="edit-sec-pronouns-note" class="ui-input" rows="3" placeholder="optional small note or extra details...">${escapeAttr(aboutData.pronouns_note || '')}</textarea>
                    </div>
                `;
            } else if (section === 'skills') {
                titleEl.textContent = 'edit skills';
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>skills (markdown list)</label>
                        <textarea id="edit-sec-skills" class="ui-input" rows="10" placeholder="- [Skill Name](URL)">${escapeAttr(aboutData.skills || '')}</textarea>
                    </div>
                `;
            } else if (section === 'socials') {
                titleEl.textContent = 'edit socials';
                fieldsEl.innerHTML = `
                    <div class="settings-group">
                        <label>socials (markdown list)</label>
                        <textarea id="edit-sec-socials" class="ui-input" rows="10" placeholder="- [Social Platform](URL)">${escapeAttr(aboutData.socials || '')}</textarea>
                    </div>
                `;
            }

            document.getElementById('edit-section-modal').style.display = 'flex';
        };

        window.closeEditSection = function () {
            document.getElementById('edit-section-modal').style.display = 'none';
            activeEditSection = null;
        };

        window.saveAboutSection = async function () {
            if (!checkIsOwner() || !activeEditSection) {
                alert("Permission denied. Only Error Dev can edit the about me page.");
                return;
            }

            if (activeEditSection === 'bio') {
                aboutData.bio = document.getElementById('edit-sec-bio').value.trim();
            } else if (activeEditSection === 'pronouns') {
                const pronounsRaw = document.getElementById('edit-sec-pronouns').value.trim();
                aboutData.pronouns = pronounsRaw.split(',').map(s => s.trim()).filter(Boolean);
                aboutData.pronouns_note = document.getElementById('edit-sec-pronouns-note').value.trim();
            } else if (activeEditSection === 'skills') {
                aboutData.skills = document.getElementById('edit-sec-skills').value.trim();
            } else if (activeEditSection === 'socials') {
                aboutData.socials = document.getElementById('edit-sec-socials').value.trim();
            }

            localStorage.setItem('site_about_data', JSON.stringify(aboutData));

            try {
                const { data: existing } = await supabaseClient.from('site_content').select('key').eq('key', 'about').maybeSingle();
                let error = null;
                if (existing) {
                    const res = await supabaseClient.from('site_content').update({ data: aboutData }).eq('key', 'about');
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('site_content').insert({ key: 'about', data: aboutData });
                    error = res.error;
                }
                if (error) throw error;
            } catch (err) {
                if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert("Saved locally, but Supabase table update encountered an error: " + err.message, "Sync Notice");
                }
            }

            renderAbout();
            closeEditSection();
        };

        async function loadHomeBlog() {
            try {
                const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'blogs').single();
                if (data && data.data && data.data.length > 0) {
                    const sorted = data.data.sort((a, b) => {
                        const pa = a.date.split('/'); const pb = b.date.split('/');
                        return new Date(pb[2], pb[1] - 1, pb[0]) - new Date(pa[2], pa[1] - 1, pa[0]);
                    });
                    const latest = sorted[0];
                    const container = document.getElementById('latest-blog-container');
                    container.innerHTML = `
                        <div style="font-family:var(--font-ui); font-size:11px; color:var(--fg-muted); margin-bottom:10px; border-bottom:1px dashed var(--border); padding-bottom:6px;">${latest.date}</div>
                        <div style="font-family:var(--font-ui); font-size:20px; font-weight:bold; color:var(--accent); margin-bottom:16px;">${latest.title}</div>
                        <div class="markdown-body" style="font-size:15px; line-height:1.8;">${marked.parse(latest.content)}</div>
                    `;
                    document.getElementById('latest-blog-card').onclick = () => {
                        window.parent.location.hash = `#Index/Blogs?id=${latest.id}`;
                    };
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateOwnerUI();
            syncAnonNameField();
            loadAboutData();
            loadHomeBlog();
            setInterval(() => {
                updateOwnerUI();
                syncAnonNameField();
            }, 1000);
        });
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
