<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 850px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">Liked Games</h1>
        
        <h2>Favorites</h2>
        <div id="fav-games-list" style="display:flex; flex-direction:column; gap:12px; margin-bottom:30px;"></div>

        <h2>Games I Like</h2>
        <div id="liked-games-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; margin-bottom:30px;"></div>

        <h2>Want to Play</h2>
        <div id="wtp-games-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px;"></div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function initGamesPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'games').single();
            if (data && data.data) {
                const games = data.data;
                
                document.getElementById('fav-games-list').innerHTML = (games.favorites || []).map(g => `
                    <div style="background:var(--bg-hover); border:1px solid var(--border); padding:16px;">
                        <div style="font-size:16px; font-weight:bold; color:var(--accent);">${g.title}</div>
                        <div style="font-size:12px; color:var(--fg-muted); margin-top:4px;">${g.comment || ''}</div>
                    </div>
                `).join('');

                document.getElementById('liked-games-grid').innerHTML = (games.liked || []).map(title => `
                    <div style="background:var(--bg-hover); border:1px solid var(--border); padding:12px; text-align:center; font-size:12px;">${title}</div>
                `).join('');

                document.getElementById('wtp-games-grid').innerHTML = (games.wanttoplay || []).map(title => `
                    <div style="background:var(--bg-hover); border:1px solid var(--border); padding:12px; text-align:center; font-size:12px;">${title}</div>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', initGamesPage);
    </script>
</body>
</html>
