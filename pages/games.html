<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 850px; margin: 0 auto; padding-bottom: 80px;" class="markdown-body">
        <h1 style="margin-bottom:30px;">Liked Games</h1>
        
        <h2>Favorites</h2>
        <ul id="fav-games-list" style="margin-bottom:30px;"></ul>

        <h2>Games I Like</h2>
        <ul id="liked-games-grid" style="margin-bottom:30px; display:flex; flex-direction:column; gap:6px;"></ul>

        <h2>Want to Play</h2>
        <ul id="wtp-games-grid" style="display:flex; flex-direction:column; gap:6px;"></ul>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function initGamesPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'games').single();
            if (data && data.data) {
                const games = data.data;
                
                document.getElementById('fav-games-list').innerHTML = (games.favorites || []).map(g => `
                    <li style="margin-bottom:12px;">
                        <strong style="color:var(--accent); font-size:16px;">${g.title}</strong>
                        ${g.comment ? `<div style="font-size:13px; color:var(--fg-muted); margin-top:2px;">${g.comment}</div>` : ''}
                    </li>
                `).join('');

                document.getElementById('liked-games-grid').innerHTML = (games.liked || []).map(title => `
                    <li>${title}</li>
                `).join('');

                document.getElementById('wtp-games-grid').innerHTML = (games.wanttoplay || []).map(title => `
                    <li>${title}</li>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', initGamesPage);
    </script>
</body>
</html>
