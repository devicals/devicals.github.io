<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>games i &lt;3</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .games-list-ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .games-list-li {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 20px;
            text-align: left;
        }
        .games-list-li:last-child {
            border-bottom: none;
        }
        .game-comment {
            font-size: 14px;
            color: var(--fg-main);
            margin-top: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            display: inline-block;
        }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;" class="markdown-body">
        <h1 style="margin-bottom:40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; text-align: left;">liked games</h1>

        <h2 style="text-align: left; margin-bottom: 20px;">favorites</h2>
        <ul id="fav-games-list" class="games-list-ul" style="margin-bottom:50px;"></ul>

        <h2 style="text-align: left; margin-bottom: 20px;">games i like</h2>
        <ul id="liked-games-grid" class="games-list-ul" style="margin-bottom:50px;"></ul>

        <h2 style="text-align: left; margin-bottom: 20px;">want to play</h2>
        <ul id="wtp-games-grid" class="games-list-ul"></ul>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let gamesData = { favorites: [], liked: [], wanttoplay: [] };

        function escapeHTML(str) { return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        async function initGamesPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'games').single();
            if (data && data.data) {
                gamesData = data.data;
                renderAll();
            }
        }

        function renderAll() {
            document.getElementById('fav-games-list').innerHTML = (gamesData.favorites || []).map((g) => `
                <li class="games-list-li">
                    <div>
                        <strong style="color:var(--accent); font-size:18px; display:block;">${escapeHTML(g.title)}</strong>
                        ${g.comment ? `<span class="game-comment">${escapeHTML(g.comment)}</span>` : ''}
                    </div>
                </li>
            `).join('');

            const renderSimple = (arr) => (arr || []).map((title) => `
                <li class="games-list-li">
                    <span style="font-size:16px; color:var(--fg-main);">${escapeHTML(title)}</span>
                </li>
            `).join('');

            document.getElementById('liked-games-grid').innerHTML = renderSimple(gamesData.liked);
            document.getElementById('wtp-games-grid').innerHTML = renderSimple(gamesData.wanttoplay);
        }

        document.addEventListener('DOMContentLoaded', initGamesPage);
    </script>
</body>
</html>
