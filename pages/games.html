<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .fav-card, .liked-card {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }
        .fav-card:hover, .liked-card:hover { border-color: var(--accent); }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 40px; }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <h1 style="margin-bottom:40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">Interests & Games</h1>
        
        <h2 style="color:var(--accent); margin-bottom:20px;">Favorites</h2>
        <div id="fav-games-list" style="display:flex; flex-direction:column; gap:20px; margin-bottom:50px;"></div>

        <h2 style="color:var(--accent); margin-bottom:20px;">Games I Like</h2>
        <div id="liked-games-grid" class="games-grid"></div>

        <h2 style="color:var(--accent); margin-bottom:20px;">Want to Play</h2>
        <div id="wtp-games-grid" class="games-grid"></div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let gamesData = { favorites: [], liked: [], wanttoplay: [] };

        async function initGamesPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'games').single();
            if (data && data.data) {
                gamesData = data.data;
                renderAll();
            }
        }

        function renderAll() {
            document.getElementById('fav-games-list').innerHTML = (gamesData.favorites || []).map((g) => `
                <div class="fav-card">
                    <strong style="color:var(--accent); font-size:20px;">${g.title}</strong>
                    ${g.comment ? `<div style="font-size:14px; color:var(--fg-main); line-height:1.6; white-space:pre-wrap;">${g.comment}</div>` : ''}
                </div>
            `).join('') || '<p style="color:var(--fg-muted);">No favorites added.</p>';

            const renderCards = (arr) => (arr || []).map((title) => `
                <div class="liked-card">
                    <span style="font-size:15px; font-weight:bold; color:var(--fg-main);">${title}</span>
                </div>
            `).join('') || '<p style="color:var(--fg-muted);">Empty list.</p>';

            document.getElementById('liked-games-grid').innerHTML = renderCards(gamesData.liked);
            document.getElementById('wtp-games-grid').innerHTML = renderCards(gamesData.wanttoplay);
        }

        document.addEventListener('DOMContentLoaded', initGamesPage);
    </script>
</body>
</html>
