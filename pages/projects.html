<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <h1 style="margin:0; font-size:32px;">projects</h1>
            <div id="admin-add-project-btn" style="display:none;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="addProject()">+ add project</button>
            </div>
        </div>
        <div id="project-tabs" style="display:flex; gap:20px; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:40px;"></div>
        <div id="projects-grid" class="flat-list-container"></div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let projectsData = { tabs: {} };
        let currentTabKey = null;
        let isAdminLocal = false;

        async function initProjectsPage() {
            isAdminLocal = window.parent.currentProfile?.is_admin || false;
            if (isAdminLocal) {
                document.getElementById('admin-add-project-btn').style.display = 'block';
            }

            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'projects').single();
            if (data && data.data) {
                projectsData = data.data;
                renderTabs();
            }
        }

        function renderTabs() {
            const tabsEl = document.getElementById('project-tabs');
            tabsEl.innerHTML = '';
            const keys = Object.keys(projectsData.tabs || {});
            if (!keys.length) return;
            if (!currentTabKey) currentTabKey = keys[0];

            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'ui-btn';
                btn.style.cssText = `width:auto; margin:0; border:none; border-bottom:2px solid transparent; background:transparent; font-size:16px; padding:0 0 4px 0; ${k === currentTabKey ? 'border-color:var(--accent); color:var(--accent);' : ''}`;
                btn.textContent = projectsData.tabs[k].display;
                btn.onclick = () => { currentTabKey = k; renderTabs(); };
                tabsEl.appendChild(btn);
            });

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            if (!currentTabKey || !projectsData.tabs[currentTabKey]) return;
            const list = projectsData.tabs[currentTabKey].projects || [];

            grid.innerHTML = list.map((p, idx) => `
                <div class="flat-list-item" style="padding-bottom:30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <a href="${p.link}" target="_blank" class="flat-title" style="font-size:24px;">${p.name} ↗</a>
                        ${isAdminLocal ? `<button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent;" onclick="deleteProject(${idx})">Delete</button>` : ''}
                    </div>
                    <div class="flat-desc" style="font-size:15px;">${p.description}</div>
                </div>
            `).join('');
        }

        window.addProject = async () => {
            if (!currentTabKey) return;
            const name = await window.parent.guiPrompt("project name:", "", "add project");
            if (!name) return;
            const desc = await window.parent.guiPrompt("project description:", "", "project description");
            const link = await window.parent.guiPrompt("project link URL:", "https://", "project URL");
            
            if (!projectsData.tabs[currentTabKey].projects) projectsData.tabs[currentTabKey].projects = [];
            projectsData.tabs[currentTabKey].projects.push({ name, description: desc, link });
            
            await supabaseClient.from('site_content').upsert({ key: 'projects', data: projectsData });
            renderGrid();
        };

        window.deleteProject = async (idx) => {
            const conf = await window.parent.guiConfirm("delete this project?", "confirm deletion");
            if (conf) {
                projectsData.tabs[currentTabKey].projects.splice(idx, 1);
                await supabaseClient.from('site_content').upsert({ key: 'projects', data: projectsData });
                renderGrid();
            }
        };

        document.addEventListener('DOMContentLoaded', initProjectsPage);
    </script>
</body>
</html>
