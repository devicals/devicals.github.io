<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Projects</h1>
        </div>
        <div id="project-tabs" style="display:flex; gap:10px; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:20px;"></div>
        <div id="projects-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px;"></div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let projectsData = { tabs: {} };
        let currentTabKey = null;

        async function initProjectsPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'projects').single();
            if (data && data.data) {
                projectsData = data.data;
                renderTabs();
            }
        }

        function renderTabs() {
            const tabsEl = document.getElementById('project-tabs');
            tabsEl.innerHTML = '';
            const keys = Object.keys(projectsData.tabs || {});
            if (!keys.length) return;
            if (!currentTabKey) currentTabKey = keys[0];

            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'ui-btn';
                btn.style.cssText = `width:auto; margin:0; ${k === currentTabKey ? 'border-color:var(--accent); color:var(--accent);' : ''}`;
                btn.textContent = projectsData.tabs[k].display;
                btn.onclick = () => { currentTabKey = k; renderTabs(); };
                tabsEl.appendChild(btn);
            });

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            if (!currentTabKey || !projectsData.tabs[currentTabKey]) return;
            const list = projectsData.tabs[currentTabKey].projects || [];

            grid.innerHTML = list.map(p => `
                <div style="background:var(--bg-hover); border:1px solid var(--border); border-radius:6px !important; padding:16px; display:flex; flex-direction:column; gap:8px;">
                    <a href="${p.link}" target="_blank" style="color:var(--accent); font-weight:bold; text-decoration:none;">${p.name} ↗</a>
                    <div style="font-size:12px; color:var(--fg-main); line-height:1.5;">${p.description}</div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', initProjectsPage);
    </script>
</body>
</html>
