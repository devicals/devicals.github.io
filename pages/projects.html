<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <h1 style="margin:0; font-size:32px;">projects</h1>
            <div id="admin-add-project-btn" style="display:none; gap:10px;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="manageTabsModal()">manage tabs</button>
                <button class="ui-btn" style="width:auto; margin:0; border-color:var(--accent); color:var(--accent);" onclick="addProject()">+ add project</button>
            </div>
        </div>
        <div id="project-tabs" style="display:flex; gap:20px; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:40px;"></div>
        <div id="projects-grid" class="flat-list-container"></div>
    </div>

    <div id="tabs-modal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center;">
        <div class="modal-box" style="background:var(--bg-sidebar); border:1px solid var(--border); padding:24px; width:480px; max-width:90vw; max-height:85vh; overflow-y:auto; font-family:var(--font-ui);">
            <div class="modal-title" style="font-size:16px; font-weight:bold; color:var(--accent); margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:8px;">manage project tabs</div>
            <div id="tabs-manage-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;"></div>
            <div style="border-top:1px dashed var(--border); padding-top:16px; margin-top:16px;">
                <label style="font-size:11px; color:var(--fg-muted); display:block; margin-bottom:6px;">+ create new tab</label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="new-tab-name-input" class="ui-input" placeholder="tab name..." style="margin:0; flex:1;">
                    <button class="ui-btn" style="width:auto; margin:0; border-color:var(--accent); color:var(--accent);" onclick="addNewTabFromModal()">add tab</button>
                </div>
            </div>
            <button class="ui-btn" style="margin-top:20px; border-color:var(--border);" onclick="closeTabsModal()">close</button>
        </div>
    </div>

    <div class="copy-toast" id="copy-toast" style="position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--bg-main); padding:10px 20px; font-family:var(--font-ui); font-size:12px; font-weight:bold; z-index:999; opacity:0; transition:opacity 0.2s;">link copied</div>

    <script>
        const _sbUrl = atob("aHR0cHM6Ly93dGFzZXNtcXdwbmJ3emR5bm5hcy5zdXBhYmFzZS5jbw==");
        const _sbKey = atob("c2JfcHVibGlzaGFibGVfYXkwUHVJZVBqWndyRWdQNVhwRDVpUV9XNXdDLTVnOQ==");
        const supabaseClient = supabase.createClient(_sbUrl, _sbKey);

        let projectsData = { tabs: {} };
        let currentTabKey = null;
        let isOwnerLocal = false;

        function escapeHTML(str) {
            return (str || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function formPrompt(fields, title) {
            if (window.parent && window.parent.guiForm) return window.parent.guiForm(fields, title);
            const result = {};
            for (const f of fields) {
                const val = prompt(f.label, f.value || '');
                if (val === null) return null;
                result[f.key] = val;
            }
            return result;
        }
        async function confirmAction(msg) {
            if (window.parent && window.parent.guiConfirm) return window.parent.guiConfirm(msg);
            return confirm(msg);
        }

        async function initProjectsPage() {
            const ident = window.parent && window.parent.getUserIdentity ? window.parent.getUserIdentity() : { user: null, isOwner: false, isAdmin: false };
            isOwnerLocal = ident.isOwner;

            const btnContainer = document.getElementById('admin-add-project-btn');
            if (isOwnerLocal) {
                btnContainer.style.display = 'flex';
            } else {
                btnContainer.style.display = 'none';
            }

            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'projects').single();
            if (data && data.data) {
                projectsData = data.data;

                let needsUpdate = false;
                let maxId = 0;
                Object.values(projectsData.tabs || {}).forEach(t => {
                    (t.projects || []).forEach(p => {
                        if (p.id && p.id < 1000000000000 && p.id > maxId) maxId = p.id;
                    });
                });

                Object.keys(projectsData.tabs || {}).forEach(k => {
                    (projectsData.tabs[k].projects || []).forEach(p => {
                        if (!p.id || p.id > 1000000000000) {
                            p.id = ++maxId;
                            needsUpdate = true;
                        }
                    });
                });
                
                if (needsUpdate && isOwnerLocal) {
                    await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
                }

                const params = new URLSearchParams(window.location.search);
                const targetId = params.get('id');
                let targetFoundInTab = null;

                if (targetId) {
                    for (const k of Object.keys(projectsData.tabs || {})) {
                        if ((projectsData.tabs[k].projects || []).some(p => String(p.id) === targetId)) {
                            targetFoundInTab = k;
                            break;
                        }
                    }
                }

                if (targetFoundInTab) {
                    currentTabKey = targetFoundInTab;
                } else {
                    const urlTab = params.get('tab');
                    if (urlTab && projectsData.tabs && projectsData.tabs[urlTab]) {
                        currentTabKey = urlTab;
                    }
                }

                renderTabs();

                if (targetId) {
                    setTimeout(() => {
                        const el = document.getElementById(`project-${targetId}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                }
            }
        }

        window.onParentAuthChanged = initProjectsPage;

        function updateTabUrl() {
            if (!window.parent) return;
            const baseHash = window.parent.location.hash.split('?')[0].substring(1);
            window.parent.history.replaceState(null, null, `#${baseHash}?tab=${encodeURIComponent(currentTabKey)}`);
        }

        function renderTabs() {
            const tabsEl = document.getElementById('project-tabs');
            tabsEl.innerHTML = '';
            const keys = Object.keys(projectsData.tabs || {});
            if (!keys.length) return;
            if (!currentTabKey || !projectsData.tabs[currentTabKey]) currentTabKey = keys[0];
            updateTabUrl();

            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'ui-btn';
                btn.style.cssText = `width:auto; margin:0; border:none; border-bottom:2px solid transparent; background:transparent; font-size:16px; padding:0 0 4px 0; ${k === currentTabKey ? 'border-color:var(--accent); color:var(--accent);' : ''}`;
                btn.textContent = projectsData.tabs[k].display;
                btn.onclick = () => { currentTabKey = k; renderTabs(); };
                tabsEl.appendChild(btn);
            });

            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            if (!currentTabKey || !projectsData.tabs[currentTabKey]) return;
            const list = projectsData.tabs[currentTabKey].projects || [];

            grid.innerHTML = list.map((p, idx) => `
                <div class="flat-list-item" id="project-${p.id || idx}" style="padding-bottom:30px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <a href="${escapeHTML(p.link)}" target="_blank" class="flat-title" style="font-size:24px;">${escapeHTML(p.name)} ↗</a>
                        <div style="display:flex; gap:8px; align-items:center;">
                            ${p.id ? `<button class="post-id-btn" style="cursor:pointer; background:none; border:none; padding:0; width:auto; margin:0; color:var(--fg-muted); font-size:12px; font-family:var(--font-ui);" onclick="copyProjectLink('${p.id}')">ID: #${p.id}</button>` : ''}
                            ${isOwnerLocal ? `<div style="display:flex; gap:8px;">
                                <button class="ui-btn" style="width:auto; margin:0;" onclick="editProject(${idx})">edit</button>
                                <button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent;" onclick="deleteProject(${idx})">delete</button>
                            </div>` : ''}
                        </div>
                    </div>
                    <div class="flat-desc" style="font-size:15px; margin-bottom:8px;">${escapeHTML(p.description)}</div>
                </div>
            `).join('');
        }

        window.copyProjectLink = function (id) {
            const url = `${window.parent.location.origin}${window.parent.location.pathname}#Content/Projects?id=${id}`;
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1600);
            });
        };

        window.addProject = async () => {
            if (!isOwnerLocal || !currentTabKey) return;
            const result = await formPrompt([
                { key: 'name', label: 'project name' },
                { key: 'description', label: 'description', type: 'textarea', rows: 4 },
                { key: 'link', label: 'project link URL', value: 'https://' }
            ], 'new project');
            if (!result || !result.name) return;

            if (!projectsData.tabs[currentTabKey].projects) projectsData.tabs[currentTabKey].projects = [];
            
            let maxId = 0;
            Object.values(projectsData.tabs || {}).forEach(t => {
                (t.projects || []).forEach(p => { if (p.id > maxId) maxId = p.id; });
            });
            const nextId = maxId + 1;
            
            projectsData.tabs[currentTabKey].projects.push({ id: nextId, name: result.name, description: result.description, link: result.link });

            await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
            renderGrid();
        };

        window.editProject = async (idx) => {
            if (!isOwnerLocal || !currentTabKey) return;
            const proj = projectsData.tabs[currentTabKey].projects[idx];
            const result = await formPrompt([
                { key: 'name', label: 'project name', value: proj.name },
                { key: 'description', label: 'description', type: 'textarea', rows: 4, value: proj.description },
                { key: 'link', label: 'link URL', value: proj.link }
            ], 'edit project');
            if (!result) return;
            proj.name = result.name;
            proj.description = result.description;
            proj.link = result.link;
            if (!proj.id) {
                let maxId = 0;
                Object.values(projectsData.tabs || {}).forEach(t => {
                    (t.projects || []).forEach(p => { if (p.id > maxId) maxId = p.id; });
                });
                proj.id = maxId + 1;
            }
            await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
            renderGrid();
        };

        window.deleteProject = async (idx) => {
            if (!isOwnerLocal) return;
            const conf = await confirmAction("delete this project?");
            if (conf) {
                projectsData.tabs[currentTabKey].projects.splice(idx, 1);
                await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
                renderGrid();
            }
        };

        window.manageTabsModal = function() {
            if (!isOwnerLocal) return;
            renderTabsManageList();
            document.getElementById('tabs-modal').style.display = 'flex';
        };

        window.closeTabsModal = function() {
            document.getElementById('tabs-modal').style.display = 'none';
        };

        function renderTabsManageList() {
            const container = document.getElementById('tabs-manage-list');
            const keys = Object.keys(projectsData.tabs || {});
            if (!keys.length) {
                container.innerHTML = '<span style="color:var(--fg-muted); font-size:12px;">no tabs available.</span>';
                return;
            }

            container.innerHTML = keys.map((k, idx) => {
                const tab = projectsData.tabs[k];
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-main); border:1px solid var(--border); padding:10px 12px; gap:8px;">
                        <span style="font-weight:bold; color:var(--fg-main); flex:1;">${escapeHTML(tab.display)}</span>
                        <div style="display:flex; gap:6px;">
                            ${idx > 0 ? `<button class="ui-btn" style="width:auto; margin:0; padding:2px 6px; font-size:11px;" onclick="moveTab('${k}', -1)">▲</button>` : ''}
                            ${idx < keys.length - 1 ? `<button class="ui-btn" style="width:auto; margin:0; padding:2px 6px; font-size:11px;" onclick="moveTab('${k}', 1)">▼</button>` : ''}
                            <button class="ui-btn" style="width:auto; margin:0; padding:2px 6px; font-size:11px;" onclick="renameTabModal('${k}')">rename</button>
                            <button class="ui-btn" style="width:auto; margin:0; padding:2px 6px; font-size:11px; color:var(--destructive);" onclick="deleteTabModal('${k}')">delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addNewTabFromModal = async function() {
            const input = document.getElementById('new-tab-name-input');
            const name = input.value.trim();
            if (!name) return;
            const key = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            if (!projectsData.tabs) projectsData.tabs = {};
            if (projectsData.tabs[key]) {
                alert("A tab with this name already exists.");
                return;
            }
            projectsData.tabs[key] = { display: name, projects: [] };
            currentTabKey = key;
            input.value = '';
            await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
            renderTabsManageList();
            renderTabs();
        };

        window.renameTabModal = async function(key) {
            const tab = projectsData.tabs[key];
            const newName = await formPrompt([{ key: 'name', label: 'new tab name', value: tab.display }], 'rename tab');
            if (!newName || !newName.name || !newName.name.trim()) return;
            tab.display = newName.name.trim();
            await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
            renderTabsManageList();
            renderTabs();
        };

        window.deleteTabModal = async function(key) {
            const ok = await confirmAction(`delete tab '${projectsData.tabs[key].display}' and all its projects?`);
            if (!ok) return;
            delete projectsData.tabs[key];
            const keys = Object.keys(projectsData.tabs);
            currentTabKey = keys.length ? keys[0] : null;
            await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
            renderTabsManageList();
            renderTabs();
        };

        window.moveTab = async function(key, dir) {
            const entries = Object.entries(projectsData.tabs || {});
            const idx = entries.findIndex(([k]) => k === key);
            if (idx < 0) return;
            const targetIdx = idx + dir;
            if (targetIdx < 0 || targetIdx >= entries.length) return;

            if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;

            const temp = entries[idx];
            entries[idx] = entries[targetIdx];
            entries[targetIdx] = temp;

            const newTabs = {};
            entries.forEach(([k, v]) => { 
                if (k === '__proto__' || k === 'constructor' || k === 'prototype') return;
                newTabs[k] = v; 
            });
            projectsData.tabs = newTabs;

            await supabaseClient.from('site_content').update({ data: projectsData }).eq('key', 'projects');
            renderTabsManageList();
            renderTabs();
        };

        document.addEventListener('DOMContentLoaded', initProjectsPage);
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
