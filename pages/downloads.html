<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>downloads</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <h1 style="margin:0; font-size:32px;">downloads</h1>
            <div id="admin-add-download-btn" style="display:none;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="addDownload()">+ add download</button>
            </div>
        </div>
        <div id="downloads-list" class="flat-list-container" style="gap:40px;"></div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let dlList = [];
        let isAdminLocal = false;

        async function promptText(msg, def) {
            if (window.parent && window.parent.guiPrompt) return window.parent.guiPrompt(msg, def || '');
            return prompt(msg, def || '');
        }
        async function confirmAction(msg) {
            if (window.parent && window.parent.guiConfirm) return window.parent.guiConfirm(msg);
            return confirm(msg);
        }

        async function initDownloadsPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
                if (prof?.is_admin || session.user.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
                    isAdminLocal = true;
                }
            }
            if (isAdminLocal) {
                document.getElementById('admin-add-download-btn').style.display = 'block';
            }

            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'downloads').single();
            if (data && data.data) {
                dlList = data.data;
                renderDownloads();
            }
        }

        function renderDownloads() {
            document.getElementById('downloads-list').innerHTML = dlList.map((d, idx) => `
                <div class="flat-list-item" style="flex-direction: row; justify-content: space-between; align-items: center; padding-bottom:30px;">
                    <div style="flex:1;">
                        <div class="flat-title" style="font-size:22px; margin-bottom:8px;">${d.name}</div>
                        <div class="flat-meta" style="font-size:14px; color:var(--fg-main);">${d.description}</div>
                    </div>
                    <div style="display:flex; gap:12px; align-items:center;">
                        <a href="${d.url}" target="_blank" class="ui-btn" style="width:auto; margin:0; text-decoration:none; padding:10px 20px;">download</a>
                        ${isAdminLocal ? `
                            <button class="ui-btn" style="width:auto; margin:0;" onclick="editDownload(${idx})">edit</button>
                            <button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent;" onclick="deleteDownload(${idx})">✕</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.addDownload = async () => {
            const name = await promptText("download name:", "");
            if (!name) return;
            const desc = await promptText("description:", "");
            const url = await promptText("download URL:", "https://");

            dlList.push({ id: Date.now(), name, description: desc, url });
            await supabaseClient.from('site_content').upsert({ key: 'downloads', data: dlList });
            renderDownloads();
        };

        window.editDownload = async (idx) => {
            const d = dlList[idx];
            const name = await promptText("download name:", d.name);
            if (name === null) return;
            const desc = await promptText("description:", d.description);
            const url = await promptText("URL:", d.url);
            dlList[idx].name = name; dlList[idx].description = desc; dlList[idx].url = url;
            await supabaseClient.from('site_content').upsert({ key: 'downloads', data: dlList });
            renderDownloads();
        };

        window.deleteDownload = async (idx) => {
            const conf = await confirmAction("delete this download link?");
            if (conf) {
                dlList.splice(idx, 1);
                await supabaseClient.from('site_content').upsert({ key: 'downloads', data: dlList });
                renderDownloads();
            }
        };

        document.addEventListener('DOMContentLoaded', initDownloadsPage);
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
