<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Downloads - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 800px; margin: 0 auto; padding-bottom: 80px;">
        <h1 style="margin-bottom:20px;">Downloads</h1>
        <div id="downloads-list" style="display:flex; flex-direction:column; gap:16px;"></div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function initDownloadsPage() {
            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'downloads').single();
            if (data && data.data) {
                const list = data.data;
                document.getElementById('downloads-list').innerHTML = list.map(d => `
                    <div style="background:var(--bg-hover); border:1px solid var(--border); border-radius:6px !important; padding:16px; display:flex; justify-content:space-between; align-items:center; gap:16px;">
                        <div>
                            <div style="color:var(--accent); font-weight:bold; font-size:15px;">${d.name}</div>
                            <div style="font-size:12px; color:var(--fg-muted); margin-top:4px;">${d.description}</div>
                        </div>
                        <a href="${d.url}" target="_blank" class="ui-btn" style="width:auto; margin:0; text-decoration:none;">Download</a>
                    </div>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', initDownloadsPage);
    </script>
</body>
</html>
