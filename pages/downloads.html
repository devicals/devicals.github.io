<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>downloads</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <h1 style="margin:0; font-size:32px;">downloads</h1>
            <div id="admin-add-download-btn" style="display:none;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="addDownload()">+ add download</button>
            </div>
        </div>
        <div id="downloads-list" class="flat-list-container" style="gap:40px;"></div>
    </div>

    <div class="copy-toast" id="copy-toast" style="position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--bg-main); padding:10px 20px; font-family:var(--font-ui); font-size:12px; font-weight:bold; z-index:999; opacity:0; transition:opacity 0.2s;">link copied</div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let dlList = [];
        let isOwnerLocal = false;

        async function formPrompt(fields, title) {
            if (window.parent && window.parent.guiForm) return window.parent.guiForm(fields, title);
            const result = {};
            for (const f of fields) {
                const val = prompt(f.label, f.value || '');
                if (val === null) return null;
                result[f.key] = val;
            }
            return result;
        }
        async function confirmAction(msg) {
            if (window.parent && window.parent.guiConfirm) return window.parent.guiConfirm(msg);
            return confirm(msg);
        }

        async function initDownloadsPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
                if (prof?.is_owner || session.user.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
                    isOwnerLocal = true;
                }
            }
            if (isOwnerLocal) {
                document.getElementById('admin-add-download-btn').style.display = 'block';
            }

            const { data } = await supabaseClient.from('site_content').select('data').eq('key', 'downloads').single();
            if (data && data.data) {
                dlList = data.data;
            }
            renderDownloads();

            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id');
            if (targetId) {
                setTimeout(() => {
                    const el = document.getElementById(`download-${targetId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }
        }

        function renderDownloads() {
            document.getElementById('downloads-list').innerHTML = dlList.map((d, idx) => `
                <div class="flat-list-item" id="download-${d.id}" style="flex-direction: row; justify-content: space-between; align-items: center; padding-bottom:30px;">
                    <div style="flex:1;">
                        <div class="flat-title" style="font-size:22px; margin-bottom:8px;">${d.name}</div>
                        <div class="flat-meta" style="font-size:14px; color:var(--fg-main); margin-bottom:6px;">${d.description}</div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button class="post-id-btn" style="cursor:pointer; background:none; border:none; padding:0; width:auto; margin:0; color:var(--fg-muted); font-size:12px; font-family:var(--font-ui);" onclick="copyDownloadLink(${d.id})">ID: #${d.id}</button>
                        </div>
                    </div>
                    <div style="display:flex; gap:12px; align-items:center;">
                        <a href="${d.url}" target="_blank" class="ui-btn" style="width:auto; margin:0; text-decoration:none; padding:10px 20px;">download</a>
                        ${isOwnerLocal ? `
                            <button class="ui-btn" style="width:auto; margin:0;" onclick="editDownload(${idx})">edit</button>
                            <button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); background:transparent;" onclick="deleteDownload(${idx})">✕</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.copyDownloadLink = function (id) {
            const url = `${window.parent.location.origin}${window.parent.location.pathname}#Content/Downloads?id=${id}`;
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1600);
            });
        };

        window.addDownload = async () => {
            if (!isOwnerLocal) return;
            const result = await formPrompt([
                { key: 'name', label: 'download name' },
                { key: 'description', label: 'description', type: 'textarea', rows: 4 },
                { key: 'url', label: 'download URL', value: 'https://' }
            ], 'new download');
            if (!result || !result.name) return;

            const nextId = dlList.length > 0 ? Math.max(...dlList.map(x => x.id || 0)) + 1 : 1;
            dlList.push({ id: nextId, name: result.name, description: result.description, url: result.url });
            await supabaseClient.from('site_content').update({ data: dlList }).eq('key', 'downloads');
            renderDownloads();
        };

        window.editDownload = async (idx) => {
            if (!isOwnerLocal) return;
            const d = dlList[idx];
            const result = await formPrompt([
                { key: 'name', label: 'download name', value: d.name },
                { key: 'description', label: 'description', type: 'textarea', rows: 4, value: d.description },
                { key: 'url', label: 'URL', value: d.url }
            ], 'edit download');
            if (!result) return;
            dlList[idx].name = result.name; dlList[idx].description = result.description; dlList[idx].url = result.url;
            await supabaseClient.from('site_content').update({ data: dlList }).eq('key', 'downloads');
            renderDownloads();
        };

        window.deleteDownload = async (idx) => {
            if (!isOwnerLocal) return;
            const conf = await confirmAction("delete this download link?");
            if (conf) {
                dlList.splice(idx, 1);
                await supabaseClient.from('site_content').update({ data: dlList }).eq('key', 'downloads');
                renderDownloads();
            }
        };

        document.addEventListener('DOMContentLoaded', initDownloadsPage);
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
