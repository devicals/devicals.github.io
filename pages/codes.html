<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Translator - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 800px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">Code Translator</h1>
        
        <div class="settings-group">
            <label>Input Text</label>
            <textarea id="translator-input" class="ui-input" rows="4" placeholder="Type text here..."></textarea>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="ui-btn" onclick="translateText('binary')">Binary</button>
            <button class="ui-btn" onclick="translateText('hex')">Hexadecimal</button>
            <button class="ui-btn" onclick="translateText('base64')">Base64</button>
        </div>

        <div class="settings-group">
            <label>Translated Result</label>
            <textarea id="translator-output" class="ui-input" rows="4" readonly></textarea>
        </div>
    </div>

    <script>
        function translateText(mode) {
            const input = document.getElementById('translator-input').value;
            const output = document.getElementById('translator-output');
            
            if (mode === 'binary') {
                output.value = input.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
            } else if (mode === 'hex') {
                output.value = input.split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ');
            } else if (mode === 'base64') {
                output.value = btoa(input);
            }
        }
    </script>
</body>
</html>
