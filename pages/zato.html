<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z.A.T.O Live Tier List</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
      .tl-layout { display: flex; height: 100vh; background: var(--bg-workspace); }
      .tl-main { flex: 1; padding: 22px 18px 60px 18px; min-width: 0; overflow-y: auto; }
      
      .tl-sidebar { display: none; width: 300px; min-width: 300px; height: 100vh; overflow-y: auto; border-left: 1px solid var(--border); background: var(--bg-sidebar); padding: 20px; flex-direction: column; gap: 20px; flex-shrink: 0; }
      body.is-admin .tl-sidebar { display: flex; }

      .tl-header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
      .tl-title { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }

      .live-badge { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; border: 1px solid var(--accent); padding: 4px 8px; font-weight: 700; }

      .tier-list {
        display: grid;
        grid-template-columns: repeat(var(--tier-cols, 1), 1fr);
        grid-auto-flow: column;
        grid-template-rows: repeat(var(--tier-rows, 15), auto);
        gap: 3px;
      }

      .tier-row { display: flex; align-items: stretch; border: 1px solid var(--border); transition: border-color 0.2s; position: relative; }
      .tier-row.is-exec-row .tier-items { background: rgba(204, 85, 85, 0.15); }

      .tier-label {
        width: 80px; min-width: 80px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 700; letter-spacing: 1px;
        cursor: pointer; user-select: none; flex-shrink: 0; position: relative; min-height: 56px;
        text-align: center; word-break: break-word; padding: 4px;
      }

      .tier-items {
        flex: 1; display: flex; flex-direction: column; gap: 0; padding: 0;
        background: var(--bg-hover); border-left: 1px solid var(--border);
        min-height: 56px;
      }
      .tier-item-row { display: flex; flex-wrap: wrap; flex: 1; min-height: 56px; padding: 4px; gap: 4px; }
      
      .tilt-wrapper { flex: 0 0 auto; display: flex; flex-direction: column; user-select: none; min-width: 80px; }

      .tl-item {
        padding: 6px 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--fg-main);
        text-align: center; font-size: 12px; word-break: break-word; line-height: 1.2;
      }
      .tl-item.exec-item { border-color: var(--destructive); color: var(--destructive); background: rgba(204,85,85,0.1); }

      .pool-area { min-height: 60px; display: flex; flex-wrap: wrap; gap: 4px; padding: 7px; background: var(--bg-hover); border: 1px solid var(--border); }
      .pool-area .tilt-wrapper { flex: 0 0 auto; min-width: 70px; }

      .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
      .sidebar-label { font-size: 12px; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  </style>
  </head>

  <body>
  <div class="tl-layout">
    <div class="tl-main">
      <div class="tl-header">
        <div class="tl-title">Z.A.T.O Live Tier List</div>
        <div class="live-badge">LIVE SYNC</div>
      </div>
      <div class="tier-list" id="tierList"></div>
    </div>

    <div class="tl-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Unranked Pool</div>
        <div class="pool-area" id="pool" data-tier="__pool__"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Add Item</div>
        <input type="text" id="itemInput" placeholder="Item Name..." />
        <button class="ui-btn" onclick="addItem()">+ Add</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
    const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const TIERS_BASE = [
      { id:'A', label:'A', color:'#FFD93B', text:'#2a1a00', isExec:false },
      { id:'BA', label:'B ~ A', color:'#A8D63F', text:'#1a2a00', isExec:false },
      { id:'Asya', label:'AsyaLarp', color:'#f38ba8', text:'#fff', isExec:false },
      { id:'B', label:'B', color:'#3FD67A', text:'#003020', isExec:false },
      { id:'SEA', label:'SEA', color:'#3FBDD6', text:'#002030', isExec:false },
      { id:'Dweeb', label:'Dweeb', color:'#3F7ED6', text:'#fff', isExec:false },
      { id:'E', label:'E', color:'#7B5EA7', text:'#fff', isExec:false },
      { id:'EXEC', label:'EXECUTION', color:'#8B0000', text:'#ff6b6b', isExec:true }
    ];

    let allTiers = JSON.parse(JSON.stringify(TIERS_BASE));
    let tierItems = {};
    let poolItems = [];
    let dragItem = null, dragSrc = null;
    let isAdmin = false;

    async function init() {
        const profile = window.parent.currentProfile;
        if (profile?.is_admin) {
            isAdmin = true;
            document.body.classList.add('is-admin');
        }

        const { data } = await supabaseClient.from('zato_tierlist').select('state').eq('id', 1).single();
        if (data && data.state) {
            applyState(data.state);
        } else {
            renderAll();
        }

        supabaseClient.channel('zato-realtime').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'zato_tierlist', filter: 'id=eq.1' }, (payload) => {
            if (payload.new && payload.new.state) {
                applyState(payload.new.state);
            }
        }).subscribe();
    }

    function applyState(state) {
        tierItems = state.tierItems || {};
        poolItems = state.poolItems || [];
        renderAll();
    }

    async function syncState() {
        if (!isAdmin) return;
        const state = { allTiers, tierItems, poolItems };
        await supabaseClient.from('zato_tierlist').update({ state }).eq('id', 1);
    }

    function renderAll() {
      renderTiers(); renderPool();
    }

    function renderTiers() {
      const list = document.getElementById('tierList'); list.innerHTML = '';
      allTiers.forEach(tier => {
        const row = document.createElement('div');
        row.className = 'tier-row' + (tier.isExec ? ' is-exec-row' : '');

        const lbl = document.createElement('div');
        lbl.className = 'tier-label';
        lbl.style.background = tier.color; lbl.style.color = tier.text;
        lbl.textContent = tier.label;
        row.appendChild(lbl);

        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'tier-items';
        itemsDiv.dataset.tier = tier.id;
        setupDrop(itemsDiv);

        const listArr = tierItems[tier.id] || [];
        const rowDiv = document.createElement('div');
        rowDiv.className = 'tier-item-row';
        listArr.forEach(item => rowDiv.appendChild(makeCard(item, tier.id)));
        itemsDiv.appendChild(rowDiv);
        row.appendChild(itemsDiv);
        list.appendChild(row);
      });
    }

    function renderPool() {
      const pool = document.getElementById('pool'); pool.innerHTML = '';
      if (!poolItems.length) {
        pool.innerHTML = '<div class="pool-empty">add items below</div>'; return;
      }
      poolItems.forEach(item => pool.appendChild(makeCard(item, '__pool__')));
      setupDrop(pool);
    }

    function makeCard(item, tier) {
      const wrap = document.createElement('div'); wrap.className = 'tilt-wrapper';
      if (isAdmin) wrap.draggable = true;
      const card = document.createElement('div');
      card.className = 'tl-item' + (tier === 'EXEC' ? ' exec-item' : '');
      card.textContent = item.label;
      wrap.appendChild(card);

      wrap.addEventListener('dragstart', () => { dragItem = item; dragSrc = tier; });
      return wrap;
    }

    function setupDrop(el) {
      el.addEventListener('dragover', e => { if (isAdmin) e.preventDefault(); });
      el.addEventListener('drop', e => {
        if (!isAdmin) return;
        e.preventDefault(); if (!dragItem) return;
        const dest = el.dataset.tier;
        if (dest === dragSrc) return;
        
        if (dragSrc === '__pool__') poolItems = poolItems.filter(i => i.id !== dragItem.id);
        else tierItems[dragSrc] = (tierItems[dragSrc] || []).filter(i => i.id !== dragItem.id);

        if (dest === '__pool__') poolItems.push(dragItem);
        else { if (!tierItems[dest]) tierItems[dest] = []; tierItems[dest].push(dragItem); }

        dragItem = null; dragSrc = null; 
        renderAll();
        syncState();
      });
    }

    function addItem() {
      if (!isAdmin) return;
      const input = document.getElementById('itemInput');
      const val = input.value.trim(); if (!val) return;
      poolItems.push({ id: 'item_' + Date.now(), label: val });
      input.value = ''; 
      renderAll();
      syncState();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  </body>
</html>
