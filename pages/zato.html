<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z.A.T.O Live Tier List</title>
  <link rel="stylesheet" href="../css/style.css">
    <style>
      .tl-layout { display: flex; height: 100vh; background: var(--bg-workspace); }
      .tl-main { flex: 1; padding: 22px 18px 60px 18px; min-width: 0; overflow-y: auto; }

      .tl-sidebar { width: 300px; min-width: 300px; height: 100vh; overflow-y: auto; border-left: 1px solid var(--border); background: var(--bg-sidebar); padding: 20px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }
      body:not(.is-admin) .tl-sidebar { display: none; }

      .tl-header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
      .tl-title { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 3px; display: flex; align-items: center; gap: 12px; }

      select, input[type=text], button {
        font-family: var(--font-ui); font-size: 12px; padding: 5px 9px;
        background: var(--bg-main); border: 1px solid var(--border);
        color: var(--fg-main); cursor: pointer; outline: none; transition: border-color 0.2s, color 0.2s;
      }
      select:hover, input[type=text]:hover, button:hover { border-color: var(--accent); }

      .btn-primary { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); font-weight: 700; }

      .tier-list { display: flex; flex-direction: column; gap: 3px; }

      .tier-row { display: flex; align-items: stretch; border: 1px solid var(--border); transition: border-color 0.2s; position: relative; }

      .tier-label {
        width: 80px; min-width: 80px;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 700; letter-spacing: 1px;
        cursor: pointer; user-select: none; flex-shrink: 0; position: relative; min-height: 56px;
        text-align: center; word-break: break-word; padding: 4px;
      }

      .tier-items {
        flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; padding: 6px;
        background: var(--bg-hover); border-left: 1px solid var(--border);
        transition: background 0.15s; min-height: 56px;
      }

      .tilt-wrapper { flex: 0 0 auto; min-width: 90px; max-width: 200px; user-select: none; }

      .tl-item {
        width: 100%; height: 100%; min-height: 44px; display: flex; align-items: center;
        padding: 8px 12px; background: var(--bg-main); color: var(--fg-main);
        text-align: left; position: relative; box-sizing: border-box;
        border: 1px solid var(--border);
      }

      .tl-item-text-block { flex: 1; min-width: 0; overflow: hidden; }
      .tl-item-label { font-size: clamp(10px, 1.05vw, 13px); line-height: 1.25; overflow-wrap: anywhere; display: block; }

      .tl-item-remove { background: transparent; border: none; color: var(--destructive); font-size: 10px; padding: 0 0 0 6px; width: auto; margin: 0; }

      .pool-area { min-height: 60px; display: flex; flex-wrap: wrap; gap: 4px; padding: 7px; background: var(--bg-hover); border: 1px solid var(--border); }
      .pool-empty { font-size: 11px; color: var(--fg-muted); font-style: italic; width: 100%; text-align: center; padding: 12px 0; }
      .pool-area .tilt-wrapper { min-width: 70px; max-width: 130px; }
      .pool-area .tl-item { height: 56px; }

      .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
      .sidebar-label { font-size: 12px; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    </style>
  </head>

  <body>
  <div class="tl-layout">
    <div class="tl-main">
      <div class="tl-header">
        <div class="tl-title">Z.A.T.O Tier List</div>
      </div>
      <div id="tl-error" style="display:none; color:var(--destructive); font-family:var(--font-ui); font-size:12px; margin-bottom:16px; border:1px solid var(--destructive); padding:12px;"></div>
      <div class="tier-list" id="tierList"></div>
    </div>

    <div class="tl-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Unranked Pool</div>
        <div class="pool-area" id="pool" data-tier="__pool__"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Add Item</div>
        <input type="text" id="itemInput" placeholder="Label or Item..." />
        <button class="btn-primary" onclick="addItem()">+ Add</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Structure</div>
        <button class="ui-btn" style="width:auto; margin:0;" onclick="resetToDefaultStructure()">Restore Default Tiers</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
    const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const DEFAULT_TIERS = [
      { id: 'a', label: 'A', color: '#FFD93B', text: '#2a1a00' },
      { id: 'b_a', label: 'B ~ A', color: '#C7D63F', text: '#1a2a00' },
      { id: 'asyalarp', label: 'AsyaLarp', color: '#e39ec4', text: '#3a0022' },
      { id: 'b', label: 'B', color: '#3FD67A', text: '#003020' },
      { id: 'sea', label: 'SEA', color: '#3FBDD6', text: '#002030' },
      { id: 'dweeb', label: 'Dweeb', color: '#3F7ED6', text: '#fff' },
      { id: 'e', label: 'E', color: '#7B5EA7', text: '#fff' },
      { id: 'execution', label: 'EXECUTION', color: '#8B0000', text: '#ff6b6b' }
    ];
    const DEFAULT_ACTIVE = DEFAULT_TIERS.map(t => t.id);

    let isAdmin = false;
    let allTiers = [];
    let activeTierIds = [];
    let tierItems = {};
    let poolItems = [];
    let idCounter = 0;
    let dragItem = null, dragSrc = null;

    async function initDatabase() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
            isAdmin = true;
            document.body.classList.add('is-admin');
        }

        try {
            const { data, error } = await supabaseClient.from('zato_tierlist').select('state').eq('id', 1).single();
            if (error) throw error;
            if (data && data.state && data.state.allTiers && data.state.allTiers.length) {
                applyState(data.state);
            } else {
                applyState({ allTiers: DEFAULT_TIERS, activeTierIds: DEFAULT_ACTIVE, tierItems: {}, poolItems: [], idCounter: 0 });
                showError("No saved tier list data was found in the database, showing the default structure. If items are missing, check the zato_tierlist table in Supabase directly.");
            }
        } catch (e) {
            applyState({ allTiers: DEFAULT_TIERS, activeTierIds: DEFAULT_ACTIVE, tierItems: {}, poolItems: [], idCounter: 0 });
            showError("Could not load the tier list from Supabase, showing the default structure.");
        }

        supabaseClient.channel('zato-realtime').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'zato_tierlist', filter: 'id=eq.1' }, (payload) => {
            if (payload.new && payload.new.state) {
                applyState(payload.new.state);
            }
        }).subscribe();
    }

    function showError(msg) {
        const el = document.getElementById('tl-error');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function applyState(state) {
        allTiers = state.allTiers || DEFAULT_TIERS;
        activeTierIds = state.activeTierIds && state.activeTierIds.length ? state.activeTierIds : allTiers.map(t => t.id);
        tierItems = state.tierItems || {};
        poolItems = state.poolItems || [];
        idCounter = state.idCounter || 0;
        renderAll();
    }

    async function syncToSupabase() {
        if (!isAdmin) return;
        const state = { allTiers, activeTierIds, tierItems, poolItems, idCounter };
        await supabaseClient.from('zato_tierlist').update({ state }).eq('id', 1);
    }

    window.resetToDefaultStructure = async function () {
        if (!isAdmin) return;
        const missingIds = DEFAULT_TIERS.map(t => t.id).filter(id => !allTiers.find(t => t.id === id));
        missingIds.forEach(id => {
            allTiers.push(DEFAULT_TIERS.find(t => t.id === id));
            activeTierIds.push(id);
        });
        renderAll();
        await syncToSupabase();
    };

    function renderAll() {
      renderTiers(); renderPool();
    }

    function renderTiers() {
      const list = document.getElementById('tierList'); list.innerHTML = '';
      activeTierIds.forEach(id => {
        const tier = allTiers.find(t => t.id === id);
        if (!tier) return;

        const row = document.createElement('div'); row.className = 'tier-row';
        const lbl = document.createElement('div'); lbl.className = 'tier-label'; lbl.style.background = tier.color; lbl.style.color = tier.text;
        lbl.textContent = tier.label; row.appendChild(lbl);

        const itemsDiv = document.createElement('div'); itemsDiv.className = 'tier-items'; itemsDiv.dataset.tier = tier.id;
        setupDrop(itemsDiv);
        const listItems = tierItems[tier.id] || [];
        listItems.forEach(item => itemsDiv.appendChild(makeItemWrapper(item, tier.id)));

        row.appendChild(itemsDiv); list.appendChild(row);
      });
    }

    function renderPool() {
      const pool = document.getElementById('pool'); pool.innerHTML = '';
      if (!poolItems.length) { pool.innerHTML = '<div class="pool-empty">add items below</div>'; return; }
      poolItems.forEach(item => pool.appendChild(makeItemWrapper(item, '__pool__')));
      setupDrop(pool);
    }

    function makeItemWrapper(item, tier) {
      const wrap = document.createElement('div'); wrap.className = 'tilt-wrapper';
      if (isAdmin) wrap.draggable = true;
      const card = document.createElement('div'); card.className = 'tl-item';
      card.innerHTML = `<div class="tl-item-text-block"><span class="tl-item-label" title="${item.label}">${item.label}</span></div>`;

      if (isAdmin) {
          const rem = document.createElement('button'); rem.className = 'tl-item-remove'; rem.textContent = '✕';
          rem.onclick = e => { e.stopPropagation(); removeItem(item.id, tier); }; card.appendChild(rem);
      }

      wrap.appendChild(card);
      if (isAdmin) {
          wrap.addEventListener('dragstart', () => { dragItem = item; dragSrc = tier; });
      }
      return wrap;
    }

    function setupDrop(el) {
      el.addEventListener('dragover', e => { if (isAdmin) e.preventDefault(); });
      el.addEventListener('drop', e => {
        if (!isAdmin) return;
        e.preventDefault(); if (!dragItem) return;
        const dest = el.dataset.tier;
        if (dest === dragSrc) return;
        removeFromSrc(dragItem.id, dragSrc);
        if (dest === '__pool__') poolItems.push(dragItem);
        else { if (!tierItems[dest]) tierItems[dest] = []; tierItems[dest].push(dragItem); }
        dragItem = null; dragSrc = null; renderAll(); syncToSupabase();
      });
    }

    function removeItem(id, tier) {
      if (!isAdmin) return;
      if (tier === '__pool__') poolItems = poolItems.filter(i => i.id !== id);
      else tierItems[tier] = (tierItems[tier] || []).filter(i => i.id !== id);
      renderAll(); syncToSupabase();
    }

    function removeFromSrc(id, tier) {
      if (tier === '__pool__') poolItems = poolItems.filter(i => i.id !== id);
      else tierItems[tier] = (tierItems[tier] || []).filter(i => i.id !== id);
    }

    function addItem() {
      if (!isAdmin) return;
      const input = document.getElementById('itemInput').value.trim();
      if (!input) return;
      poolItems.push({ id: 'item_' + (++idCounter), label: input });
      document.getElementById('itemInput').value = '';
      renderAll(); syncToSupabase();
    }

    document.getElementById('pool').dataset.tier = '__pool__';
    setupDrop(document.getElementById('pool'));
    document.addEventListener('DOMContentLoaded', initDatabase);
  </script>
  </body>
</html>
