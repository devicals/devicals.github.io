<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZATO Tierlist - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">Z.A.T.O Live Tier List</h1>
        <div id="zato-tier-container" style="display:flex; flex-direction:column; gap:4px;">
            Loading live tierlist...
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function initZatoPage() {
            const { data } = await supabaseClient.from('zato_tierlist').select('state').eq('id', 1).single();
            if (data && data.state) {
                renderZatoTierlist(data.state);
            }
            supabaseClient.channel('zato-live').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'zato_tierlist', filter: 'id=eq.1' }, payload => {
                if(payload.new && payload.new.state) renderZatoTierlist(payload.new.state);
            }).subscribe();
        }

        function renderZatoTierlist(state) {
            const container = document.getElementById('zato-tier-container');
            const tiers = state.allTiers || [];
            const tierItems = state.tierItems || {};

            container.innerHTML = tiers.map(t => {
                const items = tierItems[t.id] || [];
                return `
                    <div style="display:flex; border:1px solid var(--border); min-height:50px;">
                        <div style="width:70px; background:${t.color}; color:${t.text}; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px;">${t.label}</div>
                        <div style="flex:1; background:var(--bg-hover); padding:6px; display:flex; flex-wrap:wrap; gap:6px;">
                            ${items.map(item => `
                                <div style="background:var(--bg-main); border:1px solid var(--border); padding:6px 10px; font-size:12px;">${item.label}</div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', initZatoPage);
    </script>
</body>
</html>
