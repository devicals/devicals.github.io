<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery Board - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .gallery-card {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px !important;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .gallery-card img {
            width: 100%;
            border-radius: 6px !important;
            object-fit: contain;
        }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1 style="margin:0;">Public Gallery Board</h1>
            <button class="ui-btn" style="width:auto; margin:0;" onclick="toggleUploadBox()">+ Add Art / Image</button>
        </div>

        <div id="gallery-upload-box" style="display:none; background:var(--bg-hover); border:1px solid var(--border); padding:20px; border-radius:8px !important; margin-bottom:24px;">
            <div style="display:flex; gap:12px; margin-bottom:12px;">
                <input type="text" id="gal-name" class="ui-input" placeholder="Your Name" style="margin:0;">
                <input type="text" id="gal-title" class="ui-input" placeholder="Artwork Title" style="margin:0;">
            </div>
            
            <label style="font-size:11px; color:var(--fg-muted);">Upload Image File</label>
            <input type="file" id="gal-file" class="ui-input" accept="image/*" style="margin-bottom:12px;">
            
            <div style="font-size:11px; color:var(--fg-muted); text-align:center; margin-bottom:12px;">- OR -</div>
            
            <input type="text" id="gal-url" class="ui-input" placeholder="Image URL (Or click Draw below)" style="margin-bottom:12px;">
            
            <div style="display:flex; gap:12px;">
                <button class="ui-btn" style="flex:1; margin:0;" onclick="toggleCanvas()">Toggle Draw Canvas</button>
                <button class="ui-btn" style="flex:1; margin:0; border-color:var(--accent); color:var(--accent);" onclick="postGallery()">Post to Gallery</button>
            </div>

            <div id="canvas-container" style="display:none; margin-top:16px;">
                <div style="display:flex; gap:10px; margin-bottom:8px; align-items:center;">
                    <input type="color" id="brush-color" value="#ffffff" style="background:var(--bg-sidebar); border:1px solid var(--border); height:24px;">
                    <input type="range" id="brush-size" min="1" max="20" value="3">
                    <button class="ui-btn" style="width:auto; margin:0;" onclick="clearCanvas()">Clear Canvas</button>
                </div>
                <canvas id="gal-canvas" style="background:var(--bg-main); border:1px solid var(--border); border-radius:4px !important; width:100%; height:300px; cursor:crosshair;"></canvas>
            </div>
        </div>

        <div id="gallery-container" class="masonry-grid">
            Loading public gallery...
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let galleryItems = [];
        const canvas = document.getElementById('gal-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let canvasActive = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width - 2;
            canvas.height = 300;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            clearCanvas();
        }

        function clearCanvas() {
            ctx.fillStyle = '#1c1b18';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        canvas.addEventListener('mousedown', e => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = document.getElementById('brush-color').value;
            ctx.lineWidth = document.getElementById('brush-size').value;
            ctx.stroke();
        });
        window.addEventListener('mouseup', () => isDrawing = false);

        function toggleUploadBox() {
            const box = document.getElementById('gallery-upload-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function toggleCanvas() {
            const container = document.getElementById('canvas-container');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                canvasActive = true;
                setTimeout(resizeCanvas, 50);
            } else {
                container.style.display = 'none';
                canvasActive = false;
            }
        }

        async function initGallery() {
            const { data } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: false });
            if (data) {
                galleryItems = data.filter(i => i.drawing || (i.message && i.message.startsWith('http')) || (i.message && i.message.startsWith('data:')));
                renderGallery();
            }

            supabaseClient.channel('gallery-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, async () => {
                const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: false });
                if (updated) {
                    galleryItems = updated.filter(i => i.drawing || (i.message && i.message.startsWith('http')) || (i.message && i.message.startsWith('data:')));
                    renderGallery();
                }
            }).subscribe();
        }

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = galleryItems.map(item => `
                <div class="gallery-card">
                    <img src="${item.drawing || (item.message.startsWith('http') || item.message.startsWith('data:') ? item.message : '')}" alt="Artwork" loading="lazy">
                    <div style="font-weight:bold; color:var(--accent); font-size:14px; margin-top:8px;">${item.message && !item.message.startsWith('http') && !item.message.startsWith('data:') ? item.message : 'Untitled'}</div>
                    <div style="font-size:11px; color:var(--fg-muted);">By ${item.name || 'Anonymous'}</div>
                </div>
            `).join('');
        }

        window.postGallery = async () => {
            const name = document.getElementById('gal-name').value.trim() || 'Anonymous';
            const title = document.getElementById('gal-title').value.trim() || 'Untitled';
            const url = document.getElementById('gal-url').value.trim();
            const fileInput = document.getElementById('gal-file');
            
            let drawingData = null;

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    drawingData = e.target.result;
                    await supabaseClient.from('guestbook').insert({ name, message: title, drawing: drawingData });
                    finishPost();
                };
                reader.readAsDataURL(fileInput.files[0]);
                return;
            } else if (canvasActive) {
                drawingData = canvas.toDataURL('image/png');
            } else if (url) {
                drawingData = url;
            } else {
                window.parent.guiAlert("Please provide an image file, URL, or draw something.");
                return;
            }

            await supabaseClient.from('guestbook').insert({ name, message: title, drawing: drawingData });
            finishPost();
        };

        function finishPost() {
            document.getElementById('gal-title').value = '';
            document.getElementById('gal-url').value = '';
            document.getElementById('gal-file').value = '';
            clearCanvas();
            toggleUploadBox();
            window.parent.guiAlert("Posted to gallery successfully!", "Success");
        }

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
