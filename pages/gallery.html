<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>public art gallery</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .gallery-list { display: flex; flex-direction: column; gap: 40px; }
        .gallery-item { display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; border-bottom: 1px dashed var(--border); position: relative; }
        .gallery-item:last-child { border-bottom: none; }
        .gallery-item img { width: 100%; max-width: 600px; object-fit: contain; border: 1px solid var(--border); }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1 style="margin:0;">public art gallery</h1>
            <button class="ui-btn" style="width:auto; margin:0;" onclick="toggleUploadBox()">+ add art / image</button>
        </div>

        <div id="gallery-upload-box" style="display:none; border:1px solid var(--border); padding:20px; margin-bottom:40px;">
            <div style="display:flex; gap:12px; margin-bottom:12px;">
                <input type="text" id="gal-name" class="ui-input" readonly placeholder="Your Name" style="margin:0;">
                <input type="text" id="gal-title" class="ui-input" placeholder="Artwork Title" style="margin:0;">
            </div>

            <label style="font-size:11px; color:var(--fg-muted);">upload image</label>
            <input type="file" id="gal-file" class="ui-input" accept="image/*" style="margin-bottom:12px;">

            <div style="font-size:11px; color:var(--fg-muted); text-align:center; margin-bottom:12px;">- or -</div>

            <input type="text" id="gal-url" class="ui-input" placeholder="Image URL (Or click Draw below)" style="margin-bottom:12px;">

            <div style="display:flex; gap:12px;">
                <button class="ui-btn" style="flex:1; margin:0;" onclick="toggleCanvas()">toggle canvas</button>
                <button class="ui-btn" style="flex:1; margin:0; border-color:var(--accent); color:var(--accent);" onclick="postGallery()">post to gallery</button>
            </div>

            <div id="canvas-container" style="display:none; margin-top:16px;">
                <div style="display:flex; gap:10px; margin-bottom:8px; align-items:center;">
                    <input type="color" id="brush-color" value="#ffffff" style="background:var(--bg-sidebar); border:1px solid var(--border); height:24px;">
                    <input type="range" id="brush-size" min="1" max="20" value="3">
                    <button class="ui-btn" style="width:auto; margin:0;" onclick="clearCanvas()">clear canvas</button>
                </div>
                <canvas id="gal-canvas" style="background:var(--bg-main); border:1px solid var(--border); width:100%; height:300px; cursor:crosshair;"></canvas>
            </div>
        </div>

        <div id="gallery-container" class="gallery-list">
            <span style="color:var(--fg-muted);">loading public gallery...</span>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let galleryItems = [];
        let isAdminLocal = false;
        let currentUser = null;
        let currentProfile = null;

        const canvas = document.getElementById('gal-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let canvasActive = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width - 2;
            canvas.height = 300;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            clearCanvas();
        }

        function clearCanvas() {
            ctx.fillStyle = '#1c1b18';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        canvas.addEventListener('mousedown', e => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
        canvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.strokeStyle = document.getElementById('brush-color').value;
            ctx.lineWidth = document.getElementById('brush-size').value;
            ctx.stroke();
        });
        window.addEventListener('mouseup', () => isDrawing = false);

        function toggleUploadBox() {
            const box = document.getElementById('gallery-upload-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function toggleCanvas() {
            const container = document.getElementById('canvas-container');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                canvasActive = true;
                setTimeout(resizeCanvas, 50);
            } else {
                container.style.display = 'none';
                canvasActive = false;
            }
        }

        async function initGallery() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUser = session?.user || null;

            if (currentUser) {
                const { data: prof } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
                currentProfile = prof;
                if (prof?.is_admin || currentUser.email?.toLowerCase() === '3rr0r.d3v@gmail.com') {
                    isAdminLocal = true;
                }
            }

            setupNameField();

            const { data } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: false });
            if (data) {
                galleryItems = data.filter(i => i.drawing || (i.message && i.message.startsWith('http')) || (i.message && i.message.startsWith('data:')));
                renderGallery();
            }

            supabaseClient.channel('gallery-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, async () => {
                const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: false });
                if (updated) {
                    galleryItems = updated.filter(i => i.drawing || (i.message && i.message.startsWith('http')) || (i.message && i.message.startsWith('data:')));
                    renderGallery();
                }
            }).subscribe();
        }

        async function setupNameField() {
            const nameInput = document.getElementById('gal-name');
            if (isAdminLocal) {
                nameInput.removeAttribute('readonly');
                nameInput.value = currentProfile?.username || 'Error Dev';
            } else if (currentProfile?.username) {
                nameInput.setAttribute('readonly', 'readonly');
                nameInput.value = currentProfile.username;
            } else {
                nameInput.setAttribute('readonly', 'readonly');
                nameInput.value = await getAnonName();
            }
        }

        async function getAnonName() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                let hash = 0;
                for (let i = 0; i < data.ip.length; i++) hash = ((hash << 5) - hash) + data.ip.charCodeAt(i);
                return "Anonymous #" + Math.abs(hash).toString().substring(0, 4);
            } catch (e) {
                return "Anonymous #" + Math.floor(Math.random() * 9000 + 1000);
            }
        }

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = galleryItems.map(item => `
                <div class="gallery-item">
                    ${isAdminLocal ? `<button class="ui-btn" style="position:absolute; top:0; right:0; width:auto; color:var(--destructive);" onclick="deleteGalleryItem(${item.id})">Delete</button>` : ''}
                    <img src="${item.drawing || (item.message.startsWith('http') || item.message.startsWith('data:') ? item.message : '')}" alt="Artwork" loading="lazy">
                    <div style="font-weight:bold; color:var(--accent); font-size:18px;">${item.message && !item.message.startsWith('http') && !item.message.startsWith('data:') ? item.message : 'Untitled'}</div>
                    <div style="font-size:12px; color:var(--fg-muted);">By ${item.name || 'Anonymous'} | ${new Date(item.created_at).toLocaleString()}</div>
                </div>
            `).join('');
        }

        window.deleteGalleryItem = async (id) => {
            if (!isAdminLocal) return;
            const ok = window.parent && window.parent.guiConfirm ? await window.parent.guiConfirm("Delete this gallery item?") : confirm("Delete this gallery item?");
            if (ok) {
                await supabaseClient.from('guestbook').delete().eq('id', id);
            }
        };

        window.postGallery = async () => {
            const name = document.getElementById('gal-name').value.trim() || 'Anonymous';
            const title = document.getElementById('gal-title').value.trim() || 'Untitled';
            const url = document.getElementById('gal-url').value.trim();
            const fileInput = document.getElementById('gal-file');

            let drawingData = null;

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    drawingData = e.target.result;
                    await supabaseClient.from('guestbook').insert({ name, message: title, drawing: drawingData });
                    finishPost();
                };
                reader.readAsDataURL(fileInput.files[0]);
                return;
            } else if (canvasActive) {
                drawingData = canvas.toDataURL('image/png');
            } else if (url) {
                drawingData = url;
            } else {
                alert("Please provide an image file, URL, or draw something.");
                return;
            }

            await supabaseClient.from('guestbook').insert({ name, message: title, drawing: drawingData });
            finishPost();
        };

        function finishPost() {
            document.getElementById('gal-title').value = '';
            document.getElementById('gal-url').value = '';
            document.getElementById('gal-file').value = '';
            clearCanvas();
            toggleUploadBox();
        }

        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
