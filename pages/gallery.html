<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 850px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">Gallery</h1>
        <div id="gallery-container" style="display:flex; flex-direction:column; gap:20px;">
            Loading gallery items...
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script>
        async function loadGalleryPage() {
            const params = new URLSearchParams(window.location.search);
            const galleryType = params.get('type');
            
            let fileToFetch = '/storage/data/oricade.yaml';
            if (galleryType === 'audio') fileToFetch = '/storage/internal/pages/custom/oricade.yaml';

            try {
                const res = await fetch(fileToFetch);
                if (!res.ok) throw new Error('File not found');
                const yamlText = await res.text();
                const parsed = jsyaml.load(yamlText);
                const items = parsed.items || [];

                document.getElementById('gallery-container').innerHTML = items.map(item => `
                    <div style="background:var(--bg-hover); border:1px solid var(--border); padding:16px;">
                        <div style="color:var(--accent); font-weight:bold; font-size:14px; margin-bottom:8px;">${item.title || 'Untitled Item'}</div>
                        ${item.description ? `<div style="font-size:12px; color:var(--fg-muted); margin-bottom:8px;">${item.description}</div>` : ''}
                        ${item.path ? `<audio controls src="${item.path}" style="width:100%; margin-top:8px;"></audio>` : ''}
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('gallery-container').innerHTML = '<p style="color:var(--fg-muted)">Gallery empty or unavailable.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadGalleryPage);
    </script>
</body>
</html>
