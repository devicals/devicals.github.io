<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tier list maker</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
      .tl-layout { display: flex; height: 100vh; background: var(--bg-workspace); }
      .tl-main { flex: 1; padding: 22px 18px 60px 18px; min-width: 0; overflow-y: auto; }

      .tl-sidebar { width: 320px; min-width: 320px; height: 100vh; overflow-y: auto; border-left: 1px solid var(--border); background: var(--bg-sidebar); padding: 20px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }

      .tl-header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
      .tl-title { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }

      .top-bar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
      .top-bar label { font-size: 10px; color: var(--fg-muted); text-transform: lowercase; letter-spacing: 1px; }

      select, input[type=text], button {
        font-family: var(--font-ui); font-size: 12px; padding: 5px 9px;
        background: var(--bg-main); border: 1px solid var(--border);
        color: var(--fg-main); cursor: pointer; outline: none; transition: border-color 0.2s, color 0.2s;
      }
      select:hover, input[type=text]:hover, button:hover { border-color: var(--accent); }
      select:focus, input[type=text]:focus { border-color: var(--accent); }
      button:hover { color: var(--accent); }

      .btn-primary { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); font-weight: 700; }
      .btn-primary:hover { background: var(--accent); color: var(--bg-main); }

      .tier-list { display: flex; flex-direction: column; gap: 3px; }

      .tier-row { display: flex; align-items: stretch; border: 1px solid var(--border); transition: border-color 0.2s; position: relative; }
      .tier-row.is-exec-row .tier-items { background: rgba(204, 85, 85, 0.15); }

      .tier-label {
        width: 64px; min-width: 64px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        font-size: 18px; font-weight: 700; letter-spacing: 1px;
        cursor: pointer; user-select: none; flex-shrink: 0; position: relative; min-height: 56px;
      }

      .tier-items {
        flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; padding: 6px;
        background: var(--bg-hover); border-left: 1px solid var(--border);
        transition: background 0.15s; min-height: 56px;
      }

      .tilt-wrapper { flex: 0 0 auto; min-width: 90px; max-width: 200px; user-select: none; cursor: grab; }

      .tl-item {
        width: 100%; height: 100%; min-height: 44px; display: flex; align-items: center; gap: 7px;
        padding: 8px 12px; background: var(--bg-main); color: var(--fg-main);
        text-align: left; position: relative; box-sizing: border-box; border: 1px solid var(--border);
      }
      .tl-item-label { font-size: clamp(10px, 1.05vw, 13px); line-height: 1.25; overflow-wrap: anywhere; }
      .tl-item.revived { background: rgba(230,180,80,0.15); border: 1px solid var(--accent); }

      .pool-area { min-height: 60px; display: flex; flex-wrap: wrap; gap: 4px; padding: 7px; background: var(--bg-hover); border: 1px solid var(--border); }
      .pool-area .tilt-wrapper { min-width: 70px; max-width: 130px; border: 1px solid var(--border); }

      .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
      .sidebar-label { font-size: 12px; color: var(--accent); font-weight: bold; text-transform: lowercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
      .tl-hint { font-size: 10px; color: var(--fg-muted); }
    </style>
  </head>

  <body>
  <div class="tl-layout">
    <div class="tl-main">
      <div class="tl-header">
        <div class="tl-title" id="active-list-title">tier list maker (untitled)</div>
      </div>
      <div class="top-bar">
        <label>preset</label>
        <select id="presetSel" onchange="changePreset(this.value)">
          <option value="full">full</option>
          <option value="standard">standard</option>
          <option value="simple">simple</option>
          <option value="simple2">simple 2</option>
          <option value="extended">extended</option>
          <option value="complete">complete</option>
        </select>
      </div>
      <div class="tier-list" id="tierList"></div>
    </div>

    <div class="tl-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">unranked pool</div>
        <div class="pool-area" id="pool" data-tier="__pool__"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">add item</div>
        <input type="text" id="itemInput" placeholder="label or item..." />
        <button class="btn-primary" onclick="addItem()">+ add</button>
      </div>

      <div class="sidebar-section tl-sidebar-block">
        <div class="tl-sidebar-block-title">my saved tier lists</div>
        <div id="saved-lists-container" style="margin-bottom:12px;">
          <span class="tl-hint">no saved lists yet.</span>
        </div>
        <input type="text" id="save-name-input" class="ui-input" placeholder="tier list name..." style="margin-bottom:8px;">
        <button class="ui-btn" onclick="saveCurrentList()">save current as new</button>
      </div>

      <div class="sidebar-section tl-sidebar-block">
        <div class="tl-sidebar-block-title">import / export</div>
        <button class="ui-btn" onclick="exportCurrentList()">export as JSON</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;" onchange="importFromFile(event)">
        <button class="ui-btn" onclick="document.getElementById('import-file-input').click()">import from JSON</button>
      </div>

      <div class="sidebar-section tl-sidebar-block">
        <div class="tl-sidebar-block-title">my share codes</div>
        <div id="my-share-codes-container" style="margin-bottom:12px;">
          <span class="tl-hint">loading share codes...</span>
        </div>
        <button class="ui-btn" onclick="generateShareCode()">generate new share code</button>
        <div id="share-code-display" style="display:none; font-family:var(--font-ui); font-size:16px; color:var(--accent); text-align:center; padding:10px; border:1px solid var(--accent); margin-top:8px;"></div>
        <input type="text" id="share-code-input" class="ui-input" placeholder="enter a share code..." style="margin-top:14px;">
        <button class="ui-btn" onclick="loadFromShareCode()">load share code</button>
      </div>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
    const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    const TIERS_BASE = [
      { id:'SSS',  label:'SSS', color:'#FF3B3B', text:'#fff',    isExec:false },
      { id:'SS',   label:'SS',  color:'#FF6B3B', text:'#fff',    isExec:false },
      { id:'S',    label:'S',   color:'#FF9A3B', text:'#fff',    isExec:false },
      { id:'A',    label:'A',   color:'#FFD93B', text:'#2a1a00', isExec:false },
      { id:'B',    label:'B',   color:'#A8D63F', text:'#1a2a00', isExec:false },
      { id:'C',    label:'C',   color:'#3FD67A', text:'#003020', isExec:false },
      { id:'D',    label:'D',   color:'#3FBDD6', text:'#002030', isExec:false },
      { id:'E',    label:'E',   color:'#3F7ED6', text:'#fff',    isExec:false },
      { id:'F',    label:'F',   color:'#7B5EA7', text:'#fff',    isExec:false },
      { id:'FF',   label:'FF',  color:'#5A4080', text:'#fff',    isExec:false },
      { id:'FFF',  label:'FFF', color:'#3D2B60', text:'#ccc',    isExec:false },
      { id:'Z',    label:'Z',   color:'#4A4A4A', text:'#fff',    isExec:false },
      { id:'EXEC', label:'X',   color:'#8B0000', text:'#ff6b6b', isExec:true }
    ];

    const PRESETS = {
      full: TIERS_BASE.map(t => t.id),
      standard: ['S','A','B','C','D','F'],
      simple: ['A','B','C','D','E','F'],
      simple2: ['S','A','B','C','D','F','EXEC'],
      extended: ['SSS','SS','S','A','B','C','D','E','F','Z','EXEC'],
      complete: TIERS_BASE.map(t => t.id)
    };

    let activeTierIds = PRESETS.full;
    let tierItems = {};
    let poolItems = [];
    let dragItem = null, dragSrc = null;
    let currentListId = null;
    let currentListName = "Untitled";
    let userId = null;

    function getDeviceId() {
      if (window.parent && window.parent.getDeviceId) return window.parent.getDeviceId();
      let devId = localStorage.getItem('device_id');
      if (!devId) {
        devId = 'dev_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
        localStorage.setItem('device_id', devId);
      }
      return devId;
    }

    async function getAnonName() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        let hash = 0;
        for (let i = 0; i < data.ip.length; i++) hash = ((hash << 5) - hash) + data.ip.charCodeAt(i);
        return "Anon #" + Math.abs(hash).toString().substring(0, 4);
      } catch (e) {
        return "Anon #" + Math.floor(Math.random() * 9000 + 1000);
      }
    }

    function currentState() {
      return { preset: document.getElementById('presetSel').value, activeTierIds, tierItems, poolItems };
    }

    function loadState(state) {
      if (!state) return;
      activeTierIds = state.activeTierIds || PRESETS.full;
      tierItems = state.tierItems || {};
      poolItems = state.poolItems || [];
      if (state.preset) document.getElementById('presetSel').value = state.preset;
      renderAll();
    }

    function renderAll() {
      renderTiers(); renderPool();
      document.getElementById('active-list-title').textContent = `Tier List Maker (${currentListName})`;
    }

    function renderTiers() {
      const list = document.getElementById('tierList'); list.innerHTML = '';
      activeTierIds.forEach(id => {
        const tier = TIERS_BASE.find(t => t.id === id); if (!tier) return;
        const row = document.createElement('div');
        row.className = 'tier-row' + (tier.isExec ? ' is-exec-row' : '');
        row.dataset.tierId = tier.id;

        const lbl = document.createElement('div');
        lbl.className = 'tier-label';
        lbl.style.background = tier.color; lbl.style.color = tier.text;
        lbl.textContent = tier.label;
        row.appendChild(lbl);

        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'tier-items';
        itemsDiv.dataset.tier = tier.id;
        setupDrop(itemsDiv);

        const listArr = tierItems[tier.id] || [];
        listArr.forEach(item => itemsDiv.appendChild(makeCard(item, tier.id)));
        row.appendChild(itemsDiv);
        list.appendChild(row);
      });
    }

    function renderPool() {
      const pool = document.getElementById('pool'); pool.innerHTML = '';
      if (!poolItems.length) {
        pool.innerHTML = '<div class="tl-hint">add items below</div>'; return;
      }
      poolItems.forEach(item => pool.appendChild(makeCard(item, '__pool__')));
      setupDrop(pool);
    }

    function makeCard(item, tier) {
      const wrap = document.createElement('div'); wrap.className = 'tilt-wrapper';
      wrap.draggable = true;
      const card = document.createElement('div');
      card.className = 'tl-item' + (tier === 'EXEC' ? ' revived' : '');
      card.innerHTML = `<span class="tl-item-label" title="${item.label}">${item.label}</span>`;
      wrap.appendChild(card);

      wrap.addEventListener('dragstart', () => { dragItem = item; dragSrc = tier; });
      return wrap;
    }

    function setupDrop(el) {
      el.addEventListener('dragover', e => e.preventDefault());
      el.addEventListener('drop', e => {
        e.preventDefault(); if (!dragItem) return;
        const dest = el.dataset.tier;
        if (dest === dragSrc) return;

        if (dragSrc === '__pool__') poolItems = poolItems.filter(i => i.id !== dragItem.id);
        else tierItems[dragSrc] = (tierItems[dragSrc] || []).filter(i => i.id !== dragItem.id);

        if (dest === '__pool__') poolItems.push(dragItem);
        else { if (!tierItems[dest]) tierItems[dest] = []; tierItems[dest].push(dragItem); }

        dragItem = null; dragSrc = null; renderAll();
      });
    }

    function addItem() {
      const input = document.getElementById('itemInput');
      const val = input.value.trim(); if (!val) return;
      poolItems.push({ id: 'item_' + Date.now(), label: val });
      input.value = ''; renderAll();
    }

    function changePreset(val) {
      if (PRESETS[val]) activeTierIds = PRESETS[val];
      renderAll();
    }

    async function getSavedLists() {
      if (userId) {
        const { data } = await supabaseClient.from('profiles').select('settings').eq('id', userId).single();
        return data?.settings?.tierlists || [];
      }
      return JSON.parse(localStorage.getItem('local_tierlists') || '[]');
    }

    async function setSavedLists(lists) {
      if (userId) {
        const { data } = await supabaseClient.from('profiles').select('settings').eq('id', userId).single();
        const settings = data?.settings || {};
        settings.tierlists = lists;
        await supabaseClient.from('profiles').update({ settings }).eq('id', userId);
      }
      localStorage.setItem('local_tierlists', JSON.stringify(lists));
    }

    async function refreshSavedListsUI() {
      const lists = await getSavedLists();
      const container = document.getElementById('saved-lists-container');
      if (!lists.length) {
        container.innerHTML = '<span class="tl-hint">no saved lists yet.</span>';
        return;
      }
      container.innerHTML = lists.map(l => `
        <div class="tl-saved-item">
          <span class="tl-saved-item-name">${l.name}</span>
          <button class="ui-btn tl-mini-btn" onclick="loadSavedList('${l.id}')">load</button>
          <button class="ui-btn tl-mini-btn" style="color:var(--destructive);" onclick="deleteSavedList('${l.id}')">del</button>
        </div>
      `).join('');
    }

    window.saveCurrentList = async function () {
      const nameInput = document.getElementById('save-name-input');
      const name = nameInput.value.trim() || 'untitled tier list';
      const lists = await getSavedLists();
      const entry = { id: 'tl_' + Date.now(), name, state: currentState() };
      lists.unshift(entry);
      await setSavedLists(lists);
      currentListId = entry.id;
      currentListName = name;
      nameInput.value = '';
      renderAll();
      refreshSavedListsUI();
    };

    window.loadSavedList = async function (id) {
      const lists = await getSavedLists();
      const entry = lists.find(l => l.id === id);
      if (!entry) return;
      currentListId = entry.id;
      currentListName = entry.name;
      loadState(entry.state);
    };

    window.deleteSavedList = async function (id) {
      let lists = await getSavedLists();
      lists = lists.filter(l => l.id !== id);
      await setSavedLists(lists);
      if (currentListId === id) { currentListId = null; currentListName = 'untitled'; renderAll(); }
      refreshSavedListsUI();
    };

    window.exportCurrentList = function () {
      const payload = { name: currentListName, state: currentState() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentListName.replace(/[^a-z0-9]/gi, '_')}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.importFromFile = function (event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const payload = JSON.parse(e.target.result);
          if (payload.state) {
            currentListId = null;
            currentListName = payload.name || 'imported tier list';
            loadState(payload.state);
          }
        } catch (err) {
          alert('Invalid tier list file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    };

    function genCode(len) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    async function refreshMyShareCodesUI() {
      const container = document.getElementById('my-share-codes-container');
      if (!container) return;
      
      const myLocalCodes = JSON.parse(localStorage.getItem('my_share_codes') || '[]');
      const devId = getDeviceId();

      try {
          const { data } = await supabaseClient.from('site_content').select('*').like('key', 'tierlist_share_%');
          const myCodesList = (data || []).filter(item => {
              const code = item.key.replace('tierlist_share_', '');
              const info = item.data || {};
              const isMyId = userId && info.creator_id === userId;
              const isMyDevice = info.creator_device_id === devId;
              const isMyLocal = myLocalCodes.includes(code);
              return isMyId || isMyDevice || isMyLocal;
          });

          if (!myCodesList.length) {
              container.innerHTML = '<span class="tl-hint">no generated codes yet.</span>';
              return;
          }

          container.innerHTML = myCodesList.map(item => {
              const code = item.key.replace('tierlist_share_', '');
              const info = item.data || {};
              return `
                  <div class="tl-saved-item">
                      <span class="tl-saved-item-name" style="color:var(--accent); font-weight:bold;">${code} (${info.name || 'untitled'})</span>
                      <button class="ui-btn tl-mini-btn" onclick="copyCodeStr('${code}')">copy</button>
                      <button class="ui-btn tl-mini-btn" style="color:var(--destructive);" onclick="deleteMyShareCode('${item.key}', '${code}')">del</button>
                  </div>
              `;
          }).join('');
      } catch (e) {
          container.innerHTML = '<span class="tl-hint">could not load codes.</span>';
      }
    }

    window.copyCodeStr = function(code) {
        navigator.clipboard.writeText(code);
        alert("Share code copied: " + code);
    };

    window.deleteMyShareCode = async function(key, code) {
        if (!confirm("Delete this share code?")) return;
        await supabaseClient.from('site_content').delete().eq('key', key);
        
        let myCodes = JSON.parse(localStorage.getItem('my_share_codes') || '[]');
        myCodes = myCodes.filter(c => c !== code);
        localStorage.setItem('my_share_codes', JSON.stringify(myCodes));

        refreshMyShareCodesUI();
    };

    window.generateShareCode = async function () {
      const code = genCode(6);
      const payload = { 
        name: currentListName, 
        state: currentState(),
        creator_id: userId,
        creator_name: window.parent?.currentUser?.username || await getAnonName(),
        creator_device_id: getDeviceId(),
        created_at: new Date().toISOString()
      };
      
      const { error } = await supabaseClient.from('site_content').insert({ key: 'tierlist_share_' + code, data: payload });
      
      if (error) {
          alert("Failed to create share code! " + error.message);
          return;
      }
      
      let myCodes = JSON.parse(localStorage.getItem('my_share_codes') || '[]');
      if (!myCodes.includes(code)) myCodes.push(code);
      localStorage.setItem('my_share_codes', JSON.stringify(myCodes));

      const display = document.getElementById('share-code-display');
      display.style.display = 'block';
      display.textContent = code;

      refreshMyShareCodesUI();
    };

    window.loadFromShareCode = async function () {
      const code = document.getElementById('share-code-input').value.trim().toUpperCase();
      if (!code) return;
      const { data, error } = await supabaseClient.from('site_content').select('data').eq('key', 'tierlist_share_' + code).single();
      if (error || !data) { alert('Share code not found.'); return; }
      currentListId = null;
      currentListName = data.data.name || 'Shared Tier List';
      loadState(data.data.state);
    };

    async function init() {
      userId = window.parent?.currentUser?.id || null;
      renderAll();
      refreshSavedListsUI();
      refreshMyShareCodesUI();
    }

    init();
  </script>
  <script src="../js/bg-canvas.js"></script>
  </body>
</html>
