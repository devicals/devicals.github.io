<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier List Maker</title>
  <link rel="stylesheet" href="../css/style.css">
    <style>
      .tl-layout { display: flex; height: 100vh; background: var(--bg-workspace); }
      .tl-main { flex: 1; padding: 22px 18px 60px 18px; min-width: 0; overflow-y: auto; }
      
      .tl-sidebar { width: 300px; min-width: 300px; height: 100vh; overflow-y: auto; border-left: 1px solid var(--border); background: var(--bg-sidebar); padding: 20px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }

      .tl-header { margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
      .tl-title { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
      
      .top-bar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
      .top-bar label { font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 1px; }

      select, input[type=text], button {
        font-family: var(--font-ui); font-size: 12px; padding: 5px 9px;
        background: var(--bg-main); border: 1px solid var(--border);
        color: var(--fg-main); cursor: pointer; outline: none; transition: border-color 0.2s, color 0.2s;
      }
      select:hover, input[type=text]:hover, button:hover { border-color: var(--accent); }
      select:focus, input[type=text]:focus { border-color: var(--accent); }
      button:hover { color: var(--accent); }

      .btn-primary { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); font-weight: 700; }
      .btn-primary:hover { background: var(--accent); color: var(--bg-main); }

      .tier-list {
        display: grid;
        grid-template-columns: repeat(var(--tier-cols, 1), 1fr);
        grid-auto-flow: column;
        grid-template-rows: repeat(var(--tier-rows, 15), auto);
        gap: 3px;
      }

      .tier-row { display: flex; align-items: stretch; border: 1px solid var(--border); transition: border-color 0.2s; position: relative; }
      .tier-row:hover { border-color: var(--accent); }

      .tier-label {
        width: 64px; min-width: 64px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 18px; font-weight: 700; letter-spacing: 1px;
        cursor: pointer; user-select: none; flex-shrink: 0; position: relative; min-height: 56px;
      }

      .tier-items {
        flex: 1; display: flex; flex-direction: column; gap: 0; padding: 0;
        background: var(--bg-hover); border-left: 1px solid var(--border);
        transition: background 0.15s; min-height: 56px;
      }
      .tier-items.drag-over { border-left-color: var(--accent); opacity: 0.8; }
      .tier-item-row { display: flex; flex: 1; min-height: 56px; }
      
      .tilt-wrapper { flex: 1; display: flex; flex-direction: column; user-select: none; border-right: 1px dashed var(--border); min-width: 0; cursor: grab; }
      .tier-item-row .tilt-wrapper:last-child { border-right: none; }

      .tl-item {
        width: 100%; flex: 1; min-height: 48px; display: flex; align-items: center; gap: 7px;
        padding: 5px 28px 5px 7px; background: transparent; color: var(--fg-main);
        text-align: left; word-break: break-word; height: 100%; position: relative; overflow: hidden;
      }

      .tl-item-text-block { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .tl-item-label { font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

      .pool-area { min-height: 60px; display: flex; flex-wrap: wrap; gap: 4px; padding: 7px; background: var(--bg-hover); border: 1px solid var(--border); }
      .pool-empty { font-size: 11px; color: var(--fg-muted); font-style: italic; width: 100%; text-align: center; padding: 12px 0; }
      .pool-area .tilt-wrapper { flex: 0 0 auto; min-width: 70px; max-width: 130px; border: 1px solid var(--border); }
      .pool-area .tl-item { height: 56px; }

      .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
      .sidebar-label { font-size: 12px; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    </style>
  </head>

  <body>
  <div class="tl-layout">
    <div class="tl-main">
      <div class="tl-header">
        <div class="tl-title">Tier List Maker (Local)</div>
      </div>
      <div class="top-bar">
        <label>Preset</label>
        <select id="presetSel">
          <option value="full">Full</option>
          <option value="standard">Standard</option>
          <option value="simple">Simple</option>
          <option value="simple2">Simple 2</option>
          <option value="extended">Extended</option>
          <option value="complete">Complete</option>
        </select>
        <label style="margin-left:6px">Tier Cols</label>
        <select id="colSel">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="tier-list" id="tierList"></div>
    </div>

    <div class="tl-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Unranked Pool</div>
        <div class="pool-area" id="pool" data-tier="__pool__"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Add Item</div>
        <input type="text" id="itemInput" placeholder="Label or Item..." />
        <button class="btn-primary" onclick="addItem()">+ Add</button>
      </div>
    </div>
  </div>

  <script>
    const TIERS_BASE = [
      { id:'SSS', label:'SSS', color:'#FF3B3B', text:'#fff' },
      { id:'SS',  label:'SS',  color:'#FF6B3B', text:'#fff' },
      { id:'S',   label:'S',   color:'#FF9A3B', text:'#fff' },
      { id:'A',   label:'A',   color:'#FFD93B', text:'#2a1a00' },
      { id:'B',   label:'B',   color:'#A8D63F', text:'#1a2a00' },
      { id:'C',   label:'C',   color:'#3FD67A', text:'#003020' },
      { id:'D',   label:'D',   color:'#3FBDD6', text:'#002030' },
      { id:'E',   label:'E',   color:'#3F7ED6', text:'#fff' },
      { id:'F',   label:'F',   color:'#7B5EA7', text:'#fff' },
      { id:'FF',  label:'FF',  color:'#5A4080', text:'#fff' },
      { id:'FFF', label:'FFF', color:'#3D2B60', text:'#ccc' },
      { id:'Z',   label:'Z',   color:'#4A4A4A', text:'#fff' }
    ];

    let PRESETS = {
      full: TIERS_BASE.map(t => t.id),
      standard: ['S','A','B','C','D','F'],
      simple: ['A','B','C','D','E','F'],
      simple2: ['S','A','B','C','D'],
      extended: ['SSS','SS','S','A','B','C','D','E','F','Z'],
      complete: TIERS_BASE.map(t => t.id)
    };

    let allTiers = JSON.parse(JSON.stringify(TIERS_BASE));
    let activeTierIds = PRESETS.full;
    let columns = 1;
    let tierItems = {};
    let poolItems = [];
    let idCounter = 0;
    let dragItem = null, dragSrc = null;

    function getActiveTiers() { return activeTierIds.map(id => allTiers.find(t => t.id === id)).filter(Boolean); }

    function renderAll() {
      document.documentElement.style.setProperty('--tier-cols', columns);
      document.documentElement.style.setProperty('--tier-rows', String(Math.ceil(activeTierIds.length / columns)));
      renderTiers(); renderPool();
    }

    function renderTiers() {
      const list = document.getElementById('tierList'); list.innerHTML = '';
      getActiveTiers().forEach(tier => {
        const row = document.createElement('div'); row.className = 'tier-row';
        const lbl = document.createElement('div'); lbl.className = 'tier-label'; lbl.style.background = tier.color; lbl.style.color = tier.text;
        lbl.textContent = tier.label; row.appendChild(lbl);

        const itemsDiv = document.createElement('div'); itemsDiv.className = 'tier-items'; itemsDiv.dataset.tier = tier.id;
        setupDrop(itemsDiv);
        const listItems = tierItems[tier.id] || [];
        const rowDiv = document.createElement('div'); rowDiv.className = 'tier-item-row';
        listItems.forEach(item => rowDiv.appendChild(makeItemWrapper(item, tier.id)));
        itemsDiv.appendChild(rowDiv);
        row.appendChild(itemsDiv); list.appendChild(row);
      });
    }

    function renderPool() {
      const pool = document.getElementById('pool'); pool.innerHTML = '';
      if (!poolItems.length) { pool.innerHTML = '<div class="pool-empty">add items below</div>'; return; }
      poolItems.forEach(item => pool.appendChild(makeItemWrapper(item, '__pool__')));
      setupDrop(pool);
    }

    function makeItemWrapper(item, tier) {
      const wrap = document.createElement('div'); wrap.className = 'tilt-wrapper'; wrap.draggable = true;
      const card = document.createElement('div'); card.className = 'tl-item';
      card.innerHTML = `<div class="tl-item-text-block"><div class="tl-item-label">${item.label}</div></div>`;
      wrap.appendChild(card);
      wrap.addEventListener('dragstart', () => { dragItem = item; dragSrc = tier; });
      return wrap;
    }

    function setupDrop(el) {
      el.addEventListener('dragover', e => e.preventDefault());
      el.addEventListener('drop', e => {
        e.preventDefault(); if (!dragItem) return;
        const dest = el.dataset.tier;
        if (dest === dragSrc) return;
        removeFromSrc(dragItem.id, dragSrc);
        if (dest === '__pool__') poolItems.push(dragItem);
        else { if (!tierItems[dest]) tierItems[dest] = []; tierItems[dest].push(dragItem); }
        dragItem = null; dragSrc = null; renderAll();
      });
    }

    function removeFromSrc(id, tier) {
      if (tier === '__pool__') poolItems = poolItems.filter(i => i.id !== id);
      else tierItems[tier] = (tierItems[tier] || []).filter(i => i.id !== id);
    }

    function addItem() {
      const input = document.getElementById('itemInput').value.trim();
      if (!input) return;
      poolItems.push({ id: 'item_' + (++idCounter), label: input });
      document.getElementById('itemInput').value = '';
      renderAll();
    }

    document.getElementById('presetSel').addEventListener('change', function() {
      if (PRESETS[this.value]) { activeTierIds = PRESETS[this.value]; renderAll(); }
    });
    document.getElementById('colSel').addEventListener('change', function() {
      columns = parseInt(this.value); renderAll();
    });

    document.getElementById('pool').dataset.tier = '__pool__';
    setupDrop(document.getElementById('pool'));
    renderAll();
  </script>
  </body>
</html>
