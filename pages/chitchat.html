<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chits & Chats - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 750px; margin: 0 auto; padding-bottom: 80px;">
        <h1 style="margin-bottom:24px;">Chits & Chats</h1>
        
        <div id="messages-container" style="display:flex; flex-direction:column; gap:0; margin-bottom:24px; max-height:450px; overflow-y:auto; border:1px solid var(--border);"></div>

        <div style="padding-top:16px;">
            <input type="text" id="chat-name" class="ui-input" placeholder="Your Name" readonly style="opacity: 0.6; cursor: not-allowed;">
            <textarea id="chat-msg" class="ui-input" rows="3" placeholder="Write a message..."></textarea>
            <button class="ui-btn" onclick="sendChatMessage()">Post Message</button>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let chatMessages = [];
        let isAdminLocal = false;

        async function initChitChat() {
            isAdminLocal = window.parent.currentProfile?.is_admin || false;

            const nameInput = document.getElementById('chat-name');
            if (window.parent.currentUser) {
                nameInput.value = window.parent.currentProfile?.username || "Player";
            } else {
                let anonId = localStorage.getItem('anon_device_id');
                if (!anonId) {
                    anonId = Math.floor(Math.random() * 90000 + 10000);
                    localStorage.setItem('anon_device_id', anonId);
                }
                nameInput.value = "Anonymous #" + anonId;
            }

            const { data } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
            if (data) {
                chatMessages = data;
                renderChat();
            }

            supabaseClient.channel('guestbook-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, async () => {
                const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
                if (updated) {
                    chatMessages = updated;
                    renderChat();
                }
            }).subscribe();
        }

        function renderChat() {
            const container = document.getElementById('messages-container');
            container.innerHTML = chatMessages.filter(m => !m.drawing && m.message).map(m => `
                <div style="border-bottom:1px solid var(--border); padding:16px; background:var(--bg-main); position:relative;">
                    ${isAdminLocal ? `<button class="ui-btn" style="position:absolute; top:10px; right:10px; width:auto; margin:0; padding:2px 8px; font-size:10px; color:var(--destructive); background:transparent; border:none;" onclick="deleteMessage(${m.id})">✕</button>` : ''}
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:11px; padding-right: 20px;">
                        <div>
                            <strong style="color:var(--accent);">${escapeHTML(m.name || 'Anonymous')}</strong>
                            ${m.is_creator ? '<span style="background:var(--accent); color:var(--bg-main); padding:2px 6px; font-size:9px; margin-left:6px; font-weight:bold; letter-spacing: 1px;">ADMIN</span>' : ''}
                        </div>
                        <span style="color:var(--fg-muted);">${new Date(m.created_at).toLocaleString()}</span>
                    </div>
                    <div style="font-size:13px; line-height:1.6; color:var(--fg-main);">${escapeHTML(m.message || '')}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHTML(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        window.sendChatMessage = async () => {
            const name = document.getElementById('chat-name').value.trim();
            const message = document.getElementById('chat-msg').value.trim();
            if (!message) return;

            await supabaseClient.from('guestbook').insert({ name, message, is_creator: isAdminLocal });
            document.getElementById('chat-msg').value = '';
        };

        window.deleteMessage = async (id) => {
            if(!await window.parent.guiConfirm("Delete this message?", "Confirm Deletion")) return;
            await supabaseClient.from('guestbook').delete().eq('id', id);
        };

        document.addEventListener('DOMContentLoaded', initChitChat);
    </script>
</body>
</html>
