<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>chits & chats</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <h1 style="margin-bottom:24px;">chits & chats</h1>

        <div id="messages-container" style="display:flex; flex-direction:column; gap:0; margin-bottom:24px; max-height:450px; overflow-y:auto; border:1px solid var(--border);"></div>

        <div style="padding-top:16px; display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="chat-name" class="ui-input" readonly disabled style="opacity:0.7; cursor:not-allowed;" placeholder="Resolving Name...">
            <textarea id="chat-msg" class="ui-input" rows="3" placeholder="Write a message..."></textarea>
            <button class="ui-btn" onclick="sendChatMessage()">post message</button>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let chatMessages = [];
        let isAdminLocal = false;
        let isOwnerLocal = false;
        let currentUser = null;
        let currentProfile = null;
        let assignedName = "Anonymous #0000";

        function getSenderName() {
            if (window.parent && window.parent.getUserIdentity) {
                const ident = window.parent.getUserIdentity();
                if (ident && ident.username) return ident.username;
            }
            if (currentUser && currentUser.username) return currentUser.username;
            return assignedName;
        }

        async function initChitChat() {
            const ident = window.parent && window.parent.getUserIdentity ? window.parent.getUserIdentity() : { user: null, isOwner: false, isAdmin: false };
            currentUser = ident.user;
            currentProfile = ident.profile;
            isAdminLocal = ident.isAdmin;
            isOwnerLocal = ident.isOwner;

            if (ident.username) {
                assignedName = ident.username;
            } else {
                assignedName = await getAnonName();
            }

            const nameInput = document.getElementById('chat-name');
            nameInput.value = getSenderName();

            const { data } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
            if (data) {
                chatMessages = data;
                renderChat();
            }

            supabaseClient.channel('guestbook-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, async () => {
                const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
                if (updated) {
                    chatMessages = updated;
                    renderChat();
                }
            }).subscribe();
        }

        window.onParentAuthChanged = initChitChat;

        async function getAnonName() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                let hash = 0;
                for (let i = 0; i < data.ip.length; i++) hash = ((hash << 5) - hash) + data.ip.charCodeAt(i);
                return "Anonymous #" + Math.abs(hash).toString().substring(0, 4);
            } catch (e) {
                return "Anonymous #" + Math.floor(Math.random() * 9000 + 1000);
            }
        }

        function renderChat() {
            const container = document.getElementById('messages-container');
            const sender = getSenderName();

            container.innerHTML = chatMessages.filter(m => !m.drawing && m.message).map(m => {
                const isOwnerAuthor = m.name && m.name.toLowerCase() === 'error dev';
                const isMyMessage = (m.user_id && currentUser && m.user_id === currentUser.id) || (m.name && m.name.toLowerCase() === sender.toLowerCase());
                const canDelete = isAdminLocal && (isOwnerLocal || isMyMessage);

                const badgeHTML = isOwnerAuthor
                    ? '<span style="background:var(--accent); color:var(--bg-main); padding:2px 6px; font-size:9px; margin-left:6px; font-weight:bold; letter-spacing: 1px;">ERROR DEV</span>'
                    : (m.is_creator ? '<span style="background:var(--accent); color:var(--bg-main); padding:2px 6px; font-size:9px; margin-left:6px; font-weight:bold; letter-spacing: 1px;">ADMIN</span>' : '');

                return `
                    <div style="border-bottom:1px solid var(--border); padding:16px; background:var(--bg-main); display:flex; justify-style:space-between; align-items:flex-start;">
                        <div style="flex:1;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:11px;">
                                <div>
                                    <strong style="color:var(--accent);">${escapeHTML(m.name || 'Anonymous')}</strong>
                                    ${badgeHTML}
                                </div>
                                <span style="color:var(--fg-muted);">${new Date(m.created_at).toLocaleString()}</span>
                            </div>
                            <div style="font-size:13px; line-height:1.6; color:var(--fg-main);">${escapeHTML(m.message || '')}</div>
                        </div>
                        ${canDelete ? `<button class="ui-btn" style="width:auto; margin:0 0 0 16px; color:var(--destructive); padding:2px 8px; font-size:11px;" onclick="deleteMessage('${m.id}')">Delete</button>` : ''}
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHTML(str) { return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        window.sendChatMessage = async () => {
            const message = document.getElementById('chat-msg').value.trim();
            if (!message) return;
            const sender = getSenderName();

            await supabaseClient.from('guestbook').insert({ name: sender, message, is_creator: isAdminLocal, user_id: currentUser?.id || null });
            document.getElementById('chat-msg').value = '';
            
            const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
            if (updated) {
                chatMessages = updated;
                renderChat();
            }
        };

        window.deleteMessage = async (id) => {
            if (!isAdminLocal) return;
            const sender = getSenderName();
            const targetMsg = chatMessages.find(m => String(m.id) === String(id));
            const isMyMessage = targetMsg && ((targetMsg.user_id && currentUser && targetMsg.user_id === currentUser.id) || (targetMsg.name && targetMsg.name.toLowerCase() === sender.toLowerCase()));

            if (!isOwnerLocal && !isMyMessage) {
                if (window.parent && window.parent.guiAlert) window.parent.guiAlert("Admins cannot delete other users' chat messages.", "permission denied");
                else alert("Admins cannot delete other users' chat messages.");
                return;
            }

            const ok = window.parent && window.parent.guiConfirm ? await window.parent.guiConfirm("Delete this message?") : confirm("Delete this message?");
            if (!ok) return;

            await supabaseClient.from('guestbook').delete().eq('id', id);
            
            const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
            if (updated) {
                chatMessages = updated;
                renderChat();
            }
        };

        document.addEventListener('DOMContentLoaded', initChitChat);
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
</html>
