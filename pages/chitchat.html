<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chits & Chats - Error Dev</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 750px; margin: 0 auto; padding-bottom: 60px;">
        <h1 style="margin-bottom:20px;">Chits & Chats</h1>
        
        <div id="messages-container" style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px; max-height:450px; overflow-y:auto; padding-right:6px;"></div>

        <div style="background:var(--bg-hover); border:1px solid var(--border); padding:16px; display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="chat-name" class="ui-input" placeholder="Your Name" style="margin:0;">
            <textarea id="chat-msg" class="ui-input" rows="3" placeholder="Write a message..." style="margin:0;"></textarea>
            <button class="ui-btn" onclick="sendChatMessage()" style="margin:0;">Post Message</button>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let chatMessages = [];

        async function initChitChat() {
            const { data } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
            if (data) {
                chatMessages = data;
                renderChat();
            }

            supabaseClient.channel('guestbook-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'guestbook' }, async () => {
                const { data: updated } = await supabaseClient.from('guestbook').select('*').order('created_at', { ascending: true });
                if (updated) {
                    chatMessages = updated;
                    renderChat();
                }
            }).subscribe();
        }

        function renderChat() {
            const container = document.getElementById('messages-container');
            container.innerHTML = chatMessages.map(m => `
                <div style="background:var(--bg-hover); border:1px solid var(--border); padding:12px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:11px;">
                        <strong style="color:var(--accent);">${escapeHTML(m.name || 'Anonymous')}</strong>
                        <span style="color:var(--fg-muted);">${new Date(m.created_at).toLocaleString()}</span>
                    </div>
                    <div style="font-size:13px; line-height:1.5;">${escapeHTML(m.message || '')}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHTML(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        window.sendChatMessage = async () => {
            const name = document.getElementById('chat-name').value.trim() || 'Anonymous';
            const message = document.getElementById('chat-msg').value.trim();
            if (!message) return;

            await supabaseClient.from('guestbook').insert({ name, message });
            document.getElementById('chat-msg').value = '';
        };

        document.addEventListener('DOMContentLoaded', initChitChat);
    </script>
</body>
</html>
