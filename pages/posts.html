<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>posts</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        .post-compose {
            min-height: 110px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--fg-main);
            padding: 12px 14px;
            font-family: var(--font-ui);
            font-size: 13px;
            line-height: 1.6;
            outline: none;
            margin-bottom: 10px;
            width: 100%;
            resize: vertical;
        }
        .post-card {
            border: 1px solid var(--border);
            background: var(--bg-hover);
            padding: 20px;
            margin-bottom: 20px;
        }
        .post-body img {
            max-width: 100%;
            display: block;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
        .post-id-btn {
            cursor: pointer;
            color: var(--fg-muted);
            font-size: 12px;
            font-family: var(--font-ui);
            background: none;
            border: none;
            padding: 0;
            width: auto;
            margin: 0;
        }
        .post-id-btn:hover { color: var(--accent); text-decoration: underline; }
        .post-actions { display: flex; gap: 16px; align-items: center; margin-top: 14px; }
        .post-like-btn {
            width: auto; margin: 0; padding: 6px 14px; font-size: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .post-like-btn.liked { border-color: var(--accent); color: var(--accent); }
        .post-comments-toggle {
            width: auto; margin: 0; padding: 6px 14px; font-size: 12px; background: transparent;
        }
        .post-comments-section { display: none; margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 16px; }
        .post-comments-section.expanded { display: block; }
        .comment-row { padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
        .comment-row:last-child { border-bottom: none; }
        .copy-toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: var(--bg-main); padding: 10px 20px;
            font-family: var(--font-ui); font-size: 12px; font-weight: bold; z-index: 999;
            opacity: 0; transition: opacity 0.2s;
        }
        .copy-toast.show { opacity: 1; }
    </style>
</head>
<body style="padding: 40px; overflow-y: auto;">
    <div style="max-width: 900px; margin: 0 auto; padding-bottom: 80px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <h1 style="margin:0;">posts</h1>
        </div>

        <div id="admin-compose-box" style="display:none; border:1px solid var(--border); background:var(--bg-hover); padding:18px; margin-bottom:32px;">
            <div style="font-size:11px; color:var(--fg-muted); margin-bottom:8px; text-transform:lowercase;">new post (markdown &amp; pasted inline images supported)</div>
            <textarea id="post-compose" class="post-compose ui-input" rows="6" placeholder="write a post using markdown... a single line break is a real line break here"></textarea>

            <div id="post-canvas-container" style="display:none; margin-bottom:16px; border:1px solid var(--border); padding:12px; background:var(--bg-main);">
                <div style="display:flex; gap:10px; margin-bottom:8px; align-items:center;">
                    <input type="color" id="post-brush-color" value="#ffffff" style="background:var(--bg-sidebar); border:1px solid var(--border); height:24px;">
                    <input type="range" id="post-brush-size" min="1" max="20" value="3">
                    <button class="ui-btn" style="width:auto; margin:0;" onclick="clearPostCanvas()">clear drawing</button>
                </div>
                <canvas id="post-canvas" style="background:#1c1b18; border:1px solid var(--border); width:100%; height:250px; cursor:crosshair;"></canvas>
            </div>

            <div style="display:flex; gap:10px; align-items:center;">
                <button class="ui-btn" style="width:auto; margin:0;" onclick="showGuidelinesModal()">guidelines</button>
                <button class="ui-btn" style="width:auto; margin:0;" onclick="togglePostCanvas()">toggle drawing canvas</button>
                <button class="ui-btn" style="flex:1; margin:0; border-color:var(--accent); color:var(--accent);" onclick="submitPost()">post</button>
            </div>
        </div>

        <div id="non-admin-note" class="admin-only-note" style="display:none;">
            you must be logged in to create posts. feel free to like and comment on posts below!
        </div>

        <div id="posts-list"></div>
    </div>

    <div class="copy-toast" id="copy-toast">Link copied</div>

    <script>
        const supabaseUrl = "https://wtasesmqwpnbwzdynnas.supabase.co";
        const supabaseKey = "sb_publishable_ay0PuIePjZwrEgP5XpD5iQ_W5wC-5g9";
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        marked.use({ breaks: true, gfm: true });

        let currentUser = null;
        let currentProfile = null;
        let isAdminLocal = false;
        let isOwnerLocal = false;
        let assignedName = "Anonymous #0000";
        let posts = [];
        let likeCounts = {};
        let likedByMe = {};
        let expandedComments = {};

        const pCanvas = document.getElementById('post-canvas');
        const pCtx = pCanvas.getContext('2d');
        let isDrawing = false;
        let postCanvasActive = false;

        function resizePostCanvas() {
            const rect = pCanvas.parentElement.getBoundingClientRect();
            pCanvas.width = rect.width - 26;
            pCanvas.height = 250;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            clearPostCanvas();
        }

        function clearPostCanvas() {
            pCtx.fillStyle = '#1c1b18';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
        }

        pCanvas.addEventListener('mousedown', e => { isDrawing = true; pCtx.beginPath(); pCtx.moveTo(e.offsetX, e.offsetY); });
        pCanvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            pCtx.lineTo(e.offsetX, e.offsetY);
            pCtx.strokeStyle = document.getElementById('post-brush-color').value;
            pCtx.lineWidth = document.getElementById('post-brush-size').value;
            pCtx.stroke();
        });
        window.addEventListener('mouseup', () => isDrawing = false);

        function togglePostCanvas() {
            const container = document.getElementById('post-canvas-container');
            if (container.style.display === 'none') {
                container.style.display = 'block';
                postCanvasActive = true;
                setTimeout(resizePostCanvas, 50);
            } else {
                container.style.display = 'none';
                postCanvasActive = false;
            }
        }

        function cropPostCanvas(sourceCanvas, padding = 15) {
            const ctx = sourceCanvas.getContext('2d');
            const w = sourceCanvas.width;
            const h = sourceCanvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            let minX = w, minY = h, maxX = 0, maxY = 0;
            let hasDrawing = false;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];

                    if (Math.abs(r - 28) > 10 || Math.abs(g - 27) > 10 || Math.abs(b - 24) > 10) {
                        hasDrawing = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (!hasDrawing) return null;

            minX = Math.max(0, minX - padding);
            minY = Math.max(0, minY - padding);
            maxX = Math.min(w, maxX + padding);
            maxY = Math.min(h, maxY + padding);

            const cropW = maxX - minX;
            const cropH = maxY - minY;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropW;
            tempCanvas.height = cropH;
            const tempCtx = tempCanvas.getContext('2d');

            tempCtx.fillStyle = '#1c1b18';
            tempCtx.fillRect(0, 0, cropW, cropH);
            tempCtx.drawImage(sourceCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

            return tempCanvas.toDataURL('image/png');
        }

        async function showGuidelinesModal() {
            try {
                const res = await fetch('../data/guidelines.md');
                const text = res.ok ? await res.text() : 'no guidelines available.';
                if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert(marked.parse(text), "posting guidelines");
                } else {
                    alert(text);
                }
            } catch (e) {
                if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert("failed to load guidelines.", "error");
                }
            }
        }

        function setupSinglePasteListener() {
            const composeBox = document.getElementById('post-compose');
            if (!composeBox || composeBox.dataset.pasteAttached) return;
            composeBox.dataset.pasteAttached = "true";

            composeBox.addEventListener('paste', function(e) {
                const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
                if (!items) return;

                let imageItem = null;
                for (let item of items) {
                    if (item.type && item.type.indexOf('image') === 0) {
                        imageItem = item;
                        break;
                    }
                }

                if (imageItem) {
                    e.preventDefault();
                    e.stopPropagation();
                    const blob = imageItem.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64 = event.target.result;
                        const textarea = e.target;
                        const start = textarea.selectionStart;
                        const end = textarea.selectionEnd;
                        const text = textarea.value;
                        const markdownImage = `\n![image](${base64})\n`;
                        textarea.value = text.substring(0, start) + markdownImage + text.substring(end);
                        textarea.selectionStart = textarea.selectionEnd = start + markdownImage.length;
                    };
                    reader.readAsDataURL(blob);
                }
            });
        }

        function getSenderName() {
            if (window.parent && window.parent.getUserIdentity) {
                const ident = window.parent.getUserIdentity();
                if (ident && ident.username) return ident.username;
            }
            if (currentUser && currentUser.username) return currentUser.username;
            return assignedName;
        }

        function escapeHTML(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function sanitizePostHTML(html) {
            return DOMPurify.sanitize(html, {
                ALLOWED_TAGS: ['img', 'br', 'b', 'i', 'strong', 'em', 'a', 'p', 'h1', 'h2', 'h3', 'h4', 'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'hr', 'table', 'thead', 'tbody', 'tr', 'td', 'th'],
                ALLOWED_ATTR: ['src', 'alt', 'href', 'target', 'rel']
            });
        }

        function renderMarkdown(raw) {
            return sanitizePostHTML(marked.parse(raw || ''));
        }

        async function getAnonName() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                let hash = 0;
                for (let i = 0; i < data.ip.length; i++) hash = ((hash << 5) - hash) + data.ip.charCodeAt(i);
                return "Anonymous #" + Math.abs(hash).toString().substring(0, 4);
            } catch (e) {
                return "Anonymous #" + Math.floor(Math.random() * 9000 + 1000);
            }
        }

        async function initPosts() {
            const ident = window.parent && window.parent.getUserIdentity ? window.parent.getUserIdentity() : { user: null, isOwner: false, isAdmin: false };
            currentUser = ident.user;
            currentProfile = ident.profile;
            isAdminLocal = ident.isAdmin;
            isOwnerLocal = ident.isOwner;

            if (ident.username) {
                assignedName = ident.username;
            } else {
                assignedName = await getAnonName();
            }

            const composeBox = document.getElementById('admin-compose-box');
            const nonAdminNote = document.getElementById('non-admin-note');

            if (currentUser) {
                composeBox.style.display = 'block';
                nonAdminNote.style.display = 'none';
            } else {
                composeBox.style.display = 'none';
                nonAdminNote.style.display = 'block';
            }

            setupSinglePasteListener();
            await loadPosts();

            supabaseClient.channel('posts-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, loadPosts).subscribe();
            supabaseClient.channel('post-likes-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'post_likes' }, loadPosts).subscribe();
        }

        window.onParentAuthChanged = initPosts;

        async function loadPosts() {
            const { data, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
            if (error) {
                document.getElementById('posts-list').innerHTML = `<p style="color:var(--destructive); font-size:13px;">Could not load posts: ${escapeHTML(error.message)}</p>`;
                return;
            }
            posts = data || [];

            const { data: likeRows } = await supabaseClient.from('post_likes').select('post_id, user_id');
            likeCounts = {};
            likedByMe = {};
            (likeRows || []).forEach(r => {
                likeCounts[r.post_id] = (likeCounts[r.post_id] || 0) + 1;
                if (currentUser && r.user_id === currentUser.id) likedByMe[r.post_id] = true;
            });

            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('posts-list');
            if (!posts.length) {
                container.innerHTML = '<p style="color:var(--fg-muted); font-size:13px;">No posts yet.</p>';
                return;
            }

            const sender = getSenderName();

            container.innerHTML = posts.map(p => {
                const isOwnerAuthor = p.name && p.name.toLowerCase() === 'error dev';
                const isMyPost = (p.user_id && currentUser && p.user_id === currentUser.id) || (p.name && p.name.toLowerCase() === sender.toLowerCase());
                const canDelete = isOwnerLocal || isMyPost;
                
                const badgeHTML = isOwnerAuthor
                    ? '<span class="user-tag admin" style="margin-left:8px; border-color:var(--accent); color:var(--accent);">error dev</span>'
                    : (p.is_creator ? '<span class="user-tag admin" style="margin-left:8px;">admin</span>' : '');

                return `
                    <div class="post-card" id="post-${p.id}">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                            <div>
                                <strong style="color:var(--accent);">${escapeHTML(p.name || 'Anonymous')}</strong>
                                ${badgeHTML}
                                <div style="font-size:11px; color:var(--fg-muted); margin-top:4px;">${new Date(p.created_at).toLocaleString()}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <button class="post-id-btn" onclick="copyPostLink('${p.id}')">ID: #${p.id}</button>
                                ${canDelete ? `<button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); padding:2px 8px; font-size:11px;" onclick="deletePost('${p.id}')">Delete</button>` : ''}
                            </div>
                        </div>
                        <div class="post-body markdown-body">${renderMarkdown(p.content || '')}</div>
                        <div class="post-actions">
                            <button class="ui-btn post-like-btn ${likedByMe[p.id] ? 'liked' : ''}" onclick="toggleLike('${p.id}')">♥ <span>${likeCounts[p.id] || 0}</span></button>
                            <button class="ui-btn post-comments-toggle" onclick="toggleComments('${p.id}')">Comments</button>
                        </div>
                        <div class="post-comments-section ${expandedComments[p.id] ? 'expanded' : ''}" id="comments-${p.id}">
                            <div id="comment-list-${p.id}" style="margin-bottom:12px;"><span style="color:var(--fg-muted); font-size:12px;">Loading comments...</span></div>
                            <div style="display:flex; gap:8px;">
                                <input type="text" id="comment-input-${p.id}" class="ui-input" style="margin:0;" placeholder="Write a comment...">
                                <button class="ui-btn" style="width:auto; margin:0;" onclick="submitComment('${p.id}')">Send</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            Object.keys(expandedComments).forEach(id => {
                if (expandedComments[id]) loadComments(id);
            });
        }

        window.toggleComments = async function (postId) {
            expandedComments[postId] = !expandedComments[postId];
            const section = document.getElementById(`comments-${postId}`);
            section.classList.toggle('expanded', expandedComments[postId]);
            if (expandedComments[postId]) await loadComments(postId);
        };

        async function loadComments(postId) {
            const listEl = document.getElementById(`comment-list-${postId}`);
            if (!listEl) return;
            const { data, error } = await supabaseClient.from('post_comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
            if (error) {
                listEl.innerHTML = '<span style="color:var(--destructive); font-size:12px;">could not load comments.</span>';
                return;
            }
            if (!data.length) {
                listEl.innerHTML = '<span style="color:var(--fg-muted); font-size:12px;">no comments yet.</span>';
                return;
            }

            const sender = getSenderName();

            listEl.innerHTML = data.map(c => {
                const isOwnerAuthor = c.name && c.name.toLowerCase() === 'error dev';
                const isMyComment = (c.user_id && currentUser && c.user_id === currentUser.id) || (c.name && c.name.toLowerCase() === sender.toLowerCase());
                const canDelete = isOwnerLocal || isMyComment;

                const badgeHTML = isOwnerAuthor
                    ? '<span class="user-tag admin" style="margin-left:6px; border-color:var(--accent); color:var(--accent);">error dev</span>'
                    : (c.is_creator ? '<span class="user-tag admin" style="margin-left:6px;">admin</span>' : '');

                return `
                    <div class="comment-row">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <strong style="color:var(--accent);">${escapeHTML(c.name || 'Anonymous')}</strong>
                                ${badgeHTML}
                            </div>
                            ${canDelete ? `<button class="ui-btn" style="width:auto; margin:0; color:var(--destructive); padding:2px 6px; font-size:10px;" onclick="deleteComment('${c.id}', '${postId}')">✕</button>` : ''}
                        </div>
                        <div style="margin-top:6px;">${escapeHTML(c.content)}</div>
                    </div>
                `;
            }).join('');
        }

        window.submitComment = async function (postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();
            if (!content) return;
            const sender = getSenderName();

            let payload = { post_id: postId, name: sender, content, is_creator: isAdminLocal, user_id: currentUser?.id || null };
            let { error } = await supabaseClient.from('post_comments').insert(payload);

            if (error && error.message && error.message.toLowerCase().includes('user_id')) {
                delete payload.user_id;
                const fallback = await supabaseClient.from('post_comments').insert(payload);
                error = fallback.error;
            }

            if (error) {
                if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert("Error commenting: " + error.message, "comment failed");
                } else {
                    alert("Error commenting: " + error.message);
                }
                return;
            }

            input.value = '';
            await loadComments(postId);
        };

        window.deleteComment = async function (commentId, postId) {
            const sender = getSenderName();
            const targetComment = (await supabaseClient.from('post_comments').select('*').eq('id', commentId).single())?.data;
            const isMyComment = targetComment && ((targetComment.user_id && currentUser && targetComment.user_id === currentUser.id) || (targetComment.name && targetComment.name.toLowerCase() === sender.toLowerCase()));

            if (!isOwnerLocal && !isMyComment) {
                if (window.parent && window.parent.guiAlert) window.parent.guiAlert("You can only delete your own comments.", "permission denied");
                else alert("You can only delete your own comments.");
                return;
            }

            const ok = window.parent && window.parent.guiConfirm ? await window.parent.guiConfirm("delete this comment?") : confirm("delete this comment?");
            if (!ok) return;
            
            const { error } = await supabaseClient.from('post_comments').delete().eq('id', commentId);
            if (error) {
                if (window.parent && window.parent.guiAlert) window.parent.guiAlert("Failed to delete comment: " + error.message, "Error");
                else alert("Failed to delete: " + error.message);
                return;
            }
            await loadComments(postId);
        };

        window.toggleLike = async function (postId) {
            if (!currentUser) {
                if (window.parent && window.parent.document.getElementById('auth-trigger')) {
                    window.parent.document.getElementById('auth-trigger').click();
                } else if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert('Please log in to like posts.');
                }
                return;
            }
            if (likedByMe[postId]) {
                await supabaseClient.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
            } else {
                await supabaseClient.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
            }
            await loadPosts();
        };

        window.deletePost = async function (postId) {
            const sender = getSenderName();
            const targetPost = posts.find(p => String(p.id) === String(postId));
            const isMyPost = targetPost && ((targetPost.user_id && currentUser && targetPost.user_id === currentUser.id) || (targetPost.name && targetPost.name.toLowerCase() === sender.toLowerCase()));

            if (!isOwnerLocal && !isMyPost) {
                if (window.parent && window.parent.guiAlert) window.parent.guiAlert("You can only delete your own posts.", "permission denied");
                else alert("You can only delete your own posts.");
                return;
            }

            const ok = window.parent && window.parent.guiConfirm ? await window.parent.guiConfirm("delete this post?") : confirm("delete this post?");
            if (!ok) return;

            const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
            if (error) {
                if (window.parent && window.parent.guiAlert) window.parent.guiAlert("Failed to delete post: " + error.message, "Error");
                else alert("Failed to delete: " + error.message);
                return;
            }
            await loadPosts();
        };

        window.submitPost = async function () {
            if (!currentUser) {
                if (window.parent && window.parent.guiAlert) window.parent.guiAlert("You must be logged in to create a post.", "login required");
                else alert("You must be logged in to create a post.");
                return;
            }

            const box = document.getElementById('post-compose');
            let raw = box.value.trim();
            const sender = getSenderName();

            if (postCanvasActive) {
                const croppedDataUrl = cropPostCanvas(pCanvas);
                if (croppedDataUrl) {
                    raw = (raw ? raw + "\n\n" : "") + `![drawing](${croppedDataUrl})`;
                }
            }

            if (!raw) return;

            let payload = { name: sender, content: raw, is_creator: isAdminLocal, user_id: currentUser?.id || null };
            let { error } = await supabaseClient.from('posts').insert(payload);

            if (error && error.message && error.message.toLowerCase().includes('user_id')) {
                delete payload.user_id;
                const fallback = await supabaseClient.from('posts').insert(payload);
                error = fallback.error;
            }

            if (error) {
                if (window.parent && window.parent.guiAlert) {
                    window.parent.guiAlert("Error posting: " + error.message, "post failed");
                } else {
                    alert("Error posting: " + error.message);
                }
                return;
            }

            box.value = '';
            clearPostCanvas();
            if (postCanvasActive) togglePostCanvas();
            await loadPosts();
        };

        window.copyPostLink = function (postId) {
            const url = `${window.parent.location.origin}${window.parent.location.pathname}#Index/Posts?id=${postId}`;
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1600);
            });
        };

        document.addEventListener('DOMContentLoaded', () => {
            initPosts();
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id');
            if (targetId) {
                setTimeout(() => {
                    const el = document.getElementById(`post-${targetId}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 600);
            }
        });
    </script>
    <script src="../js/bg-canvas.js"></script>
</body>
