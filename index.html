<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devicals</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        .admin-dashboard-btn {
            display: none;
            padding: 12px 20px;
            background: var(--bg-hover);
            border-top: 1px solid var(--border);
            color: var(--accent);
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 1px;
            justify-content: space-between;
            align-items: center;
        }
        .admin-dashboard-btn:hover { background: var(--bg-workspace); }
        body.is-admin .admin-dashboard-btn { display: flex; }
        
        #announcement-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1500;
            pointer-events: none;
        }
        
        .announcement-toast {
            width: 320px;
            background: var(--bg-sidebar);
            border: 1px solid var(--accent);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }
        .announcement-toast a {
            color: var(--accent) !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <style id="custom-css-block"></style>
    
    <div class="app-layout">
        <div class="sidebar left-sidebar">
            <div id="nav-tree" class="nav-tree"></div>
            
            <div class="admin-dashboard-btn" onclick="window.location.hash='admin'">
                <span>admin dashboard</span>
                <span>></span>
            </div>

            <div class="sidebar-bottom-actions">
                <div class="action-btn" id="auth-trigger" title="User Profile">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 1 0-16 0"></path></svg>
                </div>
                <div class="action-btn" id="settings-trigger" title="Settings">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div id="breadcrumbs" class="breadcrumbs"></div>
            </div>
            <div id="workspace" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
                <iframe id="iframe-workspace" class="workspace-frame" style="display:none;"></iframe>
                <div id="page-content" class="page-content markdown-body" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div id="announcement-container"></div>

    <div id="auth-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">account center</div>
            <div id="auth-content"></div>
            <button class="modal-close" onclick="document.getElementById('auth-modal').style.display='none'">close</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">settings</div>
            <div class="settings-group">
                <label>theme options</label>
                <button id="toggle-dark-mode" class="ui-btn">toggle dark/light mode</button>
                <select id="theme-selector" class="ui-input">
                    <option value="primary">primary (default warm)</option>
                    <option value="obsidian">obsidian dark</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Background Effect</label>
                <select id="bg-effect-selector" class="ui-input">
                    <option value="particles">network</option>
                    <option value="matrix">matrix</option>
                    <option value="stars">stars</option>
                    <option value="none">nothing</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Custom CSS</label>
                <textarea id="custom-css-input" class="ui-input" rows="4" placeholder="enter custom css rules..."></textarea>
                <button id="save-css" class="ui-btn">apply custom css</button>
            </div>
            <button class="modal-close" onclick="document.getElementById('settings-modal').style.display='none'">close</button>
        </div>
    </div>

    <div id="gui-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-title">notification</div>
            <div id="gui-msg" style="font-size:12px; margin-bottom:16px;"></div>
            <button class="ui-btn" onclick="closeGuiModal()">ok</button>
        </div>
    </div>

    <div id="gui-confirm-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-confirm-title">confirm action</div>
            <div id="gui-confirm-msg" style="font-size:12px; margin-bottom:16px;"></div>
            <div style="display:flex; gap:8px;">
                <button class="ui-btn" id="gui-confirm-yes">yes</button>
                <button class="ui-btn" id="gui-confirm-no" onclick="closeGuiConfirmModal()">cancel</button>
            </div>
        </div>
    </div>

    <div id="gui-prompt-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-prompt-title">input required</div>
            <div id="gui-prompt-msg" style="font-size:12px; margin-bottom:10px;"></div>
            <input type="text" id="gui-prompt-input" class="ui-input">
            <div style="display:flex; gap:8px;">
                <button class="ui-btn" id="gui-prompt-ok">ok</button>
                <button class="ui-btn" onclick="closeGuiPromptModal()">cancel</button>
            </div>
        </div>
    </div>

    <script src="js/bg-canvas.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/spotify.js"></script>
</body>
</html>
