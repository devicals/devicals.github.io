<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Dev</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
</head>
<body>
    <style id="custom-css-block"></style>
    
    <div class="app-layout">
        <div class="sidebar left-sidebar">
            <div class="nav-header">Files</div>
            <div id="nav-tree" class="nav-tree"></div>
            
            <div class="sidebar-bottom-actions">
                <div class="action-btn" id="auth-trigger">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 1 0-16 0"></path></svg>
                </div>
                <div class="action-btn" id="settings-trigger">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div id="breadcrumbs" class="breadcrumbs"></div>
            </div>
            <div id="page-content" class="page-content markdown-body"></div>
        </div>

        <div class="sidebar right-sidebar">
            <div class="toc-container">
                <div class="nav-header">Outline</div>
                <div id="toc-tree" class="toc-tree"></div>
            </div>
            <div class="graph-container">
                <div class="nav-header">Graph View</div>
                <canvas id="graph-canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">Authentication</div>
            <div id="auth-content"></div>
            <button class="modal-close" onclick="document.getElementById('auth-modal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">Settings</div>
            <div class="settings-group">
                <label>Appearance</label>
                <button id="toggle-dark-mode" class="ui-btn">Toggle Dark/Light</button>
                <select id="theme-selector" class="ui-input">
                    <option value="primary">Primary (Default)</option>
                    <option value="obsidian">Obsidian Default</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Custom CSS</label>
                <textarea id="custom-css-input" class="ui-input" rows="5"></textarea>
                <button id="save-css" class="ui-btn">Save CSS</button>
            </div>
            <div id="admin-settings-link" class="settings-group" style="display: none;">
                <div class="admin-link" onclick="window.location.hash='admin'">Admin Dashboard <span style="float:right;">></span></div>
            </div>
            <button class="modal-close" onclick="document.getElementById('settings-modal').style.display='none'">Close</button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/spotify.js"></script>
</body>
</html>
