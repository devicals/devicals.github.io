<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/css/primary-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">
  <div id="sidebar-left">
    <div id="nav-tree-wrap"><div id="nav-tree"></div></div>
    <div id="profile-popup" class="popup"></div>
    <div id="settings-popup" class="popup"></div>
    <div id="sidebar-bottom">
      <button id="profile-icon-btn"><span class="profile-icon-glyph">&#9790;</span></button>
      <button id="settings-icon-btn">&#9776;</button>
    </div>
  </div>
  <div id="main">
    <div id="breadcrumb"></div>
    <div id="page-content"></div>
  </div>
  <div id="sidebar-right">
    <div id="toc-wrap">
      <h4>Table of Contents</h4>
      <div id="toc-list"></div>
    </div>
    <div id="graph-view-wrap">
      <h4>Graph View</h4>
      <canvas id="graph-canvas"></canvas>
    </div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/router.js"></script>
<script src="/js/pages/admin.js"></script>
<script src="/js/graph.js"></script>
</body>
</html>
