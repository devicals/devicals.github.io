<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devicals</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" crossorigin="anonymous"></script>
    <style>
        .admin-dashboard-btn {
            display: none;
            padding: 10px 14px;
            background: var(--bg-elevated);
            border-top: 1px solid var(--border);
            color: var(--accent);
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            justify-content: space-between;
            align-items: center;
            transition: background 0.14s ease, padding-left 0.14s ease;
        }
        .admin-dashboard-btn:hover {
            background: var(--bg-hover);
            padding-left: 18px;
        }
        body.is-admin .admin-dashboard-btn { display: flex; }

        #announcement-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1500;
            pointer-events: none;
        }

        .announcement-toast {
            width: 320px;
            background: var(--bg-elevated);
            border-top: 1px solid var(--edge-hi);
            border-left: 1px solid var(--edge-hi);
            border-right: 1px solid var(--edge-lo);
            border-bottom: 1px solid var(--edge-lo);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }
        .announcement-toast a {
            color: var(--accent) !important;
            text-decoration: underline;
        }
        .announcement-toast.warning-toast {
            border-color: var(--destructive);
        }
    </style>
</head>
<body>
    <style id="custom-css-block"></style>

    <div class="app-layout">
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
        <div class="sidebar left-sidebar">
            <div id="nav-tree" class="nav-tree"></div>

            <div class="admin-dashboard-btn" onclick="window.location.hash='admin'">
                <span>admin dashboard</span>
                <span>></span>
            </div>

            <div class="sidebar-bottom-actions">
                <div class="action-btn" id="auth-trigger" title="user profile">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 1 0-16 0"></path></svg>
                </div>
                <div class="action-btn" id="settings-trigger" title="settings">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <button class="mobile-nav-toggle" id="mobile-nav-toggle" onclick="document.body.classList.toggle('sidebar-open')" aria-label="toggle navigation">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <span class="mobile-bar-title">devicals</span>
            </div>
            <div id="workspace" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
                <div class="reading-progress" id="reading-progress"><div class="reading-progress-fill" id="reading-progress-fill"></div></div>
                <iframe id="iframe-workspace" class="workspace-frame" style="display:none;"></iframe>
                <div id="page-content" class="page-content markdown-body" style="display:none;"></div>
            </div>
        </div>
    </div>

    <div id="announcement-container"></div>

    <div id="auth-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">account center</div>
            <div id="auth-content"></div>
            <button class="modal-close" onclick="document.getElementById('auth-modal').style.display='none'">close</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">settings</div>
            <div class="settings-group">
                <label>theme options</label>
                <button id="toggle-dark-mode" class="ui-btn">toggle dark/light mode</button>
                <select id="theme-selector" class="ui-input">
                    <option value="primary">classic amber (default)</option>
                    <option value="obsidian">quasar violet</option>
                    <option value="phosphor">p31 green phosphor</option>
                    <option value="redshift">red-shift crimson</option>
                    <option value="pride">pride month (rainbow)</option>
                    <option value="trans">trans awareness (blue, pink &amp; white)</option>
                </select>
                <label class="ui-checkbox-row" for="seasonal-themes-toggle">
                    <input type="checkbox" id="seasonal-themes-toggle" checked>
                    <span>auto-apply seasonal pride themes</span>
                </label>
                <div id="seasonal-theme-status" class="settings-hint"></div>
            </div>
            <div class="settings-group">
                <label>background cosmos</label>
                <select id="bg-effect-selector" class="ui-input">
                    <option value="particles">cosmos</option>
                    <option value="none">off</option>
                </select>
            </div>
            <div class="settings-group">
                <label>custom css</label>
                <textarea id="custom-css-input" class="ui-input" rows="4" placeholder="enter custom css rules..."></textarea>
                <button id="save-css" class="ui-btn">apply custom css</button>
            </div>
            <button class="modal-close" onclick="document.getElementById('settings-modal').style.display='none'">close</button>
        </div>
    </div>

    <div id="gui-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-title">notification</div>
            <div id="gui-msg" class="gui-msg-box"></div>
            <button class="ui-btn" onclick="closeGuiModal()">ok</button>
        </div>
    </div>

    <div id="gui-confirm-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-confirm-title">confirm action</div>
            <div id="gui-confirm-msg" style="font-size:12px; margin-bottom:16px;"></div>
            <div style="display:flex; gap:8px;">
                <button class="ui-btn" id="gui-confirm-yes">yes</button>
                <button class="ui-btn" id="gui-confirm-no" onclick="closeGuiConfirmModal()">cancel</button>
            </div>
        </div>
    </div>

    <div id="gui-prompt-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-prompt-title">input required</div>
            <div id="gui-prompt-msg" style="font-size:12px; margin-bottom:10px;"></div>
            <input type="text" id="gui-prompt-input" class="ui-input">
            <div style="display:flex; gap:8px;">
                <button class="ui-btn" id="gui-prompt-ok">ok</button>
                <button class="ui-btn" onclick="closeGuiPromptModal()">cancel</button>
            </div>
        </div>
    </div>

    <div id="gui-form-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title" id="gui-form-title">input required</div>
            <div id="gui-form-fields"></div>
            <div style="display:flex; gap:8px;">
                <button class="ui-btn" id="gui-form-ok">save</button>
                <button class="ui-btn" onclick="closeGuiFormModal()">cancel</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('hashchange', function () {
            document.body.classList.remove('sidebar-open');
        });
        var wsIframe = document.getElementById('iframe-workspace');
        if (wsIframe) {
            wsIframe.addEventListener('load', function () {
                try {
                    if (window.syncIframeTheme) window.syncIframeTheme();
                    var idoc = this.contentDocument || this.contentWindow.document;
                    if (idoc && !idoc.querySelector('meta[name="viewport"]')) {
                        var meta = idoc.createElement('meta');
                        meta.name = 'viewport';
                        meta.content = 'width=device-width, initial-scale=1.0';
                        idoc.head.appendChild(meta);
                    }
                    if (idoc) {
                        idoc.addEventListener('scroll', function (ev) {
                            var target = ev.target === idoc ? (idoc.documentElement || idoc.body) : ev.target;
                            if (!target || target.scrollHeight <= target.clientHeight) return;
                            var pct = Math.min(100, Math.max(0, (target.scrollTop / (target.scrollHeight - target.clientHeight)) * 100));
                            var fill = document.getElementById('reading-progress-fill');
                            if (fill) fill.style.width = pct + '%';
                        }, true);
                    }
                } catch (e) {}
            });
        }
    </script>
    <script src="js/bg-canvas.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/spotify.js"></script>
</body>
</html>
