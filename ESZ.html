            function buildCrtBarrelMap() {
                const w = Math.max(320, window.innerWidth);
                const h = Math.max(240, window.innerHeight);

                const mapW = Math.min(1024, w);
                const mapH = Math.min(1024, h);
                const canvas = document.createElement('canvas');
                canvas.width = mapW;
                canvas.height = mapH;
                const ctx = canvas.getContext('2d');
                const imgData = ctx.createImageData(mapW, mapH);
                const data = imgData.data;

                const centerStretch = 0.05;
                const curve = 0.15;
                const eps = 0.16;
                const baseSqrt = Math.sqrt(eps);

                let maxShift = 24;
                for (let py = 0; py < mapH; py++) {
                    const ny = ((py + 0.5) / mapH) * 2 - 1;
                    for (let px = 0; px < mapW; px++) {
                        const nx = ((px + 0.5) / mapW) * 2 - 1;
                        const r2 = nx * nx + ny * ny;
                        const s = Math.sqrt(r2 + eps) - baseSqrt;
                        const factor = -centerStretch + curve * s;
                        const sx = Math.abs((w * 0.5) * nx * factor);
                        const sy = Math.abs((h * 0.5) * ny * factor);
                        if (sx > maxShift) maxShift = sx;
                        if (sy > maxShift) maxShift = sy;
                    }
                }

                for (let py = 0; py < mapH; py++) {
                    const ny = ((py + 0.5) / mapH) * 2 - 1;
                    for (let px = 0; px < mapW; px++) {
                        const nx = ((px + 0.5) / mapW) * 2 - 1;
                        const r2 = nx * nx + ny * ny;
                        const s = Math.sqrt(r2 + eps) - baseSqrt;
                        const factor = -centerStretch + curve * s;

                        const shiftX = (w * 0.5) * nx * factor;
                        const shiftY = (h * 0.5) * ny * factor;

                        const u = Math.max(-1, Math.min(1, shiftX / maxShift));
                        const v = Math.max(-1, Math.min(1, shiftY / maxShift));

                        const idx = (py * mapW + px) * 4;
                        data[idx] = Math.round(128 + 127 * u);
                        data[idx + 1] = Math.round(128 + 127 * v);
                        data[idx + 2] = 128;
                        data[idx + 3] = 255;
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');

                const filterEl = document.getElementById('crt-barrel');
                const feImg = document.getElementById('crt-disp-img');
                const feMap = document.getElementById('crt-disp-map');

                if (filterEl && feImg && feMap) {
                    filterEl.setAttribute('x', '0');
                    filterEl.setAttribute('y', '0');
                    filterEl.setAttribute('width', String(w));
                    filterEl.setAttribute('height', String(h));

                    feImg.setAttribute('x', '0');
                    feImg.setAttribute('y', '0');
                    feImg.setAttribute('width', String(w));
                    feImg.setAttribute('height', String(h));
                    feImg.setAttribute('href', dataUrl);
                    feImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', dataUrl);

                    feMap.setAttribute('scale', String(Math.round(maxShift * 2)));
                }
            }

            function stopExpandTracking() {
                if (expandRaf !== null) {
                    cancelAnimationFrame(expandRaf);
                    expandRaf = null;
                }
                if (frameObserver) {
                    frameObserver.disconnect();
                    frameObserver = null;
                }
            }

            function hideExpandLines() {
                stopExpandTracking();
                const svg = document.getElementById('crt-expand-svg');
                if (svg) svg.classList.remove('is-visible');
            }

            function updateExpandLines() {
                const bezel = document.getElementById('crt-bezel');
                const svg = document.getElementById('crt-expand-svg');
                const target = document.getElementById('crt-axis-target');
                const frame = document.getElementById('signal-frame');
                if (!bezel || !svg || !target || !frame || !svg.classList.contains('is-visible')) return;

                const br = bezel.getBoundingClientRect();
                const tr = target.getBoundingClientRect();

                let fx1, fy1, fx2, fy2;
                const outWrap = document.getElementById('signal-output');

                if (frame.style.transform && frame.style.transform !== 'none' && frame.style.transform !== 'translate(0px, 0px) scale(1, 1)') {
                    const wr = outWrap.getBoundingClientRect();
                    fx1 = wr.left - br.left;
                    fy1 = wr.top - br.top;
                    fx2 = wr.right - br.left;
                    fy2 = wr.bottom - br.top;
                } else {
                    const fr = frame.getBoundingClientRect();
                    fx1 = fr.left - br.left;
                    fy1 = fr.top - br.top;
                    fx2 = fr.right - br.left;
                    fy2 = fr.bottom - br.top;
                }

                const sx1 = tr.left - br.left;
                const sy1 = tr.top - br.top;
                const sx2 = tr.right - br.left;
                const sy2 = tr.bottom - br.top;

                const tl = document.getElementById('exp-line-tl');
                const trLine = document.getElementById('exp-line-tr');
                const bl = document.getElementById('exp-line-bl');
                const brLine = document.getElementById('exp-line-br');

                if (tl) { tl.setAttribute('x1', sx1); tl.setAttribute('y1', sy1); tl.setAttribute('x2', fx1); tl.setAttribute('y2', fy1); }
                if (trLine) { trLine.setAttribute('x1', sx2); trLine.setAttribute('y1', sy1); trLine.setAttribute('x2', fx2); trLine.setAttribute('y2', fy1); }
                if (bl) { bl.setAttribute('x1', sx1); bl.setAttribute('y1', sy2); bl.setAttribute('x2', fx1); bl.setAttribute('y2', fy2); }
                if (brLine) { brLine.setAttribute('x1', sx2); brLine.setAttribute('y1', sy2); brLine.setAttribute('x2', fx2); brLine.setAttribute('y2', fy2); }
            }

            function activateSettledExpand(animateExpand) {
                stopExpandTracking();

                if (axisRaf !== null) {
                    cancelAnimationFrame(axisRaf);
                    axisRaf = null;
                }
                stopServoSound();

                const layer = document.getElementById('crt-axis-layer');
                const xLine = document.getElementById('crt-axis-x');
                const yLine = document.getElementById('crt-axis-y');
                const target = document.getElementById('crt-axis-target');
                const svg = document.getElementById('crt-expand-svg');
                const frame = document.getElementById('signal-frame');
                if (!layer || !target || !svg || !frame) return;

                if (pendingAxisTarget) {
                    if (xLine) xLine.style.left = pendingAxisTarget.xp + '%';
                    if (yLine) yLine.style.top = pendingAxisTarget.yp + '%';
                    target.style.left = pendingAxisTarget.xp + '%';
                    target.style.top = pendingAxisTarget.yp + '%';
                }

                layer.classList.add('is-active');
                layer.classList.add('is-locked-only');
                target.classList.remove('is-flashing');
                target.classList.add('is-settled');
                svg.classList.add('is-visible');

                if (typeof ResizeObserver !== 'undefined') {
                    frameObserver = new ResizeObserver(() => updateExpandLines());
                    frameObserver.observe(frame);
                }

                if (!animateExpand) {
                    updateExpandLines();
                    return;
                }

                playLockChirp();

                const tr = target.getBoundingClientRect();
                const fr = frame.getBoundingClientRect();

                if (fr.width > 0 && fr.height > 0) {
                    const tcx = tr.left + tr.width * 0.5;
                    const tcy = tr.top + tr.height * 0.5;
                    const fcx = fr.left + fr.width * 0.5;
                    const fcy = fr.top + fr.height * 0.5;
                    const dx = tcx - fcx;
                    const dy = tcy - fcy;
                    const sx = Math.max(0.02, tr.width / fr.width);
                    const sy = Math.max(0.02, tr.height / fr.height);

                    frame.style.transition = 'none';
                    frame.style.transform = `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
                    frame.style.opacity = '0.2';
                    void frame.offsetWidth;

                    frame.style.transition = 'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease';
                    frame.style.transform = 'translate(0px, 0px) scale(1, 1)';
                    frame.style.opacity = '1';

                    const animStart = performance.now();
                    function trackFrame() {
                        if (performance.now() - animStart < 360) {
                            updateExpandLines();
                            expandRaf = requestAnimationFrame(trackFrame);
                        } else {
                            expandRaf = null;
                            frame.style.transition = '';
                            frame.style.transform = '';
                            frame.style.opacity = '';
                            requestAnimationFrame(() => {
                                updateExpandLines();
                            });
                        }
                    }
                    expandRaf = requestAnimationFrame(trackFrame);
                } else {
                    updateExpandLines();
                }
            }

            function stopAxisAnimation() {
                stopServoSound();
                pendingAxisTarget = null;
                if (axisRaf !== null) {
                    cancelAnimationFrame(axisRaf);
                    axisRaf = null;
                }
                hideExpandLines();
                const layer = document.getElementById('crt-axis-layer');
                const target = document.getElementById('crt-axis-target');
                if (layer) {
                    layer.classList.remove('is-active');
                    layer.classList.remove('is-locked-only');
                }
                if (target) {
                    target.classList.remove('is-flashing');
                    target.classList.remove('is-settled');
                }
            }

            function startAxisAnimation(xStr, yStr) {
                stopAxisAnimation();

                const bezel = document.getElementById('crt-bezel');
                const layer = document.getElementById('crt-axis-layer');
                const xLine = document.getElementById('crt-axis-x');
                const yLine = document.getElementById('crt-axis-y');
                const targetBox = document.getElementById('crt-axis-target');
                if (!bezel || !layer || !xLine || !yLine || !targetBox) return 0;

                const targetXPct = Math.max(0, Math.min(100, (parseFloat(xStr) / 70) * 100));
                const targetYPct = Math.max(0, Math.min(100, (parseFloat(yStr) / 70) * 100));
                pendingAxisTarget = { xp: targetXPct, yp: targetYPct };

                const w = Math.max(1, bezel.clientWidth);
                const h = Math.max(1, bezel.clientHeight);
                const dx = (targetXPct / 100) * w;
                const dy = (targetYPct / 100) * h;
                const dist = Math.hypot(dx, dy);
                const fullDiag = Math.hypot(w, h);
                const travelMs = fullDiag > 0 ? (dist / fullDiag) * 2000 : 0;

                function applyPos(xp, yp) {
                    xLine.style.left = xp + '%';
                    yLine.style.top = yp + '%';
                    targetBox.style.left = xp + '%';
                    targetBox.style.top = yp + '%';
                }

                layer.classList.add('is-active');

                if (travelMs <= 1) {
                    applyPos(targetXPct, targetYPct);
                    targetBox.classList.add('is-flashing');
                    return 0;
                }

                startServoSound(travelMs);
                applyPos(0, 0);
                const startTime = performance.now();

                function step() {
                    const elapsed = Math.max(0, performance.now() - startTime);
                    const p = Math.min(1, elapsed / travelMs);
                    applyPos(targetXPct * p, targetYPct * p);
                    if (p < 1) {
                        axisRaf = requestAnimationFrame(step);
                    } else {
                        axisRaf = null;
                        stopServoSound();
                        targetBox.classList.add('is-flashing');
                    }
                }

                axisRaf = requestAnimationFrame(step);
                return travelMs;
            }

            function decryptEmail(enc) {
                if (!enc) return null;
                if (!enc.startsWith('enc_')) return enc;
                try {
                    const raw = atob(enc.replace('enc_', ''));
                    let result = '';
                    for (let i = 0; i < raw.length; i++) {
                        result += String.fromCharCode(raw.charCodeAt(i) ^ 42);
                    }
                    return result;
                } catch (e) {
                    return enc;
                }
            }

            function computeIsOwner(u) {
                if (!u || u.is_banned) return false;
                const name = (u.username || '').trim().toLowerCase();
                const email = (u.email || '').trim().toLowerCase();
                return u.is_owner === true || name === 'error dev' || email === OWNER_EMAIL.toLowerCase();
            }

            function syncOwnerStageClass() {
                const stage = document.getElementById('crt-stage');
                if (stage) stage.classList.toggle('is-owner', isOwner);
            }

            function readLocalAuthSync() {
                try {
                    const raw = localStorage.getItem('custom_auth_session');
                    if (!raw) {
                        sessionUser = null;
                        isOwner = false;
                        syncOwnerStageClass();
                        return null;
                    }
                    const parsed = JSON.parse(raw);
                    if (!parsed || parsed.is_banned) {
                        sessionUser = null;
                        isOwner = false;
                        syncOwnerStageClass();
                        return null;
                    }
                    if (parsed.email) parsed.email = decryptEmail(parsed.email);
                    sessionUser = parsed;
                    isOwner = computeIsOwner(parsed);
                    syncOwnerStageClass();
                    return parsed;
                } catch (e) {
                    sessionUser = null;
                    isOwner = false;
                    syncOwnerStageClass();
                    return null;
                }
            }

            async function verifyAuthWithDatabase() {
                const prevOwner = isOwner;
                const localUser = readLocalAuthSync();
                if (!localUser || !localUser.id) {
                    syncOwnerStageClass();
                    if (prevOwner !== isOwner && activeCoord && !isSpecialCoordKey(activeCoord.key)) {
                        renderSignalResults(false);
                    }
                    return;
                }
                try {
                    const { data, error } = await sb
                        .from('profiles')
                        .select('*')
                        .eq('id', localUser.id)
                        .maybeSingle();

                    if (error || !data || data.is_banned) {
                        sessionUser = null;
                        isOwner = false;
                    } else {
                        if (data.email) data.email = decryptEmail(data.email);
                        sessionUser = data;
                        isOwner = computeIsOwner(data);
                    }
                } catch (e) {}
                syncOwnerStageClass();
                if (prevOwner !== isOwner && activeCoord && !isSpecialCoordKey(activeCoord.key)) {
                    renderSignalResults(false);
                }
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'custom_auth_session') {
                    verifyAuthWithDatabase();
                } else if (e.key === RATE_KEY) {
                    startCooldownMonitor(false);
                }
            });
            window.addEventListener('focus', () => {
                verifyAuthWithDatabase();
                applyCooldownStep();
            });
            window.addEventListener('resize', () => {
                buildCrtBarrelMap();
                updateExpandLines();
                if (isCooldownActive() && !isEnteringCooldown) applyCooldownStep();
            });

            const COORD_REGEX = /^(?:[0-6]\d\.\d|70\.0)$/;
            let coordBoxes = [];

            function filledSlotCount(box) {
                let c = 0;
                for (let i = 0; i < 3; i++) {
                    if (box.slots[i] !== null) c++;
                }
                return c;
            }

            function isBoxOutOfRange(box) {
                const s0 = box.slots[0];
                const s1 = box.slots[1];
                const s2 = box.slots[2];
                if (s0 !== null) {
                    const d0 = parseInt(s0, 10);
                    if (d0 > 7) return true;
                    if (d0 === 7) {
                        if (s1 !== null && parseInt(s1, 10) > 0) return true;
                        if (s2 !== null && parseInt(s2, 10) > 0) return true;
                    }
                }
                return false;
            }

            function renderCoordBox(box) {
                const hasAny = filledSlotCount(box) > 0;
                box.el.classList.toggle('is-focused', box.focused);
                box.el.classList.toggle('is-invalid', box.invalid);
                box.el.classList.toggle('has-any', hasAny);

                for (let i = 0; i < 3; i++) {
                    const sEl = box.slotEls[i];
                    const val = box.slots[i];
                    sEl.textContent = val !== null ? val : '0';
                    sEl.classList.toggle('is-filled', val !== null);
                    sEl.classList.toggle('is-active', box.focused && box.activeSlot === i);
                }
            }

            function focusCoordBox(box, slotIndex) {
                if (isCooldownActive()) return;
                box.activeSlot = Math.max(0, Math.min(2, slotIndex));
                box.focused = true;
                renderCoordBox(box);
                box.inputEl.focus();
            }

            function normalizeBoxSlots(box) {
                if (isBoxOutOfRange(box)) return null;

                const s = box.slots;
                const count = filledSlotCount(box);
                if (count === 0) return null;

                let d0 = s[0];
                let d1 = s[1];
                let d2 = s[2];

                if (d0 !== null && d1 === null && d2 === null) {
                    if (d0 === '7') {
                        d1 = '0';
                        d2 = '0';
                    } else {
                        d1 = d0;
                        d0 = '0';
                        d2 = '0';
                    }
                } else if (d0 !== null && d1 !== null && d2 === null) {
                    d2 = '0';
                } else if (d0 === null && d1 !== null && d2 !== null) {
                    d0 = '0';
                } else if (d0 === null && d1 === null && d2 !== null) {
                    d0 = '0';
                    d1 = '0';
                } else if (d0 !== null && d1 === null && d2 !== null) {
                    d1 = d0;
                    d0 = '0';
                } else if (d0 === null && d1 !== null && d2 === null) {
                    d0 = '0';
                    d2 = '0';
                }

                const formatted = d0 + d1 + '.' + d2;
                if (!COORD_REGEX.test(formatted)) return null;
                return { formatted, slots: [d0, d1, d2] };
            }

            function normalizeCoordString(raw) {
                const s = (raw || '').trim();
                if (!s) return null;
                if (!/^\d{1,2}(?:\.\d?)?$/.test(s)) return null;
                const parts = s.split('.');
                const wholeNum = parseInt(parts[0], 10);
                const decNum = parts[1] ? parseInt(parts[1], 10) : 0;
                if (isNaN(wholeNum) || isNaN(decNum)) return null;
                const total = wholeNum + decNum / 10;
                if (total < 0 || total > 70) return null;
                const formatted = String(wholeNum).padStart(2, '0') + '.' + String(decNum);
                return COORD_REGEX.test(formatted) ? formatted : null;
            }

            function applyCharToBox(box, ch, otherBox, isFirstBox) {
                if (isCooldownActive() || !/[\d.]/.test(ch)) return;

                const prevCount = filledSlotCount(box);
                const pos = box.activeSlot;

                if (ch === '.') {
                    if (prevCount < 3) {
                        if (pos === 1 && box.slots[0] !== null && box.slots[1] === null) {
                            if (box.slots[0] === '7') {
                                box.slots[1] = '0';
                            } else {
                                box.slots[1] = box.slots[0];
                                box.slots[0] = '0';
                            }
                            box.activeSlot = 2;
                        } else if (pos < 2) {
                            box.activeSlot = 2;
                        }
                    } else if (pos < 2) {
                        box.activeSlot = 2;
                    }
                    box.invalid = isBoxOutOfRange(box);
                    if (!box.invalid) document.getElementById('coord-error').textContent = '';
                    else playTerminalErrorSound();
                    renderCoordBox(box);
                    playReedSwitchClick();
                    return;
                }

                if (prevCount === 3) {
                    box.slots[pos] = ch;
                    if (pos < 2) {
                        box.activeSlot = pos + 1;
                    }
                } else {
                    if (box.slots[pos] === null) {
                        box.slots[pos] = ch;
                    } else {
                        let rightEmpty = -1;
                        for (let i = pos + 1; i < 3; i++) {
                            if (box.slots[i] === null) {
                                rightEmpty = i;
                                break;
                            }
                        }
                        if (rightEmpty !== -1) {
                            for (let k = rightEmpty; k > pos; k--) {
                                box.slots[k] = box.slots[k - 1];
                            }
                            box.slots[pos] = ch;
                        } else {
                            let leftEmpty = -1;
                            for (let i = pos - 1; i >= 0; i--) {
                                if (box.slots[i] === null) {
                                    leftEmpty = i;
                                    break;
                                }
                            }
                            if (leftEmpty !== -1) {
                                for (let k = leftEmpty; k < pos; k++) {
                                    box.slots[k] = box.slots[k + 1];
                                }
                                box.slots[pos] = ch;
                            }
                        }
                    }

                    if (pos < 2) {
                        box.activeSlot = pos + 1;
                    }
                }

                box.invalid = isBoxOutOfRange(box);
                if (!box.invalid) document.getElementById('coord-error').textContent = '';
                else playTerminalErrorSound();

                renderCoordBox(box);
                playReedSwitchClick();

                if (isFirstBox && !box.invalid && prevCount < 3 && filledSlotCount(box) === 3 && otherBox) {
                    focusCoordBox(otherBox, 0);
                }
            }

            function initCoordBox(boxId, inputId, isFirstBox) {
                const el = document.getElementById(boxId);
                const inputEl = document.getElementById(inputId);
                const slotEls = [
                    el.querySelector('[data-slot="0"]'),
                    el.querySelector('[data-slot="1"]'),
                    el.querySelector('[data-slot="2"]')
                ];
                return {
                    el,
                    inputEl,
                    slotEls,
                    slots: [null, null, null],
                    activeSlot: 0,
                    focused: false,
                    invalid: false,
                    isFirstBox
                };
            }

            function bindCoordBoxEvents(box, otherBox) {
                const { inputEl, slotEls, isFirstBox } = box;

                inputEl.addEventListener('mousedown', (e) => {
                    if (isCooldownActive()) return;
                    playReedSwitchClick();
                    const r0 = slotEls[0].getBoundingClientRect();
                    const r1 = slotEls[1].getBoundingClientRect();
                    const r2 = slotEls[2].getBoundingClientRect();
                    const c0 = r0.left + r0.width * 0.5;
                    const c1 = r1.left + r1.width * 0.5;
                    const c2 = r2.left + r2.width * 0.5;
                    const x = e.clientX;
                    const d0 = Math.abs(x - c0);
                    const d1 = Math.abs(x - c1);
                    const d2 = Math.abs(x - c2);
                    if (d0 <= d1 && d0 <= d2) box.activeSlot = 0;
                    else if (d1 <= d2) box.activeSlot = 1;
                    else box.activeSlot = 2;
                    renderCoordBox(box);
                });

                inputEl.addEventListener('focus', () => {
                    if (isCooldownActive()) {
                        inputEl.blur();
                        return;
                    }
                    box.focused = true;
                    renderCoordBox(box);
                });

                inputEl.addEventListener('blur', () => {
                    box.focused = false;
                    if (filledSlotCount(box) > 0) {
                        const norm = normalizeBoxSlots(box);
                        if (norm) {
                            box.slots = norm.slots;
                            box.invalid = false;
                        } else {
                            box.invalid = true;
                        }
                    } else {
                        box.invalid = false;
                    }
                    renderCoordBox(box);
                });

                inputEl.addEventListener('beforeinput', (e) => {
                    if (isCooldownActive()) {
                        e.preventDefault();
                        return;
                    }
                    if (e.inputType === 'insertFromPaste') return;
                    if (e.inputType === 'insertText' && e.data) {
                        e.preventDefault();
                        for (let i = 0; i < e.data.length; i++) {
                            applyCharToBox(box, e.data[i], otherBox, isFirstBox);
                        }
                    }
                });

                inputEl.addEventListener('input', () => {
                    const raw = inputEl.value;
                    inputEl.value = '';
                    if (!raw || isCooldownActive()) return;
                    for (let i = 0; i < raw.length; i++) {
                        applyCharToBox(box, raw[i], otherBox, isFirstBox);
                    }
                });

                inputEl.addEventListener('paste', (e) => {
                    e.preventDefault();
                    if (isCooldownActive()) return;
                    const text = (e.clipboardData || window.clipboardData).getData('text') || '';
                    const norm = normalizeCoordString(text);
                    const prevCount = filledSlotCount(box);
                    if (norm) {
                        box.slots = [norm[0], norm[1], norm[3]];
                        box.activeSlot = 2;
                        box.invalid = false;
                        document.getElementById('coord-error').textContent = '';
                        renderCoordBox(box);
                        playReedSwitchClick();
                        if (isFirstBox && prevCount < 3 && otherBox) {
                            focusCoordBox(otherBox, 0);
                        }
                    } else {
                        for (let i = 0; i < text.length; i++) {
                            applyCharToBox(box, text[i], otherBox, isFirstBox);
                        }
                    }
                });

                inputEl.addEventListener('keydown', (e) => {
                    if (isCooldownActive()) {
                        e.preventDefault();
                        return;
                    }
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = Math.max(0, box.activeSlot - 1);
                        renderCoordBox(box);
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = Math.min(2, box.activeSlot + 1);
                        renderCoordBox(box);
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = 0;
                        renderCoordBox(box);
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.activeSlot = 2;
                        renderCoordBox(box);
                    } else if (e.key === 'Backspace') {
                        e.preventDefault();
                        playReedSwitchClick();
                        if (box.slots[box.activeSlot] !== null) {
                            box.slots[box.activeSlot] = null;
                        } else if (box.activeSlot > 0) {
                            box.activeSlot--;
                            box.slots[box.activeSlot] = null;
                        } else if (!isFirstBox && filledSlotCount(box) === 0 && otherBox) {
                            focusCoordBox(otherBox, 2);
                            return;
                        }
                        box.invalid = isBoxOutOfRange(box);
                        if (!box.invalid) document.getElementById('coord-error').textContent = '';
                        else playTerminalErrorSound();
                        renderCoordBox(box);
                    } else if (e.key === 'Delete') {
                        e.preventDefault();
                        playReedSwitchClick();
                        box.slots[box.activeSlot] = null;
                        box.invalid = isBoxOutOfRange(box);
                        if (!box.invalid) document.getElementById('coord-error').textContent = '';
                        else playTerminalErrorSound();
                        renderCoordBox(box);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        playSovietRelayClunk();
                        triggerCoordinateLookup();
                    } else if (e.key === ',' && isFirstBox && otherBox) {
                        e.preventDefault();
                        playReedSwitchClick();
                        focusCoordBox(otherBox, 0);
                    }
                });

                renderCoordBox(box);
            }

            function escapeHTML(str) {
                return (str || '').toString()
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function isSafeUrl(url) {
                const u = (url || '').trim();
                if (!u) return false;
                if (/^(https?:\/\/|\/|\.\/|\.\.\/)/i.test(u)) return true;
                if (/^data:(image|video|audio)\/[a-z0-9.+-]+;base64,/i.test(u)) return true;
                return false;
            }

            function buildMorseTimeline(morseStr) {
                const UNIT = 0.075;
                const tones = [];
                const clean = (morseStr || '').trim().replace(/\r?\n/g, ' / ');
                let t = 0;
                let i = 0;

                while (i < clean.length) {
                    const ch = clean[i];
                    if (ch === '.') {
                        tones.push({ start: t, end: t + UNIT });
                        t += UNIT * 2;
                    } else if (ch === '-') {
                        tones.push({ start: t, end: t + UNIT * 3 });
                        t += UNIT * 4;
                    } else if (ch === '/') {
                        t += UNIT * 4;
                    } else if (ch === ' ' || ch === '\t') {
                        while (i + 1 < clean.length && (clean[i + 1] === ' ' || clean[i + 1] === '\t')) i++;
                        t += UNIT * 2;
                    }
                    i++;
                }
                return { tones, totalSec: t };
            }

            let activePlayback = null;

            function stopMorsePlayback() {
                if (!activePlayback) return;
                const prev = activePlayback;
                activePlayback = null;

                if (prev.pollId) clearInterval(prev.pollId);
                if (prev.osc && prev.gain && audioCtx) {
                    try {
                        const now = audioCtx.currentTime;
                        prev.gain.gain.cancelScheduledValues(now);
                        prev.gain.gain.setValueAtTime(prev.gain.gain.value, now);
                        prev.gain.gain.linearRampToValueAtTime(0, now + 0.008);
                        prev.osc.stop(now + 0.012);
                    } catch (e) {}
                }

                const btn = document.getElementById('morse-btn-' + prev.id);
                const status = document.getElementById('morse-carrier-' + prev.id);
                if (btn) {
                    btn.textContent = 'ПУСК';
                    btn.classList.remove('is-playing');
                }
                if (status) {
                    status.textContent = 'ОЖИДАНИЕ';
                    status.classList.remove('is-tx');
                }
            }

            function toggleMorsePlayback(packetId) {
                playSovietRelayClunk();
                if (activePlayback && activePlayback.id === packetId) {
                    stopMorsePlayback();
                    return;
                }

                stopMorsePlayback();
                stopPipPlayback();
                stopE07Playback();

                const packet = currentPackets.find(p => p.id === packetId);
                if (!packet) return;

                const { tones, totalSec } = buildMorseTimeline(packet.content || '');
                if (!tones.length || totalSec <= 0) return;

                const ctx = ensureAudioContext();
                if (!ctx) return;

                const startAt = ctx.currentTime + 0.02;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(640, startAt);
                gain.gain.setValueAtTime(0, startAt);

                for (let i = 0; i < tones.length; i++) {
                    const t0 = startAt + tones[i].start;
                    const t1 = startAt + tones[i].end;
                    gain.gain.setValueAtTime(0, t0);
                    gain.gain.linearRampToValueAtTime(0.18, t0 + 0.004);
                    gain.gain.setValueAtTime(0.18, Math.max(t0 + 0.004, t1 - 0.004));
                    gain.gain.linearRampToValueAtTime(0, t1);
                }

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startAt);
                osc.stop(startAt + totalSec + 0.02);

                const btn = document.getElementById('morse-btn-' + packetId);
                const status = document.getElementById('morse-carrier-' + packetId);
                if (btn) {
                    btn.textContent = 'СТОП';
                    btn.classList.add('is-playing');
                }
                if (status) {
                    status.textContent = '(НЕСУЩАЯ: НИЗКАЯ)';
                    status.classList.add('is-tx');
                }

                const state = { id: packetId, osc, gain, pollId: null };
                activePlayback = state;

                state.pollId = setInterval(() => {
                    if (activePlayback !== state) return;
                    const elapsed = ctx.currentTime - startAt;
                    if (elapsed >= totalSec) {
                        stopMorsePlayback();
                        return;
                    }
                    let high = false;
                    for (let i = 0; i < tones.length; i++) {
                        if (elapsed >= tones[i].start && elapsed <= tones[i].end) {
                            high = true;
                            break;
                        }
                        if (tones[i].start > elapsed) break;
                    }
                    const sEl = document.getElementById('morse-carrier-' + packetId);
                    if (sEl) {
                        sEl.textContent = high ? '(НЕСУЩАЯ: ВЫСОКАЯ)' : '(НЕСУЩАЯ: НИЗКАЯ)';
                    }
                }, 30);
            }

            let pipState = { playing: false, phase: 'standby', audioEl: null, fallbackTimer: null, synthTimer: null, noiseNode: null, noiseGain: null, qsbOsc: null };

            function isPipDaytimeUtc(now) {
                const m = now.getUTCMonth() + 1;
                const mins = now.getUTCHours() * 60 + now.getUTCMinutes();
                if (m === 12 || m <= 2) return mins >= 330 && mins < 840;
                if (m >= 3 && m <= 5) return mins >= 265 && mins < 960;
                if (m >= 6 && m <= 8) return mins >= 210 && mins < 930;
                return mins >= 210 && mins < 870;
            }

            function updatePipUI() {
                const btn = document.getElementById('pip-toggle-btn');
                const statusEl = document.getElementById('pip-status');
                const barEl = document.getElementById('pip-radio-bar');

                if (btn) {
                    if (pipState.playing) {
                        btn.textContent = 'ОТБОЙ';
                        btn.classList.add('is-playing');
                    } else {
                        btn.textContent = 'ПРИЁМ';
                        btn.classList.remove('is-playing');
                    }
                }

                if (barEl) {
                    barEl.classList.toggle('is-connecting', pipState.playing && pipState.phase === 'connecting');
                    barEl.classList.toggle('is-live', pipState.playing && pipState.phase === 'live');
                }

                if (statusEl) {
                    if (!pipState.playing) {
                        statusEl.textContent = 'ОЖИДАНИЕ';
                        statusEl.classList.remove('is-active');
                    } else if (pipState.phase === 'connecting') {
                        statusEl.textContent = 'УСТАНОВКА СВЯЗИ...';
                        statusEl.classList.add('is-active');
                    } else {
                        statusEl.textContent = 'ПРИЁМ';
                        statusEl.classList.add('is-active');
                    }
                }
            }

            function stopPipPlayback() {
                pipState.playing = false;
                pipState.phase = 'standby';
                stopWaveLoop();

                if (pipState.fallbackTimer) {
                    clearTimeout(pipState.fallbackTimer);
                    pipState.fallbackTimer = null;
                }

                if (pipState.audioEl) {
                    try {
                        pipState.audioEl.pause();
                        pipState.audioEl.removeAttribute('src');
                        pipState.audioEl.load();
                    } catch (e) {}
                    pipState.audioEl = null;
                }

                if (pipState.synthTimer) {
                    clearInterval(pipState.synthTimer);
                    pipState.synthTimer = null;
                }

                if (pipState.noiseNode) {
                    try { pipState.noiseNode.stop(); } catch (e) {}
                    pipState.noiseNode = null;
                }

                if (pipState.qsbOsc) {
                    try { pipState.qsbOsc.stop(); } catch (e) {}
                    pipState.qsbOsc = null;
                }

                pipState.noiseGain = null;
                updatePipUI();
                drawWaveOnce(false, false);
            }

            function startPipSynth() {
                const ctx = ensureAudioContext();
                const analyser = getRadioAnalyser();
                if (!ctx || !analyser || !pipState.playing) return;

                pipState.phase = 'live';
                updatePipUI();

                const bufSize = ctx.sampleRate * 3;
                const noiseBuffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufSize; i++) {
                    const white = Math.random() * 2 - 1;
                    output[i] = (lastOut + 0.04 * white) / 1.04;
                    lastOut = output[i];
                }

                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;

                const bandpass = ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = 1150;
                bandpass.Q.value = 1.4;

                const noiseGain = ctx.createGain();
                noiseGain.gain.value = 0.085;

                const qsbOsc = ctx.createOscillator();
                const qsbGain = ctx.createGain();
                qsbOsc.frequency.value = 0.11;
                qsbGain.gain.value = 0.025;
                qsbOsc.connect(qsbGain);
                qsbGain.connect(noiseGain.gain);

                noise.connect(bandpass);
                bandpass.connect(noiseGain);
                noiseGain.connect(analyser);

                noise.start();
                qsbOsc.start();

                pipState.noiseNode = noise;
                pipState.noiseGain = noiseGain;
                pipState.qsbOsc = qsbOsc;

                function emitPip() {
                    if (!pipState.playing) return;
                    try {
                        const now = ctx.currentTime;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(625, now);

                        gain.gain.setValueAtTime(0, now);
                        gain.gain.linearRampToValueAtTime(0.14, now + 0.008);
                        gain.gain.setValueAtTime(0.14, now + 0.185);
                        gain.gain.linearRampToValueAtTime(0, now + 0.205);

                        osc.connect(gain);
                        gain.connect(analyser);
                        osc.start(now);
                        osc.stop(now + 0.215);
                    } catch (e) {}
                }

                emitPip();
                pipState.synthTimer = setInterval(emitPip, 1200);
            }

            function startPipPlayback() {
                stopMorsePlayback();
                stopE07Playback();
                stopPipPlayback();

                pipState.playing = true;
                pipState.phase = 'connecting';
                updatePipUI();
                startWaveLoop(() => pipState);

                const isDay = isPipDaytimeUtc(new Date());
                const streamUrl = isDay ? PIP_STREAMS.day : PIP_STREAMS.night;
                const isHttpsPage = window.location.protocol === 'https:';
                const isHttpStream = /^http:\/\//i.test(streamUrl);

                if (isHttpsPage && isHttpStream) {
                    startPipSynth();
                    return;
                }

                const ctx = ensureAudioContext();
                const analyser = getRadioAnalyser();

                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.preload = 'none';
                audio.src = streamUrl;
                pipState.audioEl = audio;

                if (ctx && analyser) {
                    try {
                        const mediaSrc = ctx.createMediaElementSource(audio);
                        mediaSrc.connect(analyser);
                    } catch (e) {}
                }

                let fellBack = false;
                pipState.fallbackTimer = setTimeout(() => {
                    pipState.fallbackTimer = null;
                    if (pipState.playing && pipState.audioEl === audio && audio.readyState < 2 && !fellBack) {
                        fellBack = true;

                            audio.pause();
                            audio.removeAttribute('src');

                        pipState.audioEl = null;
                        startPipSynth();
                    }
                }, 1800);

                audio.addEventListener('playing', () => {
                    if (pipState.fallbackTimer) {
                        clearTimeout(pipState.fallbackTimer);
                        pipState.fallbackTimer = null;
                    }
                    if (pipState.playing && pipState.audioEl === audio) {
                        pipState.phase = 'live';
                        updatePipUI();
                    }
                });

                audio.addEventListener('waiting', () => {
                    if (pipState.playing && pipState.audioEl === audio) {
                        pipState.phase = 'connecting';
                        updatePipUI();
                    }
                });

                audio.addEventListener('error', () => {
                    if (pipState.fallbackTimer) {
                        clearTimeout(pipState.fallbackTimer);
                        pipState.fallbackTimer = null;
                    }
                    if (pipState.playing && pipState.audioEl === audio && !fellBack) {
                        fellBack = true;
                        pipState.audioEl = null;
                        startPipSynth();
                    }
                });

                const playPromise = audio.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {
                        if (pipState.fallbackTimer) {
                            clearTimeout(pipState.fallbackTimer);
                            pipState.fallbackTimer = null;
                        }
                        if (pipState.playing && pipState.audioEl === audio && !fellBack) {
                            fellBack = true;
                            pipState.audioEl = null;
                            startPipSynth();
                        }
                    });
                }
            }

            const E07_SLOT_DURATION_MS = 15 * 60 * 1000;
            const E07_FALLBACK_RULES = [
                { day: 2, hour: 15, min: 0,  freqKhz: 17461, label: 'Tue/Fri' },
                { day: 2, hour: 15, min: 20, freqKhz: 16161, label: 'Tue/Fri' },
                { day: 2, hour: 15, min: 40, freqKhz: 14361, label: 'Tue/Fri (traffic)' },
                { day: 5, hour: 15, min: 0,  freqKhz: 17461, label: 'Tue/Fri' },
                { day: 5, hour: 15, min: 20, freqKhz: 16161, label: 'Tue/Fri' },
                { day: 5, hour: 15, min: 40, freqKhz: 14361, label: 'Tue/Fri (traffic)' },
                { day: 4, hour: 10, min: 0,  freqKhz: 17456, label: 'Thu/Sat' },
                { day: 4, hour: 10, min: 20, freqKhz: 16291, label: 'Thu/Sat' },
                { day: 4, hour: 10, min: 40, freqKhz: 14893, label: 'Thu/Sat (traffic)' },
                { day: 6, hour: 10, min: 0,  freqKhz: 17456, label: 'Thu/Sat' },
                { day: 6, hour: 10, min: 20, freqKhz: 16291, label: 'Thu/Sat' },
                { day: 6, hour: 10, min: 40, freqKhz: 14893, label: 'Thu/Sat (traffic)' }
            ];

            let e07State = {
                schedule: null,
                countdownTimer: null,
                playing: false,
                phase: 'standby',
                audioEl: null,
                fallbackTimer: null,
                synthTimer: null,
                noiseNode: null,
                toneOsc: null,
                qsbOsc: null

            function computeLocalE07Schedule(nowMs) {
                const baseDate = new Date(nowMs);
                const startDayMs = Date.UTC(baseDate.getUTCFullYear(), baseDate.getUTCMonth(), baseDate.getUTCDate() - 1, 0, 0, 0, 0);
                const slots = [];
                for (let dOffset = 0; dOffset <= 9; dOffset++) {
                    const dayMs = startDayMs + dOffset * 86400000;
                    const dow = new Date(dayMs).getUTCDay();
                    for (const rule of E07_FALLBACK_RULES) {
                        if (rule.day === dow) {
                            const startUtcMs = dayMs + (rule.hour * 60 + rule.min) * 60000;
                            slots.push({
                                startUtcMs,
                                endUtcMs: startUtcMs + E07_SLOT_DURATION_MS,
                                freqKhz: rule.freqKhz,
                                mode: 'USB',
                                label: rule.label,
                                remarks: ''
                            });
                        }
                    }
                }
                slots.sort((a, b) => a.startUtcMs - b.startUtcMs);
                const activeSlot = slots.find(s => nowMs >= s.startUtcMs && nowMs < s.endUtcMs) || null;
                const upcoming = slots.filter(s => s.startUtcMs > nowMs).slice(0, 6);
                return {
                    station: 'E07',
                    name: 'English Man',
                    nowUtcMs: nowMs,
                    active: !!activeSlot,
                    activeSlot,
                    nextSlot: upcoming[0] || null,
                    upcoming,
                    source: 'local-fallback'
                };
            }

            async function fetchE07Schedule() {
                const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const t = ac ? setTimeout(() => ac.abort(), 3200) : null;
                try {
                    const res = await fetch(`${WORKER_BASE}?station=e07&action=schedule`, {
                        signal: ac ? ac.signal : undefined,
                        cache: 'no-store'
                    });
                    if (t) clearTimeout(t);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.station === 'E07') {
                            return data;
                        }
                    }
                } catch (e) {
                    if (t) clearTimeout(t);
                }
                return computeLocalE07Schedule(Date.now());
            }

            function formatUtcSlot(ms) {
                const d = new Date(ms);
                const dd = String(d.getUTCDate()).padStart(2, '0');
                const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
                const hh = String(d.getUTCHours()).padStart(2, '0');
                const mm = String(d.getUTCMinutes()).padStart(2, '0');
                return `${dd}.${mo} ${hh}:${mm} UTC`;
            }

            function formatCountdownHHMM(diffMs) {
                if (diffMs <= 0) return '00:00';
                const totalMins = diffMs < 60000 ? 1 : Math.floor(diffMs / 60000);
                const hh = String(Math.floor(totalMins / 60)).padStart(2, '0');
                const mm = String(totalMins % 60).padStart(2, '0');
                return `${hh}:${mm}`;
            }

            function stopE07Countdown() {
                if (e07State.countdownTimer) {
                    clearInterval(e07State.countdownTimer);

                    barEl.classList.toggle('is-connecting', e07State.playing && e07State.phase === 'connecting');
                    barEl.classList.toggle('is-live', e07State.playing && e07State.phase === 'live');
                }

                if (statusEl) {
                    if (!e07State.playing) {
                        statusEl.textContent = 'ОЖИДАНИЕ';
                        statusEl.classList.remove('is-active');
                    } else if (e07State.phase === 'connecting') {
                        statusEl.textContent = 'УСТАНОВКА СВЯЗИ...';

            function stopE07Playback(keepTimer) {
                if (!keepTimer) stopE07Countdown();
                e07State.playing = false;
                e07State.phase = 'standby';
                stopWaveLoop();

                if (e07State.fallbackTimer) {
                    clearTimeout(e07State.fallbackTimer);
                    e07State.fallbackTimer = null;
                }

                if (e07State.audioEl) {
                    try {
                        e07State.audioEl.pause();
                        e07State.audioEl.removeAttribute('src');
                        e07State.audioEl.load();
                    } catch (e) {}
                    e07State.audioEl = null;
                }

                if (e07State.synthTimer) {
                    clearInterval(e07State.synthTimer);
                    e07State.synthTimer = null;
                }

                if (e07State.noiseNode) {
                    try { e07State.noiseNode.stop(); } catch (e) {}
                    e07State.noiseNode = null;
                }

                if (e07State.toneOsc) {
                    try { e07State.toneOsc.stop(); } catch (e) {}
                    e07State.toneOsc = null;
                }

                if (e07State.qsbOsc) {
                    try { e07State.qsbOsc.stop(); } catch (e) {}
                    e07State.qsbOsc = null;
                }

                updateE07UI();
                drawWaveOnce(false, false);
            }

            function startE07Synth() {
                const ctx = ensureAudioContext();
                const analyser = getRadioAnalyser();
                if (!ctx || !analyser || !e07State.playing) return;

                e07State.phase = 'live';
                updateE07UI();

                const bufSize = ctx.sampleRate * 3;
                const noiseBuffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufSize; i++) {
                    const white = Math.random() * 2 - 1;
                    output[i] = (lastOut + 0.055 * white) / 1.055;
                    lastOut = output[i];
                }

                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;

                const bandpass = ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = 1350;
                bandpass.Q.value = 1.1;

                const noiseGain = ctx.createGain();
                noiseGain.gain.value = 0.095;

                const qsbOsc = ctx.createOscillator();
                const qsbGain = ctx.createGain();
                qsbOsc.frequency.value = 0.14;
                qsbGain.gain.value = 0.032;
                qsbOsc.connect(qsbGain);
                qsbGain.connect(noiseGain.gain);

                noise.connect(bandpass);
                bandpass.connect(noiseGain);
                noiseGain.connect(analyser);

                const toneOsc = ctx.createOscillator();
                const toneGain = ctx.createGain();
                toneOsc.type = 'sine';
                toneOsc.frequency.value = 1000;
                toneGain.gain.value = 0.025;
                toneOsc.connect(toneGain);
                toneGain.connect(analyser);

                noise.start();
                toneOsc.start();
                qsbOsc.start();

                e07State.noiseNode = noise;
                e07State.toneOsc = toneOsc;
                e07State.qsbOsc = qsbOsc;

                function emitMarkerBurst() {
                    if (!e07State.playing) return;
                    try {
                        const now = ctx.currentTime;
                        const osc = ctx.createOscillator();
                        const g = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1000, now);
                        g.gain.setValueAtTime(0, now);
                        g.gain.linearRampToValueAtTime(0.075, now + 0.02);
                        g.gain.setValueAtTime(0.075, now + 0.34);
                        g.gain.linearRampToValueAtTime(0, now + 0.38);
                        osc.connect(g);
                        g.connect(analyser);
                        osc.start(now);
                        osc.stop(now + 0.4);
                    } catch (e) {}
                }

                emitMarkerBurst();
                e07State.synthTimer = setInterval(emitMarkerBurst, 2200);
            }

            function startE07Playback(freqKhz) {
                stopMorsePlayback();
                stopPipPlayback();
                stopE07Playback(true);

                e07State.playing = true;
                e07State.phase = 'connecting';
                updateE07UI();

                const streamUrl = `${WORKER_BASE}?station=e07&action=stream&freq=${encodeURIComponent(freqKhz || 17461)}`;
                const ctx = ensureAudioContext();
                const analyser = getRadioAnalyser();

                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.preload = 'none';
                audio.src = streamUrl;
                e07State.audioEl = audio;

                if (ctx && analyser) {
                    try {
                        const mediaSrc = ctx.createMediaElementSource(audio);
                        mediaSrc.connect(analyser);
                    } catch (e) {}
                }

                let fellBack = false;
                e07State.fallbackTimer = setTimeout(() => {
                    e07State.fallbackTimer = null;
                    if (e07State.playing && e07State.audioEl === audio && audio.readyState < 2 && !fellBack) {

                            audio.removeAttribute('src');
                        } catch (e) {}
                        e07State.audioEl = null;
                        startE07Synth();

                audio.addEventListener('playing', () => {
                    if (e07State.fallbackTimer) {
                        clearTimeout(e07State.fallbackTimer);
                        e07State.fallbackTimer = null;
                    }
                    if (e07State.playing && e07State.audioEl === audio) {
                        e07State.phase = 'live';
                        updateE07UI();
                    }
                });

                audio.addEventListener('waiting', () => {
                    if (e07State.playing && e07State.audioEl === audio) {
                        e07State.phase = 'connecting';
                        updateE07UI();
                    }
                });

                audio.addEventListener('error', () => {
                    if (e07State.fallbackTimer) {
                        clearTimeout(e07State.fallbackTimer);
                        e07State.fallbackTimer = null;
                    }
                    if (e07State.playing && e07State.audioEl === audio && !fellBack) {
                        fellBack = true;
                        e07State.audioEl = null;
                        startE07Synth();
                    }
                });

                const playPromise = audio.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {
                        if (e07State.fallbackTimer) {
                            clearTimeout(e07State.fallbackTimer);
                            e07State.fallbackTimer = null;
                        }
                        if (e07State.playing && e07State.audioEl === audio && !fellBack) {
                            fellBack = true;
                            e07State.audioEl = null;
                            startE07Synth();
                        }
                    });
                }
            }

            function toggleE07Playback(freqKhz) {
                playSovietRelayClunk();
                if (e07State.playing) {
                    stopE07Playback(true);
                } else {
                    startE07Playback(freqKhz);
                }

            function renderE07Result(scheduleData, animateExpand) {
                stopMorsePlayback();
                stopPipPlayback();
                stopE07Playback(false);

                const sched = scheduleData || computeLocalE07Schedule(Date.now());

                const nextSlot = sched.nextSlot || (Array.isArray(sched.upcoming) ? sched.upcoming.find(s => s.startUtcMs > nowMs) : null);

                if (activeSlot) {
                    const freqLabel = activeSlot.freqKhz ? `${activeSlot.freqKhz} kHz ${activeSlot.mode || 'USB'}` : (activeSlot.mode || 'USB');
                    const activeEndStr = formatUtcSlot(activeSlot.endUtcMs);
                    out.innerHTML = `
                        <div class="signal-frame" id="signal-frame">

                                    </div>
                                    <div class="pip-controls">
                                        <button type="button" id="e07-toggle-btn" class="term-btn pip-btn">ОТБОЙ</button>
                                        <span id="e07-status" class="pip-status is-active">УСТАНОВКА СВЯЗИ...</span>
                                    </div>
                                    <div class="e07-schedule-meta">
                                        <div class="e07-schedule-row">
                                            <span>СТАТУС: ПЕРЕДАЧА АКТИВНА</span>

                                        </div>

                                </div>

                    `;

                    const btn = document.getElementById('e07-toggle-btn');
                    if (btn) btn.addEventListener('click', () => toggleE07Playback(activeSlot.freqKhz));

                    startE07Playback(activeSlot.freqKhz);

                    e07State.countdownTimer = setInterval(async () => {
                        if (!activeCoord || activeCoord.key !== 'coord_70.0_70.0') {
                            stopE07Countdown();
                            return;
                        }
                        if (Date.now() >= activeSlot.endUtcMs) {
                            stopE07Countdown();
                            const refreshed = await fetchE07Schedule();
                            if (activeCoord && activeCoord.key === 'coord_70.0_70.0') {
                                renderE07Result(refreshed, false);
                            }
                        }
                    }, 1000);
                    return;
                }

                const targetMs = nextSlot ? nextSlot.startUtcMs : (nowMs + 3600000);
                const hhmm = formatCountdownHHMM(targetMs - nowMs);
                const nextFreqLabel = nextSlot && nextSlot.freqKhz
                    ? `${nextSlot.freqKhz} kHz ${nextSlot.mode || 'USB'}`
                    : 'USB';
                const upcomingRows = (sched.upcoming || []).slice(0, 4).map(s => {
                    const f = s.freqKhz ? `${s.freqKhz} kHz ${s.mode || 'USB'}` : (s.mode || 'USB');
                    const rem = s.remarks ? ` ${s.remarks}` : '';
                    return `<div class="e07-schedule-row"><span>${escapeHTML(formatUtcSlot(s.startUtcMs))}</span><span class="e07-schedule-muted">${escapeHTML(f + rem)}</span></div>`;
                }).join('');

                out.innerHTML = `
                    <div class="signal-frame" id="signal-frame">
                        <div class="packet-card">
                            <div class="pip-box">
                                <div class="pip-radio-bar" id="e07-radio-bar">
                                    <span>E07 ENGLISH MAN // ${escapeHTML(nextFreqLabel)}</span>
                                    <div class="pip-bars" aria-hidden="true">
                                        <span class="pip-bar pip-bar-1"></span>
                                        <span class="pip-bar pip-bar-2"></span>
                                        <span class="pip-bar pip-bar-3"></span>
                                        <span class="pip-bar pip-bar-4"></span>
                                        <span class="pip-bar pip-bar-5"></span>
                                    </div>
                                </div>
                                <div class="e07-countdown-box" id="e07-countdown-text">
                                    СЛЕДУЮЩИЙ СЕАНС ЧЕРЕЗ ${escapeHTML(hhmm)}
                                </div>
                                <div class="e07-schedule-meta">
                                    <div class="e07-schedule-row">
                                        <span>РАСПИСАНИЕ (UTC):</span>
                                        <span class="e07-schedule-muted">ВТ/ПТ 15:00 · ЧТ/СБ 10:00</span>
                                    </div>
                                    ${upcomingRows}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                activateSettledExpand(!!animateExpand);

                e07State.countdownTimer = setInterval(async () => {
                    if (!activeCoord || activeCoord.key !== 'coord_70.0_70.0') {
                        stopE07Countdown();

                        if (activeCoord && activeCoord.key === 'coord_70.0_70.0') {
                            renderE07Result(refreshed, false);

                    if (cdEl) {
                        cdEl.textContent = `СЛЕДУЮЩИЙ СЕАНС ЧЕРЕЗ ${formatCountdownHHMM(diff)}`;
                    }
                }, 1000);
