<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный Селектор Записей</title>
    <link rel="icon" href="assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <style>
        @font-face {
            font-family: 'OCR A Becker RUS-LAT';
            src: url('assets/fonts/OCR%20A%20Becker%20RUS-LAT.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #000000;
            --fg: #33ff66;
            --bright: #7dff9e;
            --muted: #1b8a38;
            --dim: #0c3b18;
            --border: #1e9e40;
            --err: #ff4d4d;
            --glow: rgba(51, 255, 102, 0.24);
            --bezel-border: rgba(51, 255, 102, 0.18);
            --bezel-glow: rgba(51, 255, 102, 0.12);
            --line-stroke: rgba(51, 255, 102, 0.34);
            --axis-line: rgba(51, 255, 102, 0.42);
            --axis-glow: rgba(51, 255, 102, 0.35);
            --settled-border: rgba(125, 255, 158, 0.85);
            --settled-bg: rgba(51, 255, 102, 0.08);
            --settled-glow: rgba(51, 255, 102, 0.55);
            --slot-empty: #104d20;
            --slot-active-bg: rgba(51, 255, 102, 0.12);
            --card-bg: rgba(1, 8, 3, 0.94);
            --morse-bg: #020a04;
            --editor-bg: rgba(1, 10, 4, 0.94);
            --btn-hover-bg: #041408;
            --btn-active-bg: #092610;
        }

        .crt-stage.is-cooldown {
            --fg: #d8d8d8;
            --bright: #ffffff;
            --muted: #7a7a7a;
            --dim: #3d3d3d;
            --border: #9e9e9e;
            --err: #e0e0e0;
            --glow: rgba(255, 255, 255, 0.24);
            --bezel-border: rgba(255, 255, 255, 0.24);
            --bezel-glow: rgba(255, 255, 255, 0.12);
            --line-stroke: rgba(255, 255, 255, 0.36);
            --axis-line: rgba(255, 255, 255, 0.44);
            --axis-glow: rgba(255, 255, 255, 0.35);
            --settled-border: rgba(255, 255, 255, 0.85);
            --settled-bg: rgba(255, 255, 255, 0.08);
            --settled-glow: rgba(255, 255, 255, 0.55);
            --slot-empty: #4a4a4a;
            --slot-active-bg: rgba(255, 255, 255, 0.12);
            --card-bg: rgba(12, 12, 12, 0.94);
            --morse-bg: #0d0d0d;
            --editor-bg: rgba(14, 14, 14, 0.94);
            --btn-hover-bg: #181818;
            --btn-active-bg: #262626;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0;
            font-family: 'OCR A Becker RUS-LAT', monospace;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        html, body {
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            line-height: 1.6;
            text-shadow: 0 0 6px var(--glow);
            -webkit-font-smoothing: antialiased;
        }

        .crt-svg-defs {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .crt-stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            filter: url(#crt-barrel);
        }

        .crt-bezel {
            position: fixed;
            inset: 14px;
            border: 2px solid var(--bezel-border);
            box-shadow: 0 0 6px var(--bezel-glow);
            overflow: hidden;
            background: #000000;
            z-index: 1;
        }

        .crt-stage.is-cooldown .crt-bezel {
            animation: bezelRedFlash 1.4s ease-in-out infinite;
        }

        @keyframes bezelRedFlash {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.34);
                box-shadow: 0 0 9px rgba(255, 255, 255, 0.22);
            }
            50% {
                border-color: rgba(255, 255, 255, 0.14);
                box-shadow: 0 0 3px rgba(255, 255, 255, 0.06);
            }
        }

        .crt-cooldown-tint {
            position: fixed;
            inset: 14px;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: multiply;
            display: none;
        }

        .crt-stage.is-cooldown .crt-cooldown-tint {
            display: block;
        }

        .crt-bezel-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.85),
                inset 0 0 28px var(--bezel-glow);
        }

        .crt-expand-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: none;
        }

        .crt-expand-svg.is-visible {
            display: block;
        }

        .crt-expand-svg line {
            stroke: var(--line-stroke);
            stroke-width: 1.5;
        }

        .crt-axis-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            display: none;
        }

        .crt-axis-layer.is-active {
            display: block;
        }

        .crt-axis-layer.is-locked-only .crt-axis-x,
        .crt-axis-layer.is-locked-only .crt-axis-y {
            display: none;
        }

        .crt-axis-x {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 1.5px;
            background: var(--axis-line);
            box-shadow: 0 0 6px var(--axis-glow);
            will-change: left;
        }

        .crt-axis-y {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 1.5px;
            background: var(--axis-line);
            box-shadow: 0 0 6px var(--axis-glow);
            will-change: top;
        }

        .crt-axis-target {
            position: absolute;
            left: 0;
            top: 0;
            width: 14px;
            height: 14px;
            margin-left: -6.25px;
            margin-top: -6.25px;
            border: 1.5px solid var(--bright);
            box-shadow: 0 0 8px var(--glow);
            will-change: left, top;
        }

        .crt-axis-target.is-flashing {
            animation: targetFlash 0.13s steps(1, end) infinite;
        }

        .crt-axis-target.is-settled {
            border-color: var(--settled-border);
            box-shadow: 0 0 10px var(--settled-glow);
            background: var(--settled-bg);
        }

        @keyframes targetFlash {
            0% {
                opacity: 1;
                background: var(--settled-bg);
                box-shadow: 0 0 14px var(--settled-glow);
            }
            50% {
                opacity: 0.2;
                background: transparent;
                box-shadow: none;
            }
            100% {
                opacity: 1;
                background: var(--settled-bg);
                box-shadow: 0 0 14px var(--settled-glow);
            }
        }

        .cooldown-header {
            position: absolute;
            top: 6%;
            left: 20px;
            right: 20px;
            z-index: 6;
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .crt-stage.is-cooldown .cooldown-header {
            display: flex;
        }

        .cooldown-banner {
            padding: 6px 14px;
            text-align: center;
            font-size: clamp(12px, 2vw, 17px);
            letter-spacing: 1.2px;
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
            background: rgba(0, 0, 0, 0.78);
        }

        .cooldown-banner.is-red-zone {
            animation: bannerRedFlash 1.4s ease-in-out infinite;
        }

        @keyframes bannerRedFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.54; }
        }

        .cooldown-skip-btn {
            display: none;
            margin-top: 8px;
            pointer-events: auto;
        }

        .crt-stage.is-cooldown.is-owner .cooldown-skip-btn {
            display: inline-block;
        }

        .crt-scroll {
            position: relative;
            z-index: 4;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .crt-stage.is-cooldown .crt-scroll {
            padding-top: 96px;
        }

        .terminal-shell {
            margin: auto 0;
            max-width: 760px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .coord-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .coord-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .crt-stage.is-cooldown .coord-row {
            opacity: 0.45;
            pointer-events: none;
        }

        .crt-stage.is-cooldown .coord-error {
            visibility: hidden;
        }

        .coord-box {
            position: relative;
            width: 122px;
            height: 49px;
            background: #000000;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 3px var(--bezel-glow), inset 0 0 12px var(--slot-active-bg);
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
            user-select: none;
            cursor: text;
        }

        .coord-box.is-focused {
            border-color: var(--bright);
            box-shadow: 0 0 10px var(--glow);
        }

        .coord-box.is-invalid {
            border-color: var(--err);
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.24);
        }

        .coord-box.is-invalid .coord-slot.is-filled,
        .coord-box.is-invalid .coord-dot {
            color: var(--err);
            text-shadow: 0 0 6px rgba(255, 77, 77, 0.35);
        }

        .coord-slots {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            pointer-events: none;
        }

        .coord-slot {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 19px;
            height: 28px;
            color: var(--slot-empty);
            text-shadow: none;
        }

        .coord-slot.is-filled {
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
        }

        .coord-dot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 28px;
            color: var(--slot-empty);
            text-shadow: none;
        }

        .coord-box.has-any .coord-dot {
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
        }

        .coord-slot.is-active {
            background: var(--slot-active-bg);
        }

        .coord-slot.is-active::after {
            content: '_';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -4px;
            text-align: center;
            color: var(--bright);
            text-shadow: 0 0 8px var(--glow);
            animation: cmdCursorBlink 0.72s steps(1, end) infinite;
        }

        .coord-box.is-invalid .coord-slot.is-active::after {
            color: var(--err);
            text-shadow: 0 0 6px rgba(255, 77, 77, 0.45);
        }

        @keyframes cmdCursorBlink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .coord-native-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            border: none;
            outline: none;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            font-size: 22px;
            z-index: 2;
            cursor: text;
        }

        .term-btn {
            background: #000000;
            color: var(--fg);
            border: 2px solid var(--border);
            padding: 10px 18px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            text-shadow: 0 0 6px var(--glow);
            box-shadow: 0 0 3px var(--bezel-glow);
            transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
        }

        .term-btn:hover {
            border-color: var(--bright);
            color: var(--bright);
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .term-btn:active {
            background: var(--btn-active-bg);
        }

        .term-btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-width: 1.5px;
        }

        .term-btn-danger {
            color: var(--err);
            border-color: #7a2626;
            text-shadow: none;
            box-shadow: 0 0 3px rgba(122, 38, 38, 0.4);
        }

        .term-btn-danger:hover {
            border-color: var(--err);
            color: var(--err);
            background: #140505;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.24);
        }

        .crt-stage.is-cooldown .term-btn-danger {
            border-color: var(--border);
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .crt-stage.is-cooldown .term-btn-danger:hover {
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .coord-submit-btn {
            height: 49px;
        }

        .coord-error {
            margin-top: 10px;
            font-size: 12px;
            color: var(--err);
            text-align: center;
            min-height: 18px;
            text-shadow: 0 0 6px rgba(255, 77, 77, 0.25);
        }

        .signal-output {
            width: 100%;
            display: none;
            margin-top: 22px;
        }

        .signal-output.is-visible {
            display: block;
        }

        .signal-frame {
            width: 100%;
            background: #000000;
            border: 2px solid var(--border);
            padding: 16px;
            box-shadow: 0 0 8px var(--bezel-glow);
            transform-origin: center center;
        }

        .awaiting-box {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .beacon-svg {
            width: 120px;
            height: 64px;
            display: block;
            overflow: visible;
            filter: drop-shadow(0 0 4px var(--axis-glow));
        }

        .beacon-svg path {
            stroke: var(--fg);
        }

        .beacon-svg circle {
            fill: var(--bright);
        }

        .beacon-dot {
            animation: dotStep 0.72s steps(1, end) infinite;
        }

        .beacon-wave-1 {
            animation: waveStep1 0.72s steps(1, end) infinite;
        }

        .beacon-wave-2 {
            animation: waveStep2 0.72s steps(1, end) infinite;
        }

        .beacon-wave-3 {
            animation: waveStep3 0.72s steps(1, end) infinite;
        }

        @keyframes dotStep {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        @keyframes waveStep1 {
            0% { opacity: 1; }
            45% { opacity: 0.1; }
            100% { opacity: 1; }
        }

        @keyframes waveStep2 {
            0% { opacity: 0.1; }
            22% { opacity: 1; }
            68% { opacity: 0.1; }
            100% { opacity: 0.1; }
        }

        @keyframes waveStep3 {
            0% { opacity: 0.1; }
            45% { opacity: 1; }
            88% { opacity: 0.1; }
            100% { opacity: 0.1; }
        }

        .owner-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }

        .empty-signal {
            padding: 14px;
            color: var(--fg);
            font-size: 14px;
            text-align: center;
        }

        .packets-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .packet-card {
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            padding: 16px 18px;
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .packet-owner-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1.5px solid var(--dim);
            padding-bottom: 10px;
            margin-bottom: 14px;
            font-size: 11px;
            color: var(--muted);
        }

        .idx-inline-wrap {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .idx-input {
            width: 58px;
            background: #000000;
            color: var(--bright);
            border: 1.5px solid var(--border);
            padding: 3px 6px;
            font-size: 11px;
            text-align: center;
            outline: none;
        }

        .idx-input::-webkit-outer-spin-button,
        .idx-input::-webkit-inner-spin-button,
        #ed-index::-webkit-outer-spin-button,
        #ed-index::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .idx-input,
        #ed-index {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .idx-input:focus {
            border-color: var(--bright);
        }

        .packet-text {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.75;
            color: var(--fg);
        }

        .morse-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .morse-code-display {
            font-size: 15px;
            letter-spacing: 2px;
            line-height: 1.8;
            color: var(--bright);
            word-break: break-word;
            white-space: pre-wrap;
            border: 1.5px solid var(--dim);
            padding: 12px 14px;
            background: var(--morse-bg);
        }

        .morse-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .morse-play-btn {
            min-width: 110px;
        }

        .morse-play-btn.is-playing {
            border-color: var(--err);
            color: var(--err);
            text-shadow: none;
            box-shadow: 0 0 3px rgba(255, 77, 77, 0.4);
        }

        .morse-play-btn.is-playing:hover {
            background: #140505;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.24);
        }

        .crt-stage.is-cooldown .morse-play-btn.is-playing {
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .crt-stage.is-cooldown .morse-play-btn.is-playing:hover {
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .morse-carrier {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .morse-carrier.is-tx {
            color: var(--bright);
        }

        .pip-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pip-radio-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1.5px solid var(--dim);
            padding: 10px 14px;
            background: var(--morse-bg);
            font-size: 13px;
            color: var(--bright);
            letter-spacing: 1px;
        }

        .pip-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .pip-bar {
            width: 3px;
            background: var(--dim);
            transition: background 0.08s ease;
        }

        .pip-bar.is-lit {
            background: var(--bright);
            box-shadow: 0 0 4px var(--glow);
        }

        .pip-bar-1 { height: 4px; }
        .pip-bar-2 { height: 8px; }
        .pip-bar-3 { height: 12px; }
        .pip-bar-4 { height: 16px; }

        .pip-radio-bar.is-connecting .pip-bar {
            animation: pipConnectBlink 0.6s steps(1, end) infinite;
        }

        @keyframes pipConnectBlink {
            0% { background: var(--muted); }
            50% { background: var(--dim); }
            100% { background: var(--muted); }
        }

        .radio-wave-wrap {
            border: 1.5px solid var(--dim);
            background: var(--morse-bg);
            height: 76px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .radio-wave-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .e07-countdown-box {
            border: 1.5px solid var(--dim);
            background: var(--morse-bg);
            padding: 14px 16px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 1.4px;
            color: var(--bright);
        }

        .e07-schedule-meta {
            border: 1.5px solid var(--dim);
            background: var(--morse-bg);
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.8;
            color: var(--fg);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .e07-schedule-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .e07-schedule-muted {
            color: var(--muted);
        }

        .pip-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .pip-btn {
            min-width: 120px;
        }

        .pip-btn.is-playing {
            border-color: var(--err);
            color: var(--err);
            text-shadow: none;
            box-shadow: 0 0 3px rgba(255, 77, 77, 0.4);
        }

        .pip-btn.is-playing:hover {
            background: #140505;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.24);
        }

        .crt-stage.is-cooldown .pip-btn.is-playing {
            box-shadow: 0 0 3px var(--bezel-glow);
        }

        .crt-stage.is-cooldown .pip-btn.is-playing:hover {
            background: var(--btn-hover-bg);
            box-shadow: 0 0 10px var(--glow);
        }

        .pip-status {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .pip-status.is-active {
            color: var(--bright);
        }

        .media-stack {
            display: flex;
            flex-direction: column;

                    rms = Math.sqrt(sum / waveData.length);
                }

                let activeCount = 1;
                if (rms > 0.02) activeCount = 2;
                if (rms > 0.05) activeCount = 3;
                if (rms > 0.09) activeCount = 4;

                bars.forEach((b, idx) => {
                    if (b) b.classList.toggle('is-lit', idx < activeCount);
                });
            }

            function drawWaveOnce(isLive, isConnecting) {
                const canvas = document.getElementById('radio-wave-canvas');
                if (!canvas) return;
                const dpr = Math.min(2, window.devicePixelRatio || 1);
                const w = Math.max(1, canvas.clientWidth);
                const h = Math.max(1, canvas.clientHeight);
                if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                }

                const ctx2d = canvas.getContext('2d');
                if (!ctx2d) return;
                ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx2d.clearRect(0, 0, w, h);

                const stageEl = document.getElementById('crt-stage') || document.documentElement;
                const cs = getComputedStyle(stageEl);
                const dimColor = cs.getPropertyValue('--dim').trim() || '#0c3b18';
                const brightColor = cs.getPropertyValue('--bright').trim() || '#7dff9e';
                const midY = h * 0.5;

                ctx2d.save();
                ctx2d.strokeStyle = dimColor;
                ctx2d.lineWidth = 1;
                ctx2d.beginPath();
                ctx2d.moveTo(0, midY);
                ctx2d.lineTo(w, midY);
                ctx2d.stroke();
                ctx2d.restore();

                if (isLive && radioAnalyser && waveData) {
                    radioAnalyser.getByteTimeDomainData(waveData);
                    ctx2d.save();
                    ctx2d.strokeStyle = brightColor;
                    ctx2d.lineWidth = 1.6;
                    ctx2d.shadowColor = brightColor;
                    ctx2d.shadowBlur = 6;
                    ctx2d.beginPath();
                    const sliceW = w / (waveData.length - 1);
                    for (let i = 0; i < waveData.length; i++) {
                        const v = (waveData[i] - 128) / 128;
                        const y = Math.max(4, Math.min(h - 4, midY + v * (h * 0.44) * 2.1));
                        const x = i * sliceW;
                        if (i === 0) ctx2d.moveTo(x, y);
                        else ctx2d.lineTo(x, y);
                    }
                    ctx2d.stroke();
                    ctx2d.restore();
                } else if (isConnecting) {
                    ctx2d.save();
                    ctx2d.strokeStyle = cs.getPropertyValue('--muted').trim() || '#1b8a38';
                    ctx2d.lineWidth = 1.2;
                    ctx2d.setLineDash([6, 6]);
                    ctx2d.lineDashOffset = -(performance.now() * 0.04) % 12;
                    ctx2d.beginPath();
                    ctx2d.moveTo(0, midY);
                    ctx2d.lineTo(w, midY);
                    ctx2d.stroke();
                    ctx2d.restore();
                }
                updateSignalMeter(isLive, isConnecting);
            }

            function startWaveLoop(getStatusFn) {
                stopWaveLoop();
                function frame() {
                    const canvas = document.getElementById('radio-wave-canvas');
                    if (!canvas) {
                        waveRaf = null;
                        return;
                    }
                    const st = getStatusFn();
                    drawWaveOnce(st.playing && st.phase === 'live', st.playing && st.phase === 'connecting');
                    if (st.playing) {
                        waveRaf = requestAnimationFrame(frame);
                    } else {
                        waveRaf = null;
                    }
                }
                waveRaf = requestAnimationFrame(frame);
            }

            function readRateState() {
                try {
                    const raw = localStorage.getItem(RATE_KEY);
                    if (!raw) return { windowStart: 0, count: 0, cooldownStart: 0, cooldownUntil: 0 };
                    const parsed = JSON.parse(raw);
                    return {
                        windowStart: Number(parsed.windowStart) || 0,
                        count: Number(parsed.count) || 0,
                        cooldownStart: Number(parsed.cooldownStart) || 0,
                        cooldownUntil: Number(parsed.cooldownUntil) || 0
                    };
                } catch (e) {
                    return { windowStart: 0, count: 0, cooldownStart: 0, cooldownUntil: 0 };
                }
            }

            function writeRateState(state) {
                try {
                    localStorage.setItem(RATE_KEY, JSON.stringify(state));
                } catch (e) {}
            }

            function clearRateState() {
                writeRateState({ windowStart: 0, count: 0, cooldownStart: 0, cooldownUntil: 0 });
            }

            function isCooldownActive() {
                const state = readRateState();
                return state.cooldownUntil > Date.now();
            }

            function stopCooldownTimers() {
                stopCooldownAlarmLoop();
                setMainsHumLevel(0.007, 0.4);
                if (cooldownTimer) {
                    clearInterval(cooldownTimer);
                    cooldownTimer = null;
                }
                if (enterAnimTimer) {
                    clearInterval(enterAnimTimer);
                    enterAnimTimer = null;
                }
                isEnteringCooldown = false;
                lastCooldownStepIdx = -1;
            }

            function scheduleWindowReset() {
                if (windowResetTimer) {
                    clearTimeout(windowResetTimer);
                    windowResetTimer = null;
                }
                const state = readRateState();
                if (state.cooldownUntil > Date.now()) return;
                if (state.windowStart > 0 && state.count > 0) {
                    const rem = (state.windowStart + RATE_WINDOW_MS) - Date.now();
                    if (rem <= 0) {
                        clearRateState();
                    } else {
                        windowResetTimer = setTimeout(() => {
                            windowResetTimer = null;
                            const cur = readRateState();
                            if (!cur.cooldownUntil && cur.windowStart > 0 && Date.now() - cur.windowStart >= RATE_WINDOW_MS) {
                                clearRateState();
                            }
                        }, rem + 25);
                    }
                }
            }

            function updateBannerFlashZone(greenPct) {
                const bezel = document.getElementById('crt-bezel');
                const banner = document.getElementById('cooldown-banner');
                if (!bezel || !banner) return;
                const br = bezel.getBoundingClientRect();
                const tr = banner.getBoundingClientRect();
                if (br.height <= 0) return;
                const centerPct = ((tr.top + tr.height * 0.5 - br.top) / br.height) * 100;
                banner.classList.toggle('is-red-zone', greenPct <= centerPct);
            }

            function applyCooldownStep() {
                if (isEnteringCooldown) return;
                const stage = document.getElementById('crt-stage');
                const tint = document.getElementById('crt-cooldown-tint');
                const banner = document.getElementById('cooldown-banner');
                if (!stage || !tint) return;

                const state = readRateState();
                const now = Date.now();

                if (!state.cooldownUntil || now >= state.cooldownUntil) {
                    const hadCooldown = stage.classList.contains('is-cooldown');
                    stopCooldownTimers();
                    if (state.cooldownUntil > 0 || (state.windowStart > 0 && now - state.windowStart >= RATE_WINDOW_MS)) {
                        clearRateState();
                    }
                    stage.classList.remove('is-cooldown');
                    if (banner) banner.classList.remove('is-red-zone');
                    tint.style.background = '';
                    setSearchInputsDisabled(false);
                    scheduleWindowReset();
                    if (hadCooldown) playCooldownClearChime();
                    return;
                }

                const total = Math.max(1, state.cooldownUntil - state.cooldownStart);
                const elapsed = Math.max(0, now - state.cooldownStart);
                const ratio = Math.min(0.9999, elapsed / total);
                const stepIdx = Math.min(COOLDOWN_STEPS - 1, Math.floor(ratio * COOLDOWN_STEPS));
                const greenPct = (stepIdx / COOLDOWN_STEPS) * 100;

                if (lastCooldownStepIdx !== -1 && stepIdx !== lastCooldownStepIdx) {
                    playCooldownStepTick();
                }
                lastCooldownStepIdx = stepIdx;

                stage.classList.add('is-cooldown');
                setSearchInputsDisabled(true);
                tint.style.background = `linear-gradient(to bottom, #33ff66 0%, #33ff66 ${greenPct}%, #ff3838 ${greenPct}%, #ff3838 100%)`;
                updateBannerFlashZone(greenPct);
            }

            function startCooldownMonitor(withEnterSweep) {
                stopCooldownTimers();

                if (!isCooldownActive()) {
                    applyCooldownStep();
                    return;
                }

                const stage = document.getElementById('crt-stage');
                const tint = document.getElementById('crt-cooldown-tint');
                const banner = document.getElementById('cooldown-banner');

                if (withEnterSweep && stage && tint) {
                    isEnteringCooldown = true;
                    stage.classList.add('is-cooldown');
                    setSearchInputsDisabled(true);
                    if (banner) banner.classList.add('is-red-zone');
                    let step = 0;
                    tint.style.background = 'linear-gradient(to bottom, #ff3838 0%, #ff3838 0%, #33ff66 0%, #33ff66 100%)';
                    setMainsHumLevel(0.045, 0.25);
                    playCooldownLockoutSlam();

                    enterAnimTimer = setInterval(() => {
                        step++;
                        const redPct = (step / COOLDOWN_STEPS) * 100;
                        tint.style.background = `linear-gradient(to bottom, #ff3838 0%, #ff3838 ${redPct}%, #33ff66 ${redPct}%, #33ff66 100%)`;
                        if (step >= COOLDOWN_STEPS) {
                            clearInterval(enterAnimTimer);
                            enterAnimTimer = null;
                            isEnteringCooldown = false;
                            applyCooldownStep();
                            startCooldownAlarmLoop();
                            cooldownTimer = setInterval(applyCooldownStep, 250);
                        }
                    }, 22);
                } else {
                    setMainsHumLevel(0.045, 0.4);
                    applyCooldownStep();
                    startCooldownAlarmLoop();
                    cooldownTimer = setInterval(applyCooldownStep, 250);
                }
            }

            function recordSearchHit() {
                const now = Date.now();
                let state = readRateState();

                if (!state.windowStart || now - state.windowStart >= RATE_WINDOW_MS) {
                    state = { windowStart: now, count: 1, cooldownStart: 0, cooldownUntil: 0 };
                } else {
                    state.count += 1;
                }

                writeRateState(state);
                scheduleWindowReset();
                return state.count >= RATE_LIMIT_COUNT;
            }

            function finalizeFifthSearchCooldown() {
                const now = Date.now();
                const state = readRateState();
                if (!state.windowStart || state.count < RATE_LIMIT_COUNT) return;

                const elapsed = now - state.windowStart;
                const remaining = RATE_WINDOW_MS - elapsed;

                if (remaining <= 0) {
                    clearRateState();
                    return;
                }

                writeRateState({
                    windowStart: state.windowStart,
                    count: state.count,
                    cooldownStart: now,
                    cooldownUntil: now + remaining
                });

                startCooldownMonitor(true);
            }
