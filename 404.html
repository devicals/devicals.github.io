<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — devicals</title>
    <link rel="icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function () {
            var pathname = window.location.pathname || '/';
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            var cleanPath = pathname.replace(/\/+$/, '');
            var decodedCleanPath = cleanPath;
            try {
                decodedCleanPath = decodeURIComponent(cleanPath);
            } catch (e) {}
            var segments = decodedCleanPath.split('/').filter(Boolean);
            var lastSegment = segments[segments.length - 1] || '';

            var showNotFound = function () {
                document.documentElement.classList.add('nf-ready');
            };

            var getRepoSlug = function () {
                var host = (window.location.hostname || '').toLowerCase();
                if (host.endsWith('.github.io')) {
                    var owner = host.split('.')[0];
                    if (owner) return owner + '/' + host;
                }
                return 'devicals/devicals.github.io';
            };

            if (lastSegment) {
                var dirPath = segments.length > 1 ? '/' + segments.slice(0, -1).join('/') : '';
                var hasHtmlExt = /\.html?$/i.test(lastSegment);
                var hasAnyExt = /\.[a-z0-9]+$/i.test(lastSegment);
                var baseName = lastSegment.replace(/\.html?$/i, '');

                if (dirPath === '' && baseName.toLowerCase() === '404') {
                    showNotFound();
                } else {
                    var candidates = [];
                    var addCandidate = function (p) {
                        var encoded = encodeURI(p);
                        if (candidates.indexOf(encoded) === -1 && encoded !== pathname) {
                            candidates.push(encoded);
                        }
                    };

                    if (hasHtmlExt) {
                        addCandidate(dirPath + '/' + baseName + '.html');
                        addCandidate(dirPath + '/' + baseName.toUpperCase() + '.html');
                        addCandidate(dirPath + '/' + baseName.toLowerCase() + '.html');
                        addCandidate(dirPath + '/' + baseName.charAt(0).toUpperCase() + baseName.slice(1) + '.html');
                        addCandidate(dirPath + '/' + baseName.charAt(0).toUpperCase() + baseName.slice(1).toLowerCase() + '.html');
                        addCandidate(dirPath + '/' + baseName + '.htm');
                    } else {
                        addCandidate(dirPath + '/' + lastSegment + '.html');
                        addCandidate(dirPath + '/' + lastSegment.toUpperCase() + '.html');
                        addCandidate(dirPath + '/' + lastSegment.toLowerCase() + '.html');
                        addCandidate(dirPath + '/' + lastSegment.charAt(0).toUpperCase() + lastSegment.slice(1) + '.html');
                        addCandidate(dirPath + '/' + lastSegment.charAt(0).toUpperCase() + lastSegment.slice(1).toLowerCase() + '.html');
                        addCandidate(dirPath + '/' + lastSegment + '.htm');
                        if (hasAnyExt) {
                            addCandidate(dirPath + '/' + lastSegment);
                            addCandidate(dirPath + '/' + lastSegment.toLowerCase());
                            addCandidate(dirPath + '/' + lastSegment.toUpperCase());
                        }
                        addCandidate(dirPath + '/' + lastSegment + '/index.html');
                        addCandidate(dirPath + '/' + lastSegment.toLowerCase() + '/index.html');
                    }

                    (async function () {
                        for (var i = 0; i < candidates.length; i++) {
                            try {
                                var res = await fetch(candidates[i], { method: 'HEAD' });
                                if (res.ok) {
                                    var finalPath = '';
                                    try {
                                        finalPath = new URL(res.url, window.location.origin).pathname;
                                    } catch (e) {}
                                    if (!/\/404\.html?$/i.test(finalPath)) {
                                        window.location.replace(candidates[i] + search + hash);
                                        return;
                                    }
                                }
                            } catch (e) {}
                        }

                        var repoSlug = getRepoSlug();
                        var reqRel = segments.join('/').toLowerCase();
                        var reqBaseRel = (segments.length > 1 ? segments.slice(0, -1).join('/') + '/' : '') + baseName;
                        var reqBaseLower = reqBaseRel.toLowerCase();
                        var matchPath = null;

                        try {
                            var treeRes = await fetch('https://api.github.com/repos/' + repoSlug + '/git/trees/HEAD?recursive=1');
                            if (treeRes.ok) {
                                var treeData = await treeRes.json();
                                if (treeData && Array.isArray(treeData.tree)) {
                                    var blobs = treeData.tree.filter(function (item) {
                                        return item && item.type === 'blob' && item.path && item.path.toLowerCase() !== '404.html';
                                    });
                                    var targets = [];
                                    if (hasHtmlExt || hasAnyExt) targets.push(reqRel);
                                    targets.push(reqBaseLower + '.html');
                                    targets.push(reqBaseLower + '.htm');
                                    if (!hasHtmlExt) {
                                        targets.push(reqRel + '/index.html');
                                        targets.push(reqRel + '/index.htm');
                                    }
                                    for (var t = 0; t < targets.length; t++) {
                                        var found = blobs.find(function (b) {
                                            return b.path.toLowerCase() === targets[t];
                                        });
                                        if (found) {
                                            matchPath = '/' + encodeURI(found.path).replace(/^\/+/, '');
                                            break;
                                        }
                                    }
                                }
                            }
                        } catch (e) {}

                        if (!matchPath) {
                            try {
                                var apiUrl = 'https://api.github.com/repos/' + repoSlug + '/contents' + encodeURI(dirPath || '');
                                var apiRes = await fetch(apiUrl);
                                if (apiRes.ok) {
                                    var items = await apiRes.json();
                                    if (Array.isArray(items)) {
                                        var targetLower = (baseName + '.html').toLowerCase();
                                        var match = items.find(function (item) {
                                            return item.type === 'file' && item.name && item.name.toLowerCase() !== '404.html' &&
                                                (item.name.toLowerCase() === targetLower || (hasAnyExt && item.name.toLowerCase() === lastSegment.toLowerCase()));
                                        });
                                        if (match) {
                                            matchPath = encodeURI(dirPath) + '/' + encodeURIComponent(match.name);
                                        }
                                    }
                                }
                            } catch (e) {}
                        }

                        if (matchPath && matchPath !== pathname) {
                            window.location.replace(matchPath + search + hash);
                            return;
                        }

                        showNotFound();
                    })();
                }
            } else {
                showNotFound();
            }

            var isDark = localStorage.getItem('dark-mode') !== 'false';
            var theme = localStorage.getItem('theme') || 'primary';
            if (localStorage.getItem('seasonal-pride-themes') !== 'false') {
                var now = new Date();
                var m = now.getMonth() + 1;
                var d = now.getDate();
                if (m === 6) theme = 'pride';
                else if (m === 11 && d >= 13 && d <= 19) theme = 'trans';
            }
            if (!isDark) {
                if (theme === 'pride') theme = 'pride-light';
                else if (theme === 'trans') theme = 'trans-light';
                else theme = 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        html:not(.nf-ready) .nf-card {
            visibility: hidden;
        }
        .nf-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .nf-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-panel);
            border-top: 2px solid var(--edge-hi);
            border-left: 2px solid var(--edge-hi);
            border-right: 2px solid var(--edge-lo);
            border-bottom: 2px solid var(--edge-lo);
            padding: 0 24px 24px 24px;
            font-family: var(--font-ui);
        }
        .nf-titlebar {
            font-size: 12px;
            font-weight: bold;
            color: var(--destructive);
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border-bright);
            margin: 0 -24px 20px -24px;
            padding: 9px 14px;
            letter-spacing: 0.8px;
        }
        .nf-code {
            font-size: 48px;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 10px;
        }
        .nf-path {
            background: var(--bg-sunken);
            border: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 12px;
            color: var(--fg-muted);
            margin: 14px 0 20px 0;
            word-break: break-all;
        }
        .nf-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nf-actions .ui-btn {
            width: auto;
            margin: 0;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="nf-wrap">
        <div class="nf-card">
            <div class="nf-titlebar">error 404 // signal lost</div>
            <div class="nf-code">404</div>
            <div style="font-size:14px; color:var(--fg-main); margin-bottom:6px;">page not found</div>
            <div style="font-size:12px; color:var(--fg-muted);">the requested resource does not exist or has been moved.</div>
            <div class="nf-path" id="nf-path"></div>
            <div class="nf-actions">
                <a href="/index.html#Index/Home" class="ui-btn" style="border-color:var(--accent); color:var(--accent) !important;">return home</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('nf-path').textContent = 'path: ' + window.location.pathname + window.location.search + window.location.hash;
    </script>
    <script src="/js/bg-canvas.js"></script>
</body>
</html>
